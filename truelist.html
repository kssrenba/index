<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Personagens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fcfcf9;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .strikethrough {
            text-decoration: line-through;
            color: #94a3b8;
        }
    </style>
</head>
<body class="p-4 sm:p-8 max-w-lg mx-auto border-x border-slate-200 min-h-screen bg-white shadow-sm">

    <!-- Total Highlighted Counter -->
    <header class="mb-8 pb-6 border-b border-slate-200 text-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-1">Total Marcados</span>
        <div id="counter" class="text-6xl font-black text-slate-900">0 / 0</div>
    </header>

    <!-- Anime List Container -->
    <main id="list-container" class="space-y-6">
        <!-- Generated by JavaScript -->
    </main>

    <script>
        const animeData = [
            { name: "Code Geass", characters: ["Cornelia li Britania"] },
            { name: "Hunter x Hunter (HxH)", characters: ["Killua", "Kurapika"] },
            { name: "One Piece", characters: ["Zoro", "Law", "Luffy", "Shanks", "Hancock", "Perona", "Katakuri", "Aokiji", "Enel"] },
            { name: "Jujutsu Kaisen (JJK)", characters: ["Gojo", "Maki", "Mechamaru", "Nanami", "Mei Mei", "Mahito", "Sukuna", "Choso", "Toji", "Uro", "Higuruma", "Tengel (Original Form)"] },
            { name: "Sousou no Frieren", characters: ["Frieren", "Fern", "Himmel"] },
            { name: "Oshi no Ko", characters: ["Akane", "Kana", "Ai", "Mem", "Miyako Saitou"] },
            { name: "Bunny Girl Senpai", characters: ["Sakuta", "Mai Sakurajima", "Rio Futaba"] },
            { name: "Haikyuu!!", characters: ["Hinata Shoyo (from concrete)", "Kageyama", "Ryunosuke Tanaka", "Oikawa"] },
            { name: "Mushoku Tensei", characters: ["Orsted"] },
            { name: "Re:Zero", characters: ["Julius", "Priscilla Barielle"] },
            { name: "Cyberpunk: Edgerunners", characters: ["Lucy", "Rebecca"] },
            { name: "Dr. Stone", characters: ["Senku", "Kohaku", "Chrome", "Kaseki", "Joel Gear"] },
            { name: "Nanatsu no Taizai", characters: ["Merlin", "Escanor", "Ban"] },
            { name: "Kingdom", characters: ["Lord Biao", "Tou (Teng)", "Meng Wu", "Yang Duanhe", "Huan Yi"] },
            { name: "Attack on Titan (AOT)", characters: ["Eren", "Levi", "Mikasa", "Annie"] },
            { name: "Grand Blue", characters: ["Iori", "Kohei", "Azusa", "Chisa (Nice Body)", "Sakurako Busujima"] },
            { name: "Classroom of the Elite (COTE)", characters: ["Ichinose", "Ichika", "Tsubasa Nanase", "Horikita", "Kakeru Ryūen"] },
            { name: "My Hero Academia (MHA)", characters: ["Aizawa", "Shigaraki", "Hawks", "Overhaul"] },
            { name: "Dandadan", characters: ["Okarun", "Momo", "Momo Grandmother", "Pink Hair Girl (Aira)"] },
            { name: "Tensura (Slime)", characters: ["Rimuru", "Benimaru", "Souei"] },
            { name: "One Punch Man (OPM)", characters: ["Tatsumaki", "Genos", "Metal Bat"] },
            { name: "The Eminence in Shadow", characters: ["Alpha", "Delta", "Aurora", "Tatsumaki"] },
            { name: "Gachiakuta", characters: ["Rudo", "Riyo", "Jabber"] },
            { name: "Hell's Paradise", characters: ["Sagiri", "Gabimaru", "Yuzuriha", "Shion"] },
            { name: "Vinland Saga", characters: ["Askeladd", "Canute", "Thorfinn"] },
            { name: "Fragrante", characters: ["Subaru"] },
            { name: "Sentenced to Be a Hero", characters: ["Xylo Forbartz", "Patausche Kivia"] },
            { name: "Wistoria: Wand and Sword", characters: ["Will", "ELFARIA", "Julius"] },
            { name: "Roshidere", characters: ["Alya", "Ayano", "Masachika Kuze", "Yuki"] },
            { name: "Food Wars", characters: ["Ikumi Mito", "Soma Yukihira", "Alice Nakiri", "Ryo Kurokiba"] },
            { name: "Danmachi", characters: ["Freya", "Ryuu"] },
            { name: "Welcome to the Ballroom", characters: ["Tatara Fujita", "Shizuku Hanaoka"] },
            { name: "100 Girlfriends", characters: ["Cientista Corpo Adulto (Kusuri)"] }
        ];

        let state = {};

        function loadState() {
            try {
                const saved = localStorage.getItem('simple_anime_notepad');
                if (saved) state = JSON.parse(saved);
            } catch (e) {
                state = {};
            }
        }

        function saveState() {
            try {
                localStorage.setItem('simple_anime_notepad', JSON.stringify(state));
            } catch (e) {}
            updateCounter();
        }

        function updateCounter() {
            let total = 0;
            let checked = 0;

            animeData.forEach((anime, aIdx) => {
                anime.characters.forEach((_, cIdx) => {
                    total++;
                    if (state[`${aIdx}_${cIdx}`]) checked++;
                });
            });

            document.getElementById('counter').textContent = `${checked} / ${total}`;
        }

        function render() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            animeData.forEach((anime, aIdx) => {
                const section = document.createElement('div');
                section.className = 'border-b border-slate-100 pb-4';

                // Contador individual do anime
                let animeTotal = anime.characters.length;
                let animeChecked = 0;
                anime.characters.forEach((_, cIdx) => {
                    if (state[`${aIdx}_${cIdx}`]) animeChecked++;
                });

                let html = `
                    <div class="flex items-baseline justify-between mb-2">
                        <h2 class="font-bold text-lg text-slate-800">${anime.name}</h2>
                        <span class="text-xs font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">${animeChecked} / ${animeTotal}</span>
                    </div>
                `;
                html += `<div class="space-y-1.5 pl-1">`;

                anime.characters.forEach((char, cIdx) => {
                    const key = `${aIdx}_${cIdx}`;
                    const isChecked = !!state[key];

                    // Substituído <label> por <div> e removido select-none para permitir seleção de texto
                    html += `
                        <div class="flex items-center gap-2.5 py-0.5">
                            <input 
                                type="checkbox" 
                                ${isChecked ? 'checked' : ''} 
                                onchange="toggleCheck('${key}')"
                                class="w-4 h-4 rounded border-slate-300 text-slate-800 focus:ring-0 cursor-pointer"
                            >
                            <span class="text-sm ${isChecked ? 'strikethrough' : 'text-slate-700'} select-text">${char}</span>
                        </div>
                    `;
                });

                html += `</div>`;
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        function toggleCheck(key) {
            state[key] = !state[key];
            saveState();
            render();
        }

        window.onload = function() {
            loadState();
            updateCounter();
            render();
        };
    </script>
</body>
</html>
