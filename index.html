          object-fit: contain;
          border-radius: 0;
          box-shadow: none;
          transform-origin: left center;
          transition: transform 0.15s ease, filter 0.15s ease;
        }

        .rank-mal-label--anime-planet .anime-planet-btn-logo {
          display: block;
          width: auto;
          height: 17px;
          max-width: none;
          object-fit: contain;
          border-radius: 0;
          box-shadow: none;
          transform-origin: left center;
          transition: transform 0.15s ease, filter 0.15s ease;
        }

        /* Nessa cópia (embaixo do pôster) o logo do Anime-Planet fica sobre um
          fundo mais escuro/variado que no painel, então puxa um pouco de
          brilho/saturação pra compensar e ficar com a mesma cor viva das
          outras cópias. */
        .poster-lightbox-media-watchnow .rank-mal-label--anime-planet .anime-planet-btn-logo {
          filter: brightness(1.08) saturate(1.6) contrast(1.1);
        }

        .rank-mal-label--mal .mal-btn-logo {
          display: block;
          width: auto;
          height: 17px;
          max-width: none;
          object-fit: contain;
          border-radius: 0;
          box-shadow: none;
          transform-origin: left center;
          transition: transform 0.15s ease, filter 0.15s ease;
        }

        a.rank-mal-label--anime-planet:hover .anime-planet-btn-logo,
        a.rank-mal-label--anime-planet:focus-visible .anime-planet-btn-logo,
        a.rank-mal-label--crunchyroll:hover .crunchyroll-btn-logo,
        a.rank-mal-label--crunchyroll:focus-visible .crunchyroll-btn-logo,
        a.rank-mal-label--netflix:hover .netflix-btn-logo,
        a.rank-mal-label--netflix:focus-visible .netflix-btn-logo,
        a.rank-mal-label--mal:hover .mal-btn-logo,
        a.rank-mal-label--mal:focus-visible .mal-btn-logo {
          filter: brightness(1.15);
        }

        .poster-lightbox-media-watchnow a.rank-mal-label--anime-planet:hover .anime-planet-btn-logo,
        .poster-lightbox-media-watchnow a.rank-mal-label--anime-planet:focus-visible .anime-planet-btn-logo {
          filter: brightness(1.5) saturate(2.2) contrast(1.3);
        }

        a.rank-mal-label--anime-planet svg,
        a.rank-mal-label--crunchyroll svg,
        a.rank-mal-label--netflix svg,
        a.rank-mal-label--mal svg {
          opacity: 0.7;
          transition: opacity 0.15s ease;
        }

        a.rank-mal-label--anime-planet:hover svg,
        a.rank-mal-label--anime-planet:focus-visible svg,
        a.rank-mal-label--crunchyroll:hover svg,
        a.rank-mal-label--crunchyroll:focus-visible svg,
        a.rank-mal-label--netflix:hover svg,
        a.rank-mal-label--netflix:focus-visible svg,
        a.rank-mal-label--mal:hover svg,
        a.rank-mal-label--mal:focus-visible svg {
          opacity: 1;
        }

        @media (min-width: 761px) {
          a.rank-mal-label--anime-planet svg,
          a.rank-mal-label--crunchyroll svg,
          a.rank-mal-label--netflix svg,
          a.rank-mal-label--mal svg {
            display: none;
          }
        }

        a.rank-mal-label--crunchyroll {
          display: inline-flex;
        }

        a.rank-mal-label--crunchyroll:hover,
        a.rank-mal-label--crunchyroll:focus-visible {
          color: #ff640a;
        }

        a.rank-mal-label--netflix {
          display: inline-flex;
        }

        a.rank-mal-label--netflix:hover,
        a.rank-mal-label--netflix:focus-visible {
          color: #e50914;
        }

        a.rank-mal-label--mal {
          display: inline-flex;
        }

        a.rank-mal-label--mal:hover,
        a.rank-mal-label--mal:focus-visible {
          color: #2e51a2;
        }

        /* Botão do MyAnimeList dentro do lightbox do "All Animes": no PC é um
          link de verdade para a lista pessoal do MyAnimeList (clicável, com
          hover); no mobile continua sendo apenas o logo, sem ação — por isso
          o pointer-events é desativado por padrão (mobile-first) e só
          reativado a partir de 761px (ver regra @media logo abaixo). */
        .rank-mal-mal-row > a.rank-mal-label--mal {
          display: inline-flex;
          align-items: center;
          justify-content: flex-start;
          gap: 5px;
          cursor: default;
          pointer-events: none;
        }

        @media (min-width: 761px) {
          .rank-mal-mal-row > a.rank-mal-label--mal {
            cursor: pointer;
            pointer-events: auto;
          }

          .rank-mal-mal-row > a.rank-mal-label--mal:hover,
          .rank-mal-mal-row > a.rank-mal-label--mal:focus-visible {
            color: var(--mal-blue);
          }
        }

        /* Linha que agrupa o link/logo do MyAnimeList com a setinha de
          "abrir/fechar todos" (".rank-mal-toggle-all") lado a lado — sem
          esse wrapper, os dois cairiam em linhas separadas, já que ".rank-
          mal" é flex-column. */
        .rank-mal-mal-row {
          display: flex;
          align-items: center;
          gap: 6px;
        }

        /* Setinha ao lado do logo do MyAnimeList: abre/fecha de uma vez só
          todas as linhas de nome real das temporadas (ver
          "toggleAllMalRealnameRows" no JS). Reaproveita o mesmo visual da
          setinha individual de cada temporada. */
        .rank-mal-toggle-all {
          display: inline-flex;
          align-items: center;
          cursor: pointer;
          border: none;
          background: none;
          padding: 2px;
          font: inherit;
        }

        .rank-mal-toggle-all .rank-mal-name-arrow {
          width: 9px;
          height: 9px;
          stroke: var(--muted);
          transition: transform 0.2s ease, stroke 0.18s ease;
        }

        .rank-mal-toggle-all:hover .rank-mal-name-arrow,
        .rank-mal-toggle-all:focus-visible .rank-mal-name-arrow {
          stroke: var(--text);
        }

        .rank-mal-toggle-all.open .rank-mal-name-arrow {
          transform: rotate(180deg);
        }

        .rank-mal-rows {
          display: flex;
          flex-direction: column;
          row-gap: 5px;
        }

        .rank-mal-row {
          display: flex;
          align-items: baseline;
          justify-content: center;
          column-gap: 10px;
        }

        .rank-mal-rows:has(> .rank-mal-row:only-child) .rank-mal-row {
          column-gap: 8px;
        }

        .rank-mal-content {
          flex: 0 1 auto;
          min-width: 0;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* Envelope em volta do pontilhado + nota. Por padrão "invisível"
          (display: contents), então em quase todo lugar (grid do PC, linhas
          alinháveis, etc.) o comportamento continua idêntico a antes, como se
          o wrapper nem existisse — dots e nota seguem como itens
          independentes. Ele só vira uma caixa flex de verdade dentro do
          lightbox mobile (ver regra específica mais abaixo), justamente para
          resolver o bug de quebra de linha das linhas irregulares (filmes,
          especiais, títulos com ":"). */
        .rank-mal-score {
          display: contents;
        }

        /* No PC (telas maiores que o breakpoint mobile), a linha volta a ficar
          espalhada: nome da temporada na esquerda, nota na direita. No celular
          (regra acima) continua tudo centralizado. */
        @media (min-width: 761px) {
          .rank-mal-row {
            justify-content: space-between;
          }

          .rank-mal-content {
            flex: 0 1 auto;
          }

          /* Quebra manual (\n nos dados) usada só pra apertar a caixa do título
            no mobile (ver .rank-mal-linebreak lá embaixo) — no PC ela some,
            então o texto volta a ficar numa linha só. */
          .rank-mal-linebreak {
            display: none;
          }
        }

        /* ── Alinhamento de episódios entre temporadas consecutivas ──
          Quando duas ou mais linhas "numéricas" (ex: "1ª temporada: 25
          episódios") aparecem seguidas, elas são agrupadas em
          .rank-mal-align-group para que o texto de episódios comece sempre
          na mesma posição horizontal. Linhas "grandes"/irregulares (filmes,
          especiais com duração tipo "1h24m") ficam de fora do grupo e não
          influenciam esse alinhamento.
          No mobile o grupo também vira grid (2 colunas: conteúdo + nota),
          mas compacto (inline-grid, largura de conteúdo) e centralizado no
          card, em vez de esticado de ponta a ponta como no PC. */
        .rank-mal-align-group {
          display: contents;
        }

        @media (min-width: 761px) {
          .rank-mal-align-group {
            display: grid;
            grid-template-columns: max-content max-content 1fr max-content;
            column-gap: 4px;
            row-gap: 5px;
          }

          .rank-mal-align-group .rank-mal-row,
          .rank-mal-align-group .rank-mal-content {
            display: contents;
          }

          /* Linhas "irregulares" (filmes, especiais, spacers) dentro do grupo
            de alinhamento: em vez de virar itens soltos do grid (o que
            quebraria o layout, já que elas não têm 3 partes como as linhas
            numéricas), ocupam a largura inteira da linha do grid e mantêm
            seu próprio layout flex interno, igual a uma linha fora do grupo. */
          .rank-mal-align-group .rank-mal-row.rank-mal-row-break {
            display: flex;
            grid-column: 1 / -1;
          }

          .rank-mal-align-group .rank-mal-row.rank-mal-row-break .rank-mal-content {
            display: inline-flex;
          }
        }

        @media (max-width: 760px) {
          .rank-mal-align-group {
            display: inline-grid;
            grid-template-columns: max-content max-content;
            column-gap: 10px;
            row-gap: 5px;
            align-self: center;
          }

          .rank-mal-align-group .rank-mal-row {
            display: contents;
          }

          /* Linhas irregulares (filmes, especiais, spacers) ocupam as duas
            colunas e mantêm o próprio layout flex centralizado, igual a uma
            linha fora do grupo. */
          .rank-mal-align-group .rank-mal-row.rank-mal-row-break {
            display: flex;
            grid-column: 1 / -1;
            justify-content: flex-start;
          }

          a.rank-mal-label:not(.rank-mal-label--anime-planet):not(.rank-mal-label--crunchyroll):not(.rank-mal-label--netflix):not(.rank-mal-label--mal) {
            display: none;
          }
        }

        .rank-mal-season {
          font-family: "Inter", sans-serif;
          font-weight: 600;
          font-size: 14px;
          color: var(--text);
          white-space: nowrap;
          text-shadow: 0 1px 2px rgba(0,0,0,0.85);
        }

        /* Algarismo romano (I, II, III...) ao final do nome da temporada,
          estilizado com fonte serifada e linhas acima/abaixo, tipo numeração
          clássica romana. */
        .rank-mal-roman {
          font-family: "Times New Roman", Times, serif;
        }

        .rank-mal-eps {
          font-family: "Inter", sans-serif;
          font-size: 14px;
          font-weight: 400;
          color: var(--muted);
          white-space: nowrap;
          text-shadow: 0 1px 2px rgba(0,0,0,0.85);
        }

        /* ── Setinha "▾" à esquerda do nome da temporada (ex: "1ª temporada") ──
          Só aparece quando aquela linha tem um "malName" definido nos dados
          (o nome real/oficial da temporada no MyAnimeList). Clicar nela (ou
          no nome da temporada) expande/colapsa a linha logo abaixo com esse
          nome — ver ".rank-mal-realname-row" mais abaixo e o listener
          delegado em "lightboxMal" (handleWatchNowAreaClick, no JS). Por
          enquanto só é usada no Global Ranking (ver "isWatchingNow" no JS). */
        .rank-mal-season--toggleable {
          display: inline-flex;
          /* "baseline" (não "center"): a fonte do algarismo romano (Times New
            Roman, em ".rank-mal-roman") tem métricas verticais diferentes da
            Inter usada no resto do texto, então centralizar pela altura da
            caixa deixa o "I"/"II"/"III" desalinhado da linha de base do
            "temporada". Baseline alinha os dois pelo mesmo "chão" do texto. */
          align-items: baseline;
          /* Sem isso, o espaço entre o texto ("3ª temporada ") e o span do
            algarismo romano (".rank-mal-roman") é colapsado pelo flexbox —
            cada um vira um flex item separado e o navegador engole o espaço
            que sobra na borda do item de texto, colando "temporada" no "I"/
            "II"/"III". O gap reconstrói esse respiro entre os itens. */
          gap: 0.25em;
          cursor: pointer;
          border: none;
          background: none;
          padding: 0;
          font: inherit;
        }

        .rank-mal-name-arrow {
          width: 9px;
          height: 9px;
          flex: 0 0 auto;
          stroke: var(--muted);
          transition: transform 0.2s ease, stroke 0.18s ease;
        }

        /* Linha extra (colapsada por padrão) com o nome real da temporada no
          MyAnimeList. Especificidade alta de propósito, pra vencer a regra
          ".rank-mal-align-group .rank-mal-row.rank-mal-row-break" (display:
          flex) enquanto ainda não tiver a classe ".open". */
        .rank-mal-row.rank-mal-row-break.rank-mal-realname-row:not(.open) {
          display: none;
        }

        .rank-mal-realname-row {
          justify-content: flex-start;
          padding-top: 0;
          margin-top: -10px;
        }

        .rank-mal-realname {
          display: block;
          min-width: 0;
          max-width: 100%;
          font-family: "Inter", sans-serif;
          font-size: 10.5px;
          font-style: normal;
          font-weight: 600;
          letter-spacing: 0.5px;
          color: var(--muted);
          opacity: 0.65;
          text-align: left;
          text-transform: uppercase;
          text-shadow: 0 1px 2px rgba(0,0,0,0.85);
          /* Quando o nome real da temporada é grande demais pra caber numa
            linha só, corta com reticências (...) em vez de estourar a
            largura do card ou quebrar em várias linhas. */
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* ── Pontilhado entre o texto (temporada/episódios) e a nota ──
          Estilo "sumário de livro": os pontinhos preenchem o espaço
          sobrando, empurrando a nota pra ponta direita. Só aparece no PC;
          no celular o layout já é centralizado e compacto, então some. */
        .rank-mal-dots {
          flex: 1 1 auto;
          align-self: center;
          min-width: 14px;
          height: 4px;
          margin: 0 2px;
          background-image: radial-gradient(circle, rgba(255,255,255,0.3) 1.1px, transparent 1.3px);
          background-repeat: repeat-x;
          background-position: bottom left;
          background-size: 7px 4px;
        }

        @media (max-width: 760px) {
          .rank-mal-dots {
            display: none;
          }
        }

        .rank-mal-spacer {
          height: 2px;
          width: 100%;
        }

        .rank-mal-note {
          flex: 0 0 auto;
          align-self: center;
          box-sizing: border-box;
          width: 50px;
          height: 26px;
          font-family: "Inter", sans-serif;
          font-weight: 800;
          font-size: 14px;
          color: var(--mal-blue);
          white-space: nowrap;
          display: inline-flex;
          justify-content: center;
          align-items: center;
          gap: 2px;
          padding: 0;
          border-radius: 7px;
          background: linear-gradient(135deg, rgba(127,178,255,0.22), rgba(127,178,255,0.07));
          border: 1px solid rgba(127,178,255,0.32);
          box-shadow: 0 1px 4px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
          text-shadow: 0 1px 2px rgba(0,0,0,0.55);
          transition: filter 0.18s ease, transform 0.18s ease;
          cursor: default;
        }

        .rank-mal-note:not(.empty):not(.unwatched):hover {
          filter: brightness(1.18);
          transform: translateY(-1px);
        }

        .rank-mal-note .rank-mal-note-max {
          font-weight: 600;
          opacity: 0.7;
          text-shadow: none;
        }

        /* ── Paleta por faixa de nota (0-5 mesma cor, depois uma cor própria
          pra cada nota de 6 a 10), do mais discreto ao mais vibrante. ── */
        .rank-mal-note.tier-05 {
          color: var(--mal-low);
          background: rgba(169,164,189,0.12);
          border-color: rgba(169,164,189,0.22);
        }

        .rank-mal-note.tier-6 {
          color: var(--mal-tier6);
          background: linear-gradient(135deg, rgba(94,196,201,0.22), rgba(94,196,201,0.06));
          border-color: rgba(94,196,201,0.35);
        }

        .rank-mal-note.tier-7 {
          color: var(--mal-tier7);
          background: linear-gradient(135deg, rgba(129,209,133,0.22), rgba(129,209,133,0.06));
          border-color: rgba(129,209,133,0.35);
        }

        .rank-mal-note.tier-8 {
          color: var(--mal-blue);
          background: linear-gradient(135deg, rgba(127,178,255,0.22), rgba(127,178,255,0.07));
          border-color: rgba(127,178,255,0.32);
        }

        .rank-mal-note.tier-9 {
          color: var(--mal-tier9);
          background: linear-gradient(135deg, rgba(199,146,234,0.24), rgba(199,146,234,0.07));
          border-color: rgba(199,146,234,0.4);
        }

        /* Nota 10: destaque dourado máximo, pra saltar aos olhos como favorita. */
        .rank-mal-note.tier-10 {
          color: var(--mal-gold);
          background: linear-gradient(135deg, rgba(244,196,99,0.28), rgba(244,196,99,0.08));
          border-color: rgba(244,196,99,0.45);
        }

        .rank-mal-note.empty {
          color: var(--low-priority);
          font-style: italic;
          font-weight: 400;
          background: none;
          border-color: transparent;
          box-shadow: none;
        }

        /* ── Temporada não assistida (entry.unwatched = true) ──
          Risca o nome/episódios da temporada e troca a nota por "-/-",
          indicando visualmente que aquela parte ainda não foi vista. */
        .rank-mal-row.unwatched .rank-mal-dots {
          background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1.1px, transparent 1.3px);
        }

        .rank-mal-row.unwatched .rank-mal-season,
        .rank-mal-row.unwatched .rank-mal-eps {
          color: rgba(255,255,255,0.25);
          text-decoration: line-through;
          text-decoration-color: rgba(255,255,255,0.25);
          text-decoration-thickness: 1px;
          text-decoration-skip-ink: none;
        }

        .rank-mal-note.unwatched {
          color: rgba(255,255,255,0.25);
          font-style: italic;
          font-weight: 400;
          background: none;
          border-color: transparent;
          box-shadow: none;
        }

        /* ── Blocos de rank (Story / Animation / Characters / Ending...) ── */
        .rank-ratings {
          display: flex;
          flex-direction: column;
          gap: 18px;
          width: 100%;
          padding-top: 8px;
          border-top: 1px solid rgba(255,255,255,0.08);
        }

        .rank-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
        }

        .rank-row-label {
          font-family: var(--font-title);
          font-weight: 600;
          font-size: 15px;
          letter-spacing: 0.03em;
          color: var(--muted);
          flex: 0 0 auto;
          min-width: 140px;
          cursor: pointer;
          user-select: none;
          transition: color 0.15s ease, opacity 0.15s ease;
        }

        .rank-row-label:hover {
          color: var(--text);
        }

        .rank-row-label.excluded {
          text-decoration: line-through;
          text-decoration-thickness: 1.5px;
          opacity: 0.45;
        }

        .rank-row-label.excluded:hover {
          opacity: 0.65;
        }

        .rank-row.excluded .rank-stars {
          opacity: 0.45;
          position: relative;
        }

        .rank-row.excluded .rank-stars::after {
          content: '';
          position: absolute;
          left: 10px;
          right: -2px;
          top: 50%;
          height: 1.5px;
          background: var(--muted);
          transform: translateY(-50%);
          pointer-events: none;
          z-index: 2;
        }

        .rank-row.excluded .rank-score {
          opacity: 0.45;
          text-decoration: line-through;
          text-decoration-thickness: 1.5px;
          text-decoration-color: var(--muted);
        }

        .rank-stars {
          display: flex;
          align-items: center;
          gap: 4px;
          position: relative;
          cursor: pointer;
          user-select: none;
          -webkit-user-select: none;
        }

        .rank-stars .star-zero-hit {
          position: relative;
          width: 8px;
          height: 26px;
          flex: 0 0 auto;
          cursor: pointer;
        }

        .rank-stars .star-slot {
          position: relative;
          width: 26px;
          height: 26px;
          flex: 0 0 auto;
        }

        .rank-stars .star-slot svg {
          position: absolute;
          inset: 0;
          width: 26px;
          height: 26px;
          stroke: rgba(255,255,255,0.28);
          stroke-width: 1.6;
          fill: none;
          pointer-events: none;
          transition: stroke 0.15s ease, fill 0.15s ease;
        }

        .rank-stars .star-slot .star-fill {
          fill: var(--star-color, var(--glow-accent));
          stroke: var(--star-color, var(--glow-accent));
          overflow: hidden;
          display: none;
          transition: fill 0.15s ease, stroke 0.15s ease;
        }

        .rank-stars .star-slot .star-fill.half {
          clip-path: inset(0 50% 0 0);
        }

        .rank-stars .star-half-hit,
        .rank-stars .star-full-hit {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 50%;
          cursor: pointer;
        }
        .rank-stars .star-half-hit { left: 0; }
        .rank-stars .star-full-hit { left: 50%; }

        .rank-score {
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 14px;
          color: var(--star-color, var(--text));
          min-width: 32px;
          text-align: right;
          flex: 0 0 auto;
          transition: color 0.15s ease;
        }

        .rank-average {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 10px;
          padding-top: 16px;
          padding-bottom: 16px;
          border-bottom: 1px solid rgba(255,255,255,0.08);
          width: 100%;
        }

        .rank-average-value {
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 28px;
          color: var(--star-color-avg, var(--glow-accent));
          transition: color 0.15s ease;
        }

        .rank-average-value .rank-average-max {
          font-size: 15px;
          font-weight: 700;
          opacity: 0.55;
          margin-left: 2px;
        }

        @media (max-width: 900px) {
          .poster-lightbox-figure {
            max-width: 96vw;
            gap: 28px;
          }
          .poster-lightbox img {
            width: min(42vw, 380px);
            height: min(82vh, 560px);
          }
          .poster-lightbox-panel {
            width: min(420px, 46vw);
          }
        }

        @media (max-width: 760px) {
          .poster-lightbox {
            align-items: flex-start;
          }

          .poster-lightbox-figure {
            flex-direction: column;
            align-items: center;
            max-height: 90vh;
            max-height: 90dvh;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            margin-top: 76px;
          }

          .poster-lightbox img {
            width: min(80vw, 340px);
            height: min(46vh, 460px);
          }

          .poster-lightbox-panel {
            width: min(92vw, 460px);
            max-height: none;
            align-items: center;
            text-align: center;
          }

          .poster-lightbox-panel .poster-lightbox-list,
          .poster-lightbox-panel .poster-lightbox-title {
            text-align: center;
            justify-content: center;
          }

          .rank-meta {
            justify-content: center;
            text-align: center;
            padding: 16px 14px;
          }
          .rank-meta-item { align-items: center; padding: 0 16px; }

          .rank-row-label { min-width: 104px; }
        }

        /* ── Layout mobile do poster lightbox: pôster pequeno + título lado a
          lado no topo, com tags/ficha técnica/temporadas abaixo, ocupando a
          largura toda. Só se aplica no modo "completo" (com myranks); o modo
          "simples" mantém seu próprio layout em coluna (regra acima, com
          !important, continua tendo prioridade). ── */
        @media (max-width: 760px) {
          .poster-lightbox:not(.simple-mode) .poster-lightbox-figure {
            display: grid;
            grid-template-columns: 150px 1fr;
            grid-template-areas:
              "media title"
              "media info"
              "meta   meta"
              "moreinfo moreinfo"
              "list   list"
              "mal    mal";
            column-gap: 16px;
            row-gap: 18px;
            align-items: start;
            width: 100%;
            max-width: min(94vw, 460px);
            /* .poster-lightbox-figure é o próprio elemento com scroll no mobile
              (overflow-y: auto lá em cima). Sem esse respiro à direita, a
              barra de rolagem nasce colada nas notas (badges) do MyAnimeList
              e fica por cima delas. O padding empurra o conteúdo pra dentro
              e, como '*' usa box-sizing:border-box, não estoura o max-width. */
            padding-right: 10px;
            scrollbar-gutter: stable;
          }

          /* Barra de rolagem mais discreta só dentro do lightbox mobile, pra
            não precisar de um respiro tão grande quanto os 10px genéricos
            (::-webkit-scrollbar do site inteiro). */
          .poster-lightbox:not(.simple-mode) .poster-lightbox-figure::-webkit-scrollbar {
            width: 5px;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-panel {
            display: contents;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-media {
            grid-area: media;
            align-self: start;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-figure .poster-lightbox-media img {
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            /* A sombra padrão (30px/80px) foi pensada pro layout desktop, com
              bastante espaço solto ao redor do pôster. Aqui no grid mobile os
              blocos ficam colados (row-gap de 12px), então aquela sombra
              grande "vazava" pra cima da linha de badges/tags logo abaixo,
              formando uma faixa escura que não seguia o resto do ambient. */
            box-shadow: 0 10px 22px rgba(0,0,0,0.45);
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-media-category {
            margin-top: 8px;
            font-size: 10px;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-title {
            grid-area: title;
            align-self: end;
            margin: 0;
            font-size: 19px;
            line-height: 1.2;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-info {
            grid-area: info;
            align-self: start;
            margin-top: 4px;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-info-break {
            display: block;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-info-break::before {
            content: "";
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-panel .poster-lightbox-title,
          .poster-lightbox:not(.simple-mode) .poster-lightbox-panel .poster-lightbox-info {
            text-align: left;
            justify-content: flex-start;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-panel .poster-lightbox-list {
            grid-area: list;
            text-align: center;
            justify-content: center;
            max-width: 100%;
          }

          .poster-lightbox:not(.simple-mode) .rank-meta {
            grid-area: meta;
            /* Sem cantos arredondados embaixo: esse bloco agora fica "colado"
              no card do RESOURCES ABOUT logo abaixo, formando um único
              cartão contínuo (ver ".poster-lightbox-more-info" abaixo). */
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-more-info {
            grid-area: moreinfo;
            display: flex;
            justify-content: center;
            /* Cancela o row-gap do grid (18px) só aqui, pra esse bloco colar
              direto embaixo do ".rank-meta" (mal/studio/lançamento), formando
              um cartão único em vez de dois cartões separados por espaço. */
            margin-top: -18px;
          }

          .poster-lightbox:not(.simple-mode) .poster-lightbox-more-info:empty {
            display: none;
          }

          /* Como o card fica colado no ".rank-meta" acima, tira o canto
            arredondado de cima e a borda superior daqui (quem faz a linha
            divisória entre os dois agora é só a borda debaixo do ".rank-meta") —
            assim não fica com um traço duplo/grosso na emenda. */
          .poster-lightbox:not(.simple-mode) .poster-lightbox-more-info .watch-now-links {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            border-top: none;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal {
            grid-area: mal;
            display: flex;
            flex-direction: column;
            /* Espaço entre o bloco de temporadas/notas e a linha do
              Anime-Planet/Crunchyroll/MyAnimeList logo abaixo — antes ficava
              colado (8px), deixando tudo mais apertado/poluído. */
            gap: 16px;
            /* Sem isso, a última linha (temporada/filme/especial) fica colada
              no final da área de scroll do lightbox. */
            padding-bottom: 28px;
            /* O espaço entre as tags (#All Animes etc) e o bloco do
              MyAnimeList logo abaixo já vem do row-gap do grid (18px);
              aqui só compensa parte disso pra não somar demais e ficar
              longe demais das tags. */
            margin-top: -6px;
          }

          /* Nos cards do "All Animes" (não Watching Now), o primeiro filho de
            ".rank-mal" é a linha com o link/logo do MyAnimeList (".rank-mal-
            mal-row"), não a linha do Anime-Planet — esse caso não deve
            herdar o gap de 16px acima (pensado pra separar temporadas da
            linha de botões), senão o logo fica longe demais das temporadas
            logo abaixo dele. Cancela parte do gap com margem negativa,
            voltando pros ~8px de antes só aqui. */
          .poster-lightbox:not(.simple-mode) .rank-mal-mal-row {
            margin-bottom: -8px;
          }

          /* Notas por temporada/filme/especial: no mobile, mesmo layout de
            colunas do PC — temporada / episódios / pontilhado / nota — para
            que "episódios" comece sempre na mesma posição horizontal entre
            temporadas, com o pontilhado preenchendo o espaço até a nota.
            Linhas irregulares (filmes, especiais, spacers) saem do grid e
            ocupam a linha inteira, com o próprio pontilhado esticando até a
            nota, igual acontece no PC. */
          .poster-lightbox:not(.simple-mode) .rank-mal-rows {
            display: flex;
            flex-direction: column;
            row-gap: 16px;
            width: 100%;
          }

          /* No lightbox mobile, o row-gap de 16px acima (pensado pra separar
            temporadas diferentes) deixa a linha do nome real (aberta via
            setinha) longe demais da temporada que ela pertence. Puxa mais
            perto com uma margem negativa maior que a padrão (-4px), mas sem
            exagerar (senão gruda demais no texto da temporada acima). */
          .poster-lightbox:not(.simple-mode) .rank-mal-realname-row {
            margin-top: -7px;
          }

          /* Quando o card só tem UMA linha alinhável (ex: One Piece, que só
            tem "1 temporada" + filmes/especiais com ":"), o ".rank-mal-align-
            group" nem chega a se formar (precisa de 2+ linhas alinháveis —
            ver "alignableCount" no JS). Sem o grupo, a linha de nome real
            cai direto dentro de ".rank-mal-rows" e herda o row-gap de 16px
            dele (pensado pra separar temporadas/filmes diferentes), em vez
            do row-gap de 6px do grid — e a margem negativa de -7px acima,
            calibrada pro gap de 6px, não é suficiente pra puxar a linha pra
            perto. Aqui, mirando especificamente nesse caso (filho direto de
            ".rank-mal-rows", sem grupo), usa uma margem bem maior pra
            compensar o gap de 16px e manter a mesma proximidade visual. */
          .poster-lightbox:not(.simple-mode) .rank-mal-rows > .rank-mal-realname-row {
            margin-top: -17px;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-align-group {
            display: grid;
            grid-template-columns: max-content max-content 1fr max-content;
            column-gap: 4px;
            row-gap: 6px;
            width: 100%;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-align-group .rank-mal-row,
          .poster-lightbox:not(.simple-mode) .rank-mal-align-group .rank-mal-content {
            display: contents;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break {
            display: flex;
            align-items: center;
            grid-column: 1 / -1;
          }

          /* A regra acima (display: flex) tem a mesma especificidade da regra
            ".rank-mal-row-break.rank-mal-realname-row:not(.open)" (display:
            none) e, por vir depois no CSS, vencia o empate — fazendo o nome
            real da temporada aparecer já aberto ao entrar no lightbox mobile,
            sem precisar clicar na setinha. Repete o "display: none" aqui,
            agora por último, pra restaurar o comportamento fechado por
            padrão. */
          .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break.rank-mal-realname-row:not(.open) {
            display: none;
          }

          /* Título das linhas irregulares (filmes, especiais, títulos com ":")
            com um teto de largura (max-width). Sem isso, quando o texto é
            comprido, o navegador calcula o espaço "faltando" (título +
            pontilhado + nota não cabem juntos numa linha) usando como base o
            tamanho do título SEM quebra (o texto inteiro em uma linha só, bem
            largo) — e, como o pontilhado começa de uma caixa vazia (0px de
            largura própria), quase todo aquele espaço que falta é descontado
            só do título, nunca do pontilhado. Resultado: o título encolhe até
            caber (quebrando em 2 linhas), mas o pontilhado nunca ganha o
            espaço que sobrou de verdade, ficando preso no mínimo (14px), bem
            coladinho na nota. Limitando a largura máxima do título a 60% da
            linha, o cálculo já começa com um título "menor" desde o início,
            então sobra espaço de verdade pro pontilhado esticar depois. Em
            títulos curtos (que já cabem em menos de 60%), esse limite não faz
            diferença nenhuma — o layout continua idêntico ao de antes, tudo
            numa linha só. */
          .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break .rank-mal-content {
            /* No mobile, títulos irregulares ocupam uma largura maior para que
              "4ª temporada" não seja quebrado artificialmente em duas linhas.
              Quando o texto inteiro não cabe, a quebra acontece naturalmente
              entre palavras e o bloco de episódios (.rank-mal-eps) continua no
              mesmo fluxo, podendo aparecer no começo da segunda linha. */
            flex: 0 1 70%;
            width: 70%;
            max-width: 70%;
            display: block;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            overflow-wrap: normal;
            word-break: normal;
            text-align: left;
            line-height: 1.25;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break .rank-mal-season {
            white-space: normal;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break .rank-mal-season--toggleable {
            display: inline;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break .rank-mal-eps {
            white-space: nowrap;
          }

          /* Quando o label já tem uma quebra manual (\n → <br
            class="rank-mal-linebreak">), a largura da caixa não precisa mais
            do teto fixo de 60% — isso deixava uma "sobra" de espaço vazio
            entre o fim do texto (ex: "...The Final") e o pontilhado, porque
            60% quase sempre é mais largo que a linha de verdade. Com quebra
            manual, o texto já tem um ponto de corte definido, então a caixa
            pode encolher só até a largura real das duas linhas (max-content),
            deixando o pontilhado começar coladinho no texto. */
          .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break .rank-mal-content:has(.rank-mal-linebreak) {
            max-width: max-content;
            width: max-content;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-content {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-season,
          .poster-lightbox:not(.simple-mode) .rank-mal-eps {
            align-self: center;
            white-space: nowrap;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-dots {
            display: block;
            align-self: center;
          }

          /* Quando o nome real (malName) é grande, ele fica na própria linha
            (row-break) e por padrão pode se estender até a borda direita do
            card — sobrepondo visualmente a nota da temporada, que fica na
            linha de cima nessa mesma posição horizontal (extrema direita).
            Reserva aqui a largura da nota (50px, ver ".rank-mal-note") + um
            respiro (8px) pro nome real nunca "alcançar" essa faixa: em vez
            de passar por baixo da nota, ele agora corta com reticências
            (herdadas do "text-overflow: ellipsis" já existente em
            ".rank-mal-realname") um pouco antes. */
          .poster-lightbox:not(.simple-mode) .rank-mal-realname {
            max-width: calc(100% - 58px);
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-note {
            justify-self: end;
            align-self: center;
          }

          .poster-lightbox:not(.simple-mode) .rank-mal-spacer {
            grid-column: 1 / -1;
          }

          /* Botão "MyAnimeList" (normalmente escondido no mobile pela regra
            geral acima) volta a aparecer aqui dentro do lightbox — mas sem
            navegar pra lugar nenhum (ver JS: preventDefault nesse breakpoint). */
          .poster-lightbox:not(.simple-mode) a.rank-mal-label:not(.rank-mal-label--anime-planet):not(.rank-mal-label--crunchyroll):not(.rank-mal-label--netflix):not(.rank-mal-label--mal) {
            display: inline-flex;
            cursor: default;
          }

          .poster-lightbox:not(.simple-mode) a.rank-mal-label:not(.rank-mal-label--anime-planet):not(.rank-mal-label--crunchyroll):not(.rank-mal-label--netflix):not(.rank-mal-label--mal) svg {
            display: none;
          }
        }


        .poster-lightbox-announce {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 34px;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          pointer-events: none;
          border-radius: 0 0 14px 14px;
          z-index: 2;

          background: rgba(10,10,10,0.45);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
          -webkit-mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%);
          mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%);
        }

        .poster-lightbox-announce:empty { display: none; }

        .poster-lightbox-announce .announce-line {
          font-family: "Inter", sans-serif;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.1px;
          color: rgba(255,255,255,0.92);
          line-height: 34px;
          height: 34px;
          padding: 0 20px;
          max-width: 100%;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        @media (max-width: 600px) {
          .poster-lightbox-announce { height: 26px; }
          .poster-lightbox-announce .announce-line { font-size: 11px; line-height: 26px; height: 26px; padding: 0 14px; }
        }

        .poster-lightbox-title {
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 17px;
          letter-spacing: -0.01em;
          color: var(--text);
          text-align: center;
          max-width: min(92vw, 700px);
        }

        .poster-lightbox-title:empty { display: none; }

        .poster-lightbox-info {
          margin-top: -14px;
          font-size: 13px;
          font-weight: 500;
          color: var(--muted);
          text-align: center;
          max-width: min(92vw, 700px);
          line-height: 1.4;
        }

        .poster-lightbox-info:empty { display: none; }

        /* Separador entre linhas de "poster-lightbox-info" (ex: temporadas/episódios
          e Filme(s)): no PC fica inline, mantendo tudo na mesma linha; só no
          lightbox mobile (regra específica mais abaixo) ele vira quebra de linha. */
        .poster-lightbox-info-break {
          display: inline;
        }

        .poster-lightbox-info-break::before {
          content: " - ";
        }

        .poster-lightbox-rank {
          display: inline-block;
          margin-right: 8px;
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 14px;
          color: rgba(255,255,255,0.5);
          letter-spacing: -0.01em;
          vertical-align: middle;
        }

        .poster-lightbox-list {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          flex-wrap: wrap;
          max-width: min(92vw, 700px);
        }

        .poster-lightbox-list:empty { display: none; }

        .poster-lightbox-list .list-division {
          display: inline-flex;
          align-items: center;
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 11px;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--list-color, var(--glow-accent));
          transition: color 0.15s ease;
          padding: 2px 0 5px;
          border-bottom: 1px solid transparent;
        }

        /* Tags de todas as divisões/categorias às quais o anime pertence
          (ex: "All Animes" + "Mecha/Cyberpunk"). Clicáveis: levam até o
          card do anime naquela lista. */
        .poster-lightbox-list .list-tag {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 11px;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--tag-color, var(--glow-accent));
          background: none;
          border: none;
          padding: 2px 0 5px;
          margin: 0;
          cursor: pointer;
          border-bottom: 1px solid transparent;
          transition: border-color 0.2s ease, filter 0.2s ease;
        }

        .poster-lightbox-list .list-tag:hover,
        .poster-lightbox-list .list-tag:focus-visible {
          border-bottom-color: currentColor;
          filter: brightness(1.25);
        }

        .poster-lightbox-list .list-tag:active {
          filter: brightness(0.95);
        }

        .poster-lightbox-list .list-tag-rank {
          font-weight: 900;
          color: rgba(255,255,255,0.45);
          letter-spacing: -0.01em;
        }

        /* Tag combinada "Watching Now: <divisão>" (usada quando um anime de
          "Announced Sequels" também está em Watching Now) — cada metade tem
          sua própria cor, mas o botão inteiro é um único link clicável. */
        .poster-lightbox-list .list-tag-split .list-tag-part + .list-tag-part {
          margin-left: -2px;
        }

        /* No hover/focus, em vez da linha sólida (currentColor) normal, o
          sublinhado vira uma listra alternando as duas cores da tag (ex:
          laranja do "Watching Now" / azul da divisão), reforçando que o
          botão combina as duas informações. */
        .poster-lightbox-list .list-tag-split {
          position: relative;
          border-bottom-color: transparent;
        }

        .poster-lightbox-list .list-tag-split::after {
          content: '';
          position: absolute;
          left: 0;
          right: 0;
          bottom: -1px;
          height: 1px;
          background-image: linear-gradient(
            90deg,
            var(--tag-color-2, var(--glow-accent)) 0%,
            var(--tag-color, var(--glow-accent)) 100%
          );
          opacity: 0;
          transition: opacity 0.2s ease;
        }

        .poster-lightbox-list .list-tag-split:hover::after,
        .poster-lightbox-list .list-tag-split:focus-visible::after {
          opacity: 1;
        }

        .poster-lightbox-list .list-sep {
          color: rgba(255,255,255,0.25);
          font-size: 10px;
        }

        /* ── Modo simples: animes sem myranks (só zoom + categoria + rank/nome) ── */
        .poster-lightbox-simple-category,
        .poster-lightbox-simple-caption {
          display: none;
        }

        .poster-lightbox.simple-mode .poster-lightbox-panel {
          display: none !important;
        }

        .poster-lightbox.simple-mode .poster-lightbox-figure {
          flex-direction: column !important;
          align-items: center;
          justify-content: center;
          gap: 18px;
        }

        .poster-lightbox.simple-mode .poster-lightbox-media {
          flex: 0 0 auto;
        }

        .poster-lightbox.simple-mode img {
          width: min(70vw, 520px);
          height: min(78vh, 700px);
        }

        .poster-lightbox.simple-mode .poster-lightbox-simple-category {
          display: block;
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 12px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--glow-accent);
          text-align: center;
        }

        .poster-lightbox.simple-mode .poster-lightbox-simple-category .simple-category-division {
          font-weight: 800;
        }

        .poster-lightbox.simple-mode .poster-lightbox-simple-caption {
          display: block;
          text-align: center;
          max-width: min(92vw, 500px);
        }

        .poster-lightbox.simple-mode .poster-lightbox-simple-caption .poster-lightbox-rank {
          margin-right: 8px;
          font-size: 13px;
          vertical-align: middle;
        }

        .poster-lightbox.simple-mode .poster-lightbox-simple-caption .poster-lightbox-simple-title {
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 17px;
          letter-spacing: -0.01em;
          color: var(--text);
          vertical-align: middle;
        }

        .poster-lightbox-simple-link {
          display: none;
        }

        .poster-lightbox-simple-link:empty {
          display: none;
        }

        .poster-lightbox.simple-mode .poster-lightbox-simple-link {
          display: flex;
          justify-content: center;
        }

        .poster-lightbox-simple-link .rank-mal-label {
          font-size: 12px;
          padding: 8px 16px;
          border: 1px solid rgba(255,255,255,0.14);
          border-radius: 100px;
          background: rgba(255,255,255,0.03);
        }

        .poster-lightbox-simple-link .rank-mal-label svg {
          width: 12px;
          height: 12px;
          flex: 0 0 12px;
        }

        .poster-lightbox-simple-link .rank-mal-label--anime-planet:hover,
        .poster-lightbox-simple-link .rank-mal-label--anime-planet:focus-visible {
          color: #f4c463;
          border-color: rgba(244,196,99,0.4);
        }

        @media (max-width: 760px) {
          .poster-lightbox.simple-mode img {
            width: min(88vw, 400px);
            height: min(58vh, 540px);
          }
        }

        .poster-lightbox-close {
          position: fixed;
          top: 20px;
          right: 24px;
          width: 40px;
          height: 40px;
          border-radius: 12px;
          border: none;
          background: rgba(255,255,255,0.015);
          color: #cbd5e1;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          outline: none;
          transition: background 0.12s ease, color 0.12s ease, transform 0.12s ease;
        }

        .poster-lightbox-close:hover {
          background: rgba(255,255,255,0.05);
          color: #fff;
          transform: scale(1.02);
        }

        .poster-lightbox-close:focus,
        .poster-lightbox-close:focus-visible {
          outline: none;
          box-shadow: none;
        }

        .poster-lightbox-close svg {
          width: 22px;
          height: 22px;
          stroke: currentColor;
          stroke-width: 2.2;
          fill: none;
        }

        @media (max-width: 600px) {
          .poster-lightbox { padding: 20px; }
          .poster-lightbox-close { top: 14px; right: 14px; width: 38px; height: 38px; }
        }

        /* ── Botão flutuante: ir para o topo / ir para o final ── */
        .scroll-fab {
          position: fixed;
          right: 24px;
          bottom: 24px;
          width: 46px;
          height: 46px;
          border-radius: 50%;
          border: 1px solid rgba(255,255,255,0.08);
          background: rgba(20,20,20,0.7);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
          color: #cbd5e1;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          outline: none;
          z-index: 500;
          opacity: 0;
          pointer-events: none;
          transform: translateY(10px);
          transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
          box-shadow: 0 8px 24px -6px rgba(0,0,0,0.5);
        }

        .scroll-fab.visible {
          opacity: 1;
          pointer-events: auto;
          transform: translateY(0);
        }

        .scroll-fab:hover {
          background: rgba(255,255,255,0.06);
          color: #fff;
          box-shadow: 0 10px 28px -6px rgba(0,0,0,0.6);
        }

        .scroll-fab svg {
          width: 20px;
          height: 20px;
          stroke: currentColor;
          stroke-width: 2.4;
          fill: none;
          transition: transform 0.25s ease;
        }

        .scroll-fab.scrolled svg {
          transform: rotate(180deg);
        }

        @media (max-width: 600px) {
          .scroll-fab { right: 16px; bottom: 16px; width: 42px; height: 42px; }
          .scroll-fab svg { width: 18px; height: 18px; }
        }

        .poster-wrap.has-fallback { background: #0e0e10; }

        .poster-fallback {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          text-align: center;
          color: rgba(255,255,255,0.6);
          font-family: var(--font-title);
          font-size: 15px;
          font-weight: 900;
          line-height: 1.1;
          letter-spacing: -0.02em;
          opacity: 0;
          transition: opacity 0.18s ease;
          pointer-events: none;
          user-select: none;
        }

        .poster-wrap.has-fallback .poster-fallback { opacity: 1; }
        .poster-wrap.has-fallback .thumb { opacity: 0; }

        /* ── Info ── */
        .meta {
          --meta-pad-x: 24px;
          padding: 0 var(--meta-pad-x);
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 5px;
          min-width: 0;
          position: relative;
        }

        .title-anime {
          margin: 0;
          font-family: var(--font-title);
          font-size: 16px;
          font-weight: 800;
          color: var(--text);
          line-height: 1.2;
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .title-row {
          display: block;
          min-width: 0;
        }

        .title-row .title-anime {
          min-width: 0;
        }

        /* ── Faixa de anúncio (nova temp./filme) sobre a imagem ── */
        .announce-strip {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 16px; 
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          pointer-events: none;
          z-index: 3;

          background: rgba(10,10,10,0.38);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
          -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
          mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
        }

        .announce-strip .announce-track {
          display: flex;
          align-items: center;
          width: max-content;
          will-change: transform;
        }

        @keyframes announce-marquee {
          from { transform: translateX(0); }
          to   { transform: translateX(var(--marquee-distance, -50%)); }
        }

        .announce-strip .announce-line {
          flex: 0 0 auto;
          white-space: nowrap;
          font-size: 9px;
          font-weight: 700;
          letter-spacing: 0.2px;
          color: rgba(255, 255, 255, 0.82); 
          line-height: 16px;
          height: 16px;
          padding: 0 32px;
        }

        .pause-icon {
          color: #facc15;
          display: inline-block;
          font-size: 0.85em;
          vertical-align: 1px;
          line-height: 1;
          margin-right: 1px;
        }

        .rewatch-icon {
          color: #38bdf8;
          display: inline-block;
          font-size: 0.85em;
          vertical-align: 1px;
          line-height: 1;
          margin-right: 1px;
        }

        .info {
          margin: 0;
          color: var(--muted);
          font-size: 13px;
          font-weight: 400;
          line-height: 1.35;

          white-space: normal;
          word-break: break-word;
        }

        /* ── Load more ── */
        .load-more-container {
          margin-top: 32px;
          display: flex;
          justify-content: center;
          padding-bottom: 20px;
        }

        /* ── Footer ── */
        .site-footer {
          margin: 0;
          padding: 10px 0 0;
        }

        .toggle-btn {
          background: transparent;
          color: var(--muted);
          font-family: var(--font-title);
          font-weight: 800;
          font-size: 12px;
          text-transform: uppercase;
          letter-spacing: 1.8px;
          padding: 10px 20px;
          border: 1px solid transparent;
          cursor: pointer;
          transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
          display: flex;
          align-items: center;
          gap: 10px;
          border-radius: 8px;
        }

        .toggle-btn:hover { color: var(--text);}
        .toggle-btn:active { transform: scale(0.98); }

        .arrow {
          display: inline-block;
          width: 8px;
          height: 8px;
          border-right: 1.5px solid currentColor;
          border-bottom: 1.5px solid currentColor;

          transition: transform 0.25s ease;
          margin-top: -3px;
        }

        .toggle-btn.active .arrow { transform: rotate(-135deg); margin-top: 3px; }

        .subtitle-left { display:flex; gap:8px; align-items:center; min-width:0; }
        .subtitle-main { color: var(--muted); font-size: 13px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .info-row {
          display: flex;
          align-items: center;
          min-width: 0;
          overflow: hidden;
        }

        .info-row .info {
          flex: 1;
          min-width: 0;
        }

          .info-row { display: flex; }

            /* ── "True Characters" — cards de personagem em estilo "profile card" ──
          Avatar circular com anel de destaque, badge de rank flutuante
          sobreposto ao avatar, e card com fundo/borda próprios (em vez da
          linha poster+texto usada nos outros modos). */
        ol.ranking.mode-true-characters {
          --true-character-size: 152px;
          --true-character-pad: 18px;
          column-gap: 16px;
          row-gap: 16px;
        }

        ol.ranking.mode-true-characters li.anime-item {
          display: flex;
          align-items: center;
          gap: 20px;
          grid-template-columns: none;
          min-height: 0;
          padding: var(--true-character-pad) 22px var(--true-character-pad) var(--true-character-pad);
          background: linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
          border: 1px solid rgba(255,255,255,0.07);
          border-radius: 22px;
        }

        ol.ranking.mode-true-characters li.anime-item:hover {
          transform: translateY(-4px) translateZ(0);
          border-color: rgba(244,114,182,0.35);
          box-shadow: 0 16px 34px -12px rgba(244,114,182,0.28), 0 12px 30px -10px rgba(0,0,0,0.6);
        }

        /* Garante que a especificidade maior deste bloco não quebre a
          ocultação de itens filtrados/pesquisados. */
        ol.ranking.mode-true-characters li.anime-item.hidden-item {
          display: none;
        }

        /* ── Avatar circular ── */
        ol.ranking.mode-true-characters .poster-wrap {
          width: var(--true-character-size);
          height: var(--true-character-size);
          aspect-ratio: 1 / 1;
          border-radius: 50%;
          flex-shrink: 0;
          box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 6px 16px -4px rgba(0,0,0,0.55);
          transition: box-shadow 0.3s ease;
          cursor: default;
        }

        ol.ranking.mode-true-characters .thumb {
          width: 100%;
          height: 100%;
          object-fit: cover;
          aspect-ratio: 1 / 1;
        }

        ol.ranking.mode-true-characters li.anime-item:hover .poster-wrap {
          box-shadow: 0 0 0 3px rgba(244,114,182,0.55), 0 0 22px -2px rgba(244,114,182,0.4), 0 6px 18px -4px rgba(0,0,0,0.6);
        }

        /* ── Rank como texto "#N" colado antes do nome do personagem ── */
        ol.ranking.mode-true-characters .rank-wrap {
          display: none;
        }

        ol.ranking.mode-true-characters .title-anime::before {
          content: "#" counter(item) " ";
          color: #f9a8d4;
          font-weight: 900;
          opacity: 0.9;
        }

        ol.ranking.mode-true-characters li.anime-item.rank-gold .title-anime::before { color: #d4af37; }
        ol.ranking.mode-true-characters li.anime-item.rank-silver .title-anime::before { color: #b8bcc2; }
        ol.ranking.mode-true-characters li.anime-item.rank-bronze .title-anime::before { color: #b0703f; }

        ol.ranking.mode-true-characters li.anime-item.rank-gold .poster-wrap {
          box-shadow: 0 0 0 3px rgba(212,175,55,0.55), 0 6px 16px -4px rgba(0,0,0,0.55);
        }
        ol.ranking.mode-true-characters li.anime-item.rank-silver .poster-wrap {

        }
        ol.ranking.mode-true-characters li.anime-item.rank-bronze .poster-wrap {

        /* ── Texto ── */

        @media (max-width: 1100px) {

        @media (max-width: 900px) {

          ol.ranking.mode-true-characters li.anime-item {

          ol.ranking.mode-true-characters .title-anime {
            font-size: 16.5px;
          }

        @media (max-width: 600px) {
          ol.ranking.mode-true-characters {
            --true-character-size: 104px;
            --true-character-pad: 12px;
            row-gap: 12px;
          }
          ol.ranking.mode-true-characters li.anime-item {
            border-radius: 0;
            gap: 14px;
            align-items: center;
          }
          ol.ranking.mode-true-characters .title-anime {

          }

        @media (max-width: 380px) {
          ol.ranking.mode-true-characters {
            --true-character-size: 92px;

          }

          }
