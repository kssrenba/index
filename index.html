    /* ── "Watching Now" list — vertical/portrait cover art ── */
        ol.ranking.mode-watching {
          gap: 8px;
        }
        ol.ranking.mode-watching li.anime-item {
          grid-template-columns: 64px 158px 1fr;
          min-height: 220px;
        }
        ol.ranking.mode-watching .poster-wrap {
          width: 158px;
          height: 220px;
        }
        
        /* Novo Efeito Hover para Watching Now (Com Glow dinâmico) */
        ol.ranking.mode-watching li.anime-item:hover {
          background: color-mix(in srgb, var(--item-hover-color, #2dd4bf) 8%, transparent);
          box-shadow: 
            0 12px 32px -8px rgba(0,0,0,0.7), 
            0 0 0 1px var(--item-hover-color, #2dd4bf),
            0 0 12px -3px var(--item-hover-color, #2dd4bf);
          z-index: 2; /* Garante que a sombra fique sobre os outros cards */
        }

        /* ── Barra de progresso visual (Watching Now) ── */
        .watch-progress {
          margin-top: 10px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .watch-progress-track {
          flex: 1;
          height: 6px;
          border-radius: 999px;
          background: rgba(255,255,255,0.08);
          overflow: hidden;
          position: relative;
        }

        .watch-progress-fill {
          height: 100%;
          border-radius: 999px;
          background: linear-gradient(90deg,
            color-mix(in srgb, var(--item-hover-color, #2dd4bf) 70%, white 10%),
            var(--item-hover-color, #2dd4bf));
          box-shadow: 0 0 8px -1px var(--item-hover-color, #2dd4bf);
          transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
          width: 0%;
        }

        /* Estado indeterminado: quando o total de episódios ainda não é conhecido
          (ex: obra em lançamento), não dá pra mostrar um % real, então a barra
          fica vazia (sem preenchimento animado). */
        .watch-progress-fill--indeterminate {
          width: 0% !important;
        }

        /* Marcador de divisão de temporada dentro da barra de progresso.
          Usado quando o anime tem várias temporadas e a barra mostra o
          progresso total (soma de todas), com uma linha em cada ponto
          onde uma temporada termina e a próxima começa. */
        .watch-progress-season-mark {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 2px;
          background: rgba(3,3,3,0.75);
          box-shadow: 0 0 0 1px rgba(255,255,255,0.28);
          z-index: 2;
          pointer-events: none;
        }

        /* Zona invisível sobre cada trecho da barra correspondente a uma
          temporada. Não altera o visual por padrão, mas no hover realça
          levemente o trecho e mostra (via title, tooltip nativo) quantos
          episódios aquela temporada tem. */
        .watch-progress-season-zone {
          position: absolute;
          top: 0;
          bottom: 0;
          z-index: 3;
          cursor: default;
          transition: background 0.15s ease;
        }

        .watch-progress-season-zone:hover {
          background: rgba(255,255,255,0.18);
        }

        /* Marcador de divisão de "cour" (metades em que uma mesma temporada
          foi exibida, ex: 2ª temporada de Re:Zero em dois blocos). É mais
          discreto que o marcador de temporada — fino e mais curto — pra
          deixar claro que é uma subdivisão, não uma temporada nova. */
        .watch-progress-cour-mark {
          position: absolute;
          top: 25%;
          bottom: 25%;
          width: 1.5px;
          background: rgba(3,3,3,0.55);
          box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
          border-radius: 1px;
          z-index: 2;
          pointer-events: none;
        }

        .watch-progress-label {
          flex: 0 0 auto;
          font-size: 11px;
          font-weight: 600;
          color: var(--muted);
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.02em;
          white-space: nowrap;
        }

        /* Estado "concluído": em vez do "12/12", mostra "COMPLETED" com a cor
          de destaque do próprio card, pra ficar bem visível de cara. */
        .watch-progress-label--completed {
          color: var(--item-hover-color, #2dd4bf);
          font-weight: 800;
          letter-spacing: 0.06em;
          font-size: 10px;
        }

        /* Total geral (soma de todas as temporadas), mostrado bem menor e mais
          apagado ao lado do progresso da temporada atual, entre parênteses. */
        .watch-progress-label-total {
          font-size: 9px;
          font-weight: 500;
          color: var(--low-priority);
          margin-left: 4px;
          letter-spacing: 0.01em;
        }

        .watch-progress-label-total::before { content: "("; }
        .watch-progress-label-total::after { content: ")"; }

        @media (max-width: 600px) {
          .watch-progress-label-total { font-size: 8px; margin-left: 3px; }
        }

        /* Variante compacta usada no card de busca: mesma barra, mas sem os
          botões de +/- (o progresso lá é só leitura). */
        .search-result-progress.watch-progress {
          margin-top: 4px;
          gap: 6px;
        }

        .search-result-progress .watch-progress-track { height: 4px; }

        .search-result-progress .watch-progress-label {
          font-size: 10px;
        }

        .watch-progress-inc,
        .watch-progress-dec {
          flex: 0 0 auto;
          width: 20px;
          height: 20px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 0;
          border-radius: 50%;
          border: 1px solid rgba(255,255,255,0.16);
          background: rgba(255,255,255,0.06);
          color: var(--text);
          font-size: 13px;
          line-height: 1;
          font-weight: 700;
          cursor: pointer;
          transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .watch-progress-inc:hover:not(:disabled),
        .watch-progress-dec:hover:not(:disabled) {
          background: var(--item-hover-color, #2dd4bf);
          border-color: var(--item-hover-color, #2dd4bf);
          color: #030303;
          transform: scale(1.08);
        }

        .watch-progress-inc:active:not(:disabled),
        .watch-progress-dec:active:not(:disabled) {
          transform: scale(0.94);
        }

        .watch-progress-inc:disabled,
        .watch-progress-dec:disabled {
          opacity: 0.3;
          cursor: default;
        }

        @media (max-width: 600px) {
          .watch-progress { margin-top: 6px; gap: 8px; }
          .watch-progress-track { height: 5px; }
          .watch-progress-label { font-size: 10px; }
          .watch-progress-inc, .watch-progress-dec { width: 18px; height: 18px; font-size: 12px; }
        }

        /* ── SEASON HEADERS PERSONALIZADOS ── */
        li.season-header {
          grid-column: 1 / -1;
          list-style: none;
          display: flex;
          align-items: center;
          padding: 40px 4px 16px;
          color: var(--season-color);

          /* Aqui está a mágica: Reinicia o contador para cada cabeçalho de temporada! */
          counter-reset: item;
        }
        li.season-header:first-child { padding-top: 12px; }

        li.season-header .season-text {
          margin: 0;
          font-family: var(--font-title);
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 0.03em;
          text-transform: uppercase;
          color: var(--season-color);
        }

        /* Quando o cabeçalho da temporada aponta pro MAL, mantém a cor e a
          tipografia herdadas do .season-header (nada de azul/sublinhado
          padrão de link), só com um hover sutil indicando que é clicável. */
        a.season-text.season-text-link {
          color: inherit;
          text-decoration: none;
          cursor: pointer;
          transition: opacity 0.15s ease;
        }
        a.season-text.season-text-link:hover,
        a.season-text.season-text-link:focus-visible {
          opacity: 0.75;
        }

        li.season-header .season-line {
          display: none;
        }

        @media (max-width: 600px) {

          li.season-header:first-child { padding-top: 8px; }

          ol.ranking.mode-watching li.anime-item:hover {
            transform: translateY(-2px) translateZ(0); /* Leve efeito também no mobile para dar o feedback */
          }
        }

        @media (max-width: 1100px) {
          ol.ranking.mode-watching li.anime-item { grid-template-columns: 56px 138px 1fr; min-height: 192px; }
          ol.ranking.mode-watching .poster-wrap { width: 138px; height: 192px; }
        }

        @media (max-width: 900px) {
          ol.ranking.mode-watching li.anime-item { grid-template-columns: 44px 118px 1fr; min-height: 165px; }
          ol.ranking.mode-watching .poster-wrap { width: 118px; height: 165px; }
        }

        @media (max-width: 600px) {
          ol.ranking.mode-watching li.anime-item { grid-template-columns: 30px 96px 1fr; min-height: 171px; }
          ol.ranking.mode-watching .poster-wrap { width: 96px; height: 171px; }

          ol.ranking.mode-watching .poster-wrap { width: 82px; height: 146px; }

        /* ── Top 3: borda superior especial (ouro, prata, bronze) ── */
        li.anime-item.rank-gold,
        li.anime-item.rank-silver,
        li.anime-item.rank-bronze,
        li.fav-ep-card.rank-gold,
        li.fav-ep-card.rank-silver,
        li.fav-ep-card.rank-bronze {
          position: relative;
        }

        li.anime-item.rank-gold::before,
        li.anime-item.rank-silver::before,
        li.anime-item.rank-bronze::before,
        li.fav-ep-card.rank-gold::before,
        li.fav-ep-card.rank-silver::before,
        li.fav-ep-card.rank-bronze::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          border-radius: 10px 10px 0 0;
          z-index: 2;
          pointer-events: none;
          opacity: 0.55;
        }

        /* Os cards de Peak Episodes têm o border-radius maior (18px) —
          a faixa precisa acompanhar a curvatura do canto do próprio card. */
        li.fav-ep-card.rank-gold::before,
        li.fav-ep-card.rank-silver::before,
        li.fav-ep-card.rank-bronze::before {
          border-radius: 18px 18px 0 0;
        }

        li.anime-item.rank-gold::before,
        li.fav-ep-card.rank-gold::before {
          background: linear-gradient(90deg, transparent, #d4af37, transparent);
          box-shadow: 0 0 6px -1px rgba(212, 175, 55, 0.35);
        }

        li.anime-item.rank-silver::before,
        li.fav-ep-card.rank-silver::before {
          background: linear-gradient(90deg, transparent, #b8bcc2, transparent);
          box-shadow: 0 0 6px -1px rgba(184, 188, 194, 0.3);
        }

        li.anime-item.rank-bronze::before,
        li.fav-ep-card.rank-bronze::before {
          background: linear-gradient(90deg, transparent, #b0703f, transparent);

        /* ══════════════════════════════════════════════════════════════
          ⭐ FAVORITE EPISODES — card totalmente diferente do resto do site:
          imagem grande no topo, nota pessoal em baixo, em vez da linha
          horizontal poster+meta usada nos outros modos.
          ══════════════════════════════════════════════════════════════ */
        ol.ranking.mode-fav-episodes {
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
          counter-reset: item;
        }

        @media (max-width: 900px) {
          ol.ranking.mode-fav-episodes { grid-template-columns: 1fr; }
        }

        .fav-ep-empty {
          list-style: none;
          padding: 60px 24px;
          text-align: center;
          color: var(--muted);
          font-size: 14px;
          line-height: 1.7;
          border: 1px dashed rgba(255,255,255,0.14);
          border-radius: 16px;
        }

        .fav-ep-empty code {
          background: rgba(255,255,255,0.06);
          padding: 2px 7px;
          border-radius: 6px;
          color: #3b82f6;
          font-size: 12.5px;
        }

        /* ── Card de episódio favorito (imagem à esquerda + conteúdo à direita) ── */
        li.fav-ep-card {
          counter-increment: item;
          list-style: none;
          display: grid;
          grid-template-columns: 56px 420px 1fr;
          align-items: stretch;
          min-height: 300px;
          border-radius: 18px;
          border: 1.5px solid transparent;
          overflow: hidden;
          background: rgba(255,255,255,0.02);
          position: relative;
          transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
          transform: translateZ(0);
          backface-visibility: hidden;
        }

        /* ── Ambient: a própria imagem do episódio, borrada, como wallpaper do
          card — mesma mecânica usada nos outros cards da lista (poster-wrap) ── */
        .fav-ep-ambient {
          position: absolute;
          inset: -30px;
          z-index: 0;
          background-size: cover;
          background-position: center;
          filter: blur(30px) saturate(1.5) brightness(0.55);
          opacity: 0;
          transform: scale(1.1);
          transition: opacity 0.4s ease, background-image 0.3s ease, transform 0.6s ease;
          pointer-events: none;
        }

        .fav-ep-ambient.ready { opacity: 0.9; }

        /* Mesma deriva contínua dos outros cards da lista */
        @keyframes favEpAmbientDrift {
          0%   { transform: scale(1.2) translate(4%, -3%); }
          25%  { transform: scale(1.38) translate(-4%, 3%); }
          50%  { transform: scale(1.25) translate(3%, 4%); }
          75%  { transform: scale(1.4) translate(-3%, -4%); }
          100% { transform: scale(1.2) translate(4%, -3%); }
        }

        li.fav-ep-card:hover .fav-ep-ambient.ready {
          animation: favEpAmbientDrift 4s ease-in-out infinite;
          animation-delay: 140ms;
        }

        .fav-ep-ambient-shade {
          position: absolute;
          inset: 0;
          z-index: 1;
          background: linear-gradient(90deg, rgba(10,10,14,0.55) 0%, rgba(10,10,14,0.25) 45%, rgba(10,10,14,0.78) 100%);
          pointer-events: none;
        }

        .fav-ep-media,
        .fav-ep-content {
          position: relative;
          z-index: 2;
        }

        /* Mesmo overlay branco sutil usado nos outros cards do site ao passar o mouse */
        li.fav-ep-card::after {
          content: "";
          position: absolute;
          inset: 0;
          background: rgba(255,255,255,0.06);
          opacity: 0;
          transition: opacity 0.2s ease;
          pointer-events: none;
          border-radius: inherit;
        }

        li.fav-ep-card:hover::after { opacity: 1; }

        li.fav-ep-card:hover {
          transform: translateY(-3px) translateZ(0);
          box-shadow: 0 12px 32px -8px rgba(0,0,0,0.6);
        }

        li.fav-ep-card:hover .fav-ep-media-main .thumb {
          transform: scale(1.05);
        }

        /* Hover colorido igual ao resto do site (usa --item-hover-color, azul por padrão nesta lista) */
        li.fav-ep-card[style*="--item-hover-color"]:hover {
          background: color-mix(in srgb, var(--item-hover-color) 8%, transparent);
          border-color: var(--item-hover-color);
          box-shadow:
            0 12px 32px -8px rgba(0,0,0,0.7),
            0 0 12px -3px var(--item-hover-color);
        }

        /* ── Coluna de mídia: imagem grande + carrossel de mini-thumbnails ── */
        .fav-ep-media {
          display: flex;
          flex-direction: column;
          gap: 10px;
          padding: 16px;
          min-width: 0;
        }

        .fav-ep-media-main.poster-wrap {
          width: 100%;
          height: auto;
          aspect-ratio: 16 / 9;
          border-radius: 12px;
          cursor: zoom-in;
          touch-action: pan-y;
        }

        .fav-ep-media-main .thumb,
        .fav-ep-media-main .poster-fallback {
          border-radius: 12px;
        }

        /* ── Contador "posição/total" (ex: 1/5) sobre o canto da imagem grande,
          indicando em qual imagem do carrossel o usuário está ── */
        .fav-ep-counter {
          position: absolute;
          right: 10px;
          top: 10px;
          z-index: 2;
          font-family: var(--font-title);
          font-weight: 800;
          font-size: 11.5px;
          letter-spacing: 0.02em;
          color: #fff;
          background: rgba(10,10,10,0.6);
          backdrop-filter: blur(4px);
          -webkit-backdrop-filter: blur(4px);
          padding: 3px 9px;
          border-radius: 999px;
          pointer-events: none;
          box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
        }

        /* Navegação de mini-thumbnails (setas ‹ › + tira de imagens) */
        .fav-ep-thumbnav {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }

        .fav-ep-thumbnav-arrow {
          flex: 0 0 auto;
          width: 26px;
          height: 26px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 8px;
          border: none;
          background: transparent;
          color: var(--muted);
          cursor: pointer;
          transition: color 0.15s ease;
        }

        .fav-ep-thumbnav-arrow svg { width: 13px; height: 13px; }

        .fav-ep-thumbnav-arrow:hover {
          color: #fff;
        }

        .fav-ep-thumbstrip {
          flex: 1;
          display: flex;
          gap: 7px;
          overflow-x: auto;
          scroll-behavior: smooth;
          scrollbar-width: none;
          min-width: 0;
          /* A largura real é travada via JS (sizeFavEpThumbstrip) para caber
            só miniaturas inteiras, então nenhuma aparece cortada na borda. */
        }

        .fav-ep-thumbstrip::-webkit-scrollbar { display: none; }

        .fav-ep-thumb {
          flex: 0 0 auto;
          width: 92px;
          aspect-ratio: 16 / 9;
          border-radius: 8px;
          overflow: hidden;
          padding: 0;
          border: 1.5px solid rgba(255,255,255,0.08);
          background: var(--surface);
          cursor: pointer;
          opacity: 0.55;
          transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .fav-ep-thumb img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        .fav-ep-thumb:hover { opacity: 0.85; transform: translateY(-1px); }
        .fav-ep-thumb.is-active { opacity: 1; border-color: #3b82f6; }

        /* ── Coluna de conteúdo: título, nota estilo IMDb + link, descrição ── */
        .fav-ep-content {
          padding: 22px 28px 24px 20px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
          min-width: 0;
        }

        .fav-ep-heading {
          display: flex;
          flex-direction: column;
          gap: 5px;
        }

        .fav-ep-anime {
          margin: 0;
          font-family: var(--font-title);
          font-weight: 800;
          font-size: 23px;
          color: #fff;
          line-height: 1.25;
        }

        .fav-ep-episode {
          font-size: 13px;
          font-weight: 600;
          color: var(--muted);
        }

        /* Linha com o selo de nota estilo IMDb + link pro anime */
        .fav-ep-rating-row {
          display: flex;
          align-items: center;
          gap: 16px;
          flex-wrap: wrap;
        }

        .fav-ep-rating {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          width: fit-content;
          text-decoration: none;
          cursor: pointer;
          transition: opacity 0.15s ease;
        }

        a.fav-ep-rating:hover { opacity: 0.8; }

        .fav-ep-rating-source {
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 12px;
          letter-spacing: -0.02em;
          color: #000;
          background: #f5c518;
          padding: 2px 6px;
          border-radius: 4px;
          line-height: 1.3;
        }

        .fav-ep-rating-value {
          font-family: var(--font-title);
          font-weight: 800;
          font-size: 15px;
          color: #fff;
        }

        .fav-ep-rating-max {
          font-size: 12px;
          font-weight: 600;
          color: var(--muted);
          margin-left: 1px;
        }

        /* Selo de nota pessoal, ao lado do selo do IMDb */
        .fav-ep-my-rating {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          width: fit-content;
          transition: opacity 0.15s ease;
        }

        /* Mesmo efeito de hover do selo do IMDb (opacity), mas sem cursor:pointer,
          já que o MNP não é um link clicável. */
        .fav-ep-my-rating:hover {
          opacity: 0.8;
        }

        .fav-ep-my-rating-source {
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 12px;
          letter-spacing: -0.02em;
          color: #0b0b0b;
          background: linear-gradient(135deg, #f8fafc, var(--glow-accent, #cbd5e1));
          padding: 2px 7px;
          border-radius: 4px;
          line-height: 1.3;
        }

        .fav-ep-my-rating-value {
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 16.5px;
          color: var(--glow-accent, #cbd5e1);
          text-shadow: 0 0 16px rgba(203,213,225,0.28);
        }

        .fav-ep-my-rating-max {
          font-size: 12px;
          font-weight: 700;
          color: var(--text);
          opacity: 0.75;
          margin-left: 1px;
        }

        .fav-ep-note {
          margin: 0;
          font-size: 14px;
          line-height: 1.65;
          color: #d1d5db;
          font-style: italic;
        }

        .fav-ep-quote-mark {
          font-family: var(--font-title);
          font-size: 26px;
          font-weight: 900;
          font-style: normal;
          color: rgba(59,130,246,0.55);
          line-height: 0;
          vertical-align: -5px;
          margin-right: 3px;
        }

        .fav-ep-quote-mark-end {
          margin-right: 0;
          margin-left: 3px;
        }

        @media (max-width: 760px) {
          li.fav-ep-card { grid-template-columns: 1fr; }
          /* No mobile o número não fica mais numa linha própria acima da
            imagem: o rank-wrap original é escondido e o número reaparece
            embutido antes do nome do anime (ex.: "#1 Code Geass..."),
            via ::before com o mesmo counter(item) que já numera a lista. */
          li.fav-ep-card .rank-wrap {
            display: none;
          }
          .fav-ep-anime::before {
            content: "#" counter(item) " ";
            font-weight: 900;
            color: rgba(255,255,255,0.4);
          }
          .fav-ep-content { padding: 18px 20px 22px; }
        }

        @media (max-width: 420px) {
          .fav-ep-anime { font-size: 19px; }
          .fav-ep-thumb { width: 62px; }
        }

        /* ══════════════════════════════════════════════════════════════════
          Fav Ep Lightbox — modal em tela cheia ao clicar na imagem de um
          card de "Peak Episodes". Baseado no layout de referência feito
          no Canva: imagem grande com contador, setas nas laterais, título +
          episódio centralizados e os selos MNP/IMDb embaixo (IMDb linkando
          pra ep.imdbUrl). Componente próprio, separado do .poster-lightbox
          (que é mais robusto e usado só pelo "All Animes"/"Watching Now").
          ══════════════════════════════════════════════════════════════════ */
        .fav-ep-lightbox {
          position: fixed;
          inset: 0;
          height: 100vh;
          height: 100dvh;
          z-index: 10000;
          display: none;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: rgba(0,0,0,0.55);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
          opacity: 0;
          transition: opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1);
          cursor: zoom-out;
        }

        .fav-ep-lightbox.open {
          display: flex;
          opacity: 1;
        }

        /* ── Ambient: a própria imagem do episódio, ampliada e borrada, como
          wallpaper do fundo (mesma mecânica do .poster-lightbox-ambient) ── */
        .fav-ep-lightbox-ambient {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          z-index: 0;
          pointer-events: none;
          overflow: hidden;
          opacity: 0;
          transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fav-ep-lightbox-ambient img {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 140%;
          height: 140%;
          min-width: 140vw;
          min-height: 140vh;
          object-fit: cover;
          filter: blur(70px) saturate(1.6) brightness(0.7);
          transform: translate(-50%, -50%) scale(1.4);
        }

        .fav-ep-lightbox-ambient::after {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 130% 120% at 50% 45%, transparent 0%, rgba(0,0,0,0.25) 100%);
        }

        .fav-ep-lightbox.open .fav-ep-lightbox-ambient.ready {
          opacity: 0.67;
        }

        .fav-ep-lightbox-box {
          position: relative;
          z-index: 1;
          width: 100%;
          max-width: min(96vw, 1400px);
          max-height: 92vh;
          overflow-y: auto;
          scrollbar-width: none;
          background: transparent;
          border: none;
          box-shadow: none;
          padding: 22px 22px 28px;
          display: flex;
          flex-direction: column;
          cursor: default;
          transform: scale(0.96);
          transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fav-ep-lightbox-box::-webkit-scrollbar { display: none; }

        .fav-ep-lightbox.open .fav-ep-lightbox-box {
          transform: scale(1);
        }

        /* Botão de fechar fixo no canto superior direito da tela, igual ao
          .poster-lightbox-close (não fica preso à caixa/box). */
        .fav-ep-lightbox-close {
          position: fixed;
          top: 20px;
          right: 24px;
          z-index: 2;
          width: 40px;
          height: 40px;
          border-radius: 12px;
          border: none;
          background: rgba(255,255,255,0.015);
          color: #cbd5e1;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          outline: none;
          transition: background 0.12s ease, color 0.12s ease, transform 0.12s ease;
        }

        .fav-ep-lightbox-close:hover {
          background: rgba(255,255,255,0.05);
          color: #fff;
          transform: scale(1.02);
        }

        .fav-ep-lightbox-close:focus,
        .fav-ep-lightbox-close:focus-visible {
          outline: none;
          box-shadow: none;
        }

        .fav-ep-lightbox-close svg {
          width: 22px;
          height: 22px;
          stroke: currentColor;
          stroke-width: 2.2;
          fill: none;
        }

        .fav-ep-lightbox-content {
          display: flex;
          align-items: flex-start;
          gap: 40px;
          width: 100%;
        }

        .fav-ep-lightbox-media {
          flex: 1 1 60%;
          min-width: 0;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .fav-ep-lightbox-image-wrap {
          position: relative;
          width: 100%;
          min-width: 0;
          line-height: 0;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .fav-ep-lightbox-image-wrap img {
          display: block;
          width: 100%;
          aspect-ratio: 16 / 9;
          object-fit: cover;
          background: var(--surface);
        }

        /* Mesmo contador "posição/total" (ex: 1/5) usado no card normal
          (.fav-ep-counter), só reaproveitado aqui dentro do lightbox. */
        .fav-ep-lightbox-counter {
          position: absolute;
          right: 10px;
          top: 10px;
          z-index: 2;
          font-family: var(--font-title);
          font-weight: 800;
          font-size: 13px;
          letter-spacing: 0.02em;
          line-height: 1.6;
          white-space: nowrap;
          color: #fff;
          background: rgba(10,10,10,0.6);
          backdrop-filter: blur(4px);
          -webkit-backdrop-filter: blur(4px);
          padding: 4px 12px;
          border-radius: 999px;
          pointer-events: none;
          box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
        }

        /* Tira de mini-thumbnails abaixo da imagem grande, com as setas ‹ ›
          nas laterais — reaproveita as classes .fav-ep-thumbnav /
          .fav-ep-thumbstrip / .fav-ep-thumb já usadas no carrossel do card. */
        #favEpLightboxThumbnav.fav-ep-thumbnav { display: none; }
        #favEpLightboxThumbnav.fav-ep-thumbnav.has-gallery { display: flex; }

        /* Ao contrário da tira do card (que preenche o espaço disponível e
          trava via JS em quantas miniaturas cabem inteiras), aqui a tira
          deve só ter o tamanho do próprio conteúdo, pra centralizar de
          verdade junto com as setas — sem sobrar espaço vazio de um lado. */
        #favEpLightboxThumbstrip.fav-ep-thumbstrip {
          flex: 0 1 auto;
          max-width: 100%;
        }

        .fav-ep-lightbox-info {
          flex: 1 1 34%;
          min-width: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding-top: 4px;
        }

        .fav-ep-lightbox-title {
          margin: 0;
          font-family: var(--font-title);
          font-weight: 800;
          font-size: 28px;
          color: #fff;
          text-align: left;
          line-height: 1.3;
        }

        .fav-ep-lightbox-rank {
          display: inline-block;
          margin-right: 6px;
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 0.68em;
          color: rgba(255,255,255,0.5);
          letter-spacing: -0.01em;
          vertical-align: middle;
        }

        .fav-ep-lightbox-rank.rank-gold { color: #d4af37; }
        .fav-ep-lightbox-rank.rank-silver { color: #b8bcc2; }
        .fav-ep-lightbox-rank.rank-bronze { color: #b0703f; }

        .fav-ep-lightbox-subtitle {
          margin: 10px 0 0;
          font-size: 15px;
          font-weight: 600;
          color: var(--muted);
          text-align: left;
        }

        .fav-ep-lightbox-badges {
          margin-top: 20px;
          display: flex;
          align-items: center;
          justify-content: flex-start;
          gap: 16px;
          flex-wrap: wrap;
        }

        /* Botão do Crunchyroll, ao lado do selo do IMDb: no PC é só a logo
          (o link já é óbvio pelo hover), no mobile a logo vem acompanhada
          do ícone de link externo, igual ao padrão já usado nos botões do
          "All Animes" (.rank-mal-label--crunchyroll). */
        .fav-ep-crunchyroll-btn {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          width: fit-content;
          text-decoration: none;
          cursor: pointer;
          transition: opacity 0.15s ease, filter 0.15s ease;
        }

        a.fav-ep-crunchyroll-btn:hover,
        a.fav-ep-crunchyroll-btn:focus-visible {
          filter: brightness(1.15);
          opacity: 0.85;
        }

        .fav-ep-crunchyroll-logo {
          display: block;
          width: auto;
          height: 17px;
          max-width: none;
          object-fit: contain;
        }

        .fav-ep-crunchyroll-btn svg {
          width: 12px;
          height: 12px;
          flex: 0 0 12px;
          color: var(--muted);
          opacity: 0.8;
        }

        @media (min-width: 641px) {
          .fav-ep-crunchyroll-btn svg { display: none; }
        }

        @media (max-width: 640px) {
          .fav-ep-lightbox { padding: 16px; }
          .fav-ep-lightbox-box { padding: 18px 16px 22px; border-radius: 18px; }
          .fav-ep-lightbox-content { flex-direction: column; align-items: center; gap: 18px; }
          .fav-ep-lightbox-media { flex: none; width: 100%; }
          .fav-ep-lightbox-info { align-items: center; text-align: center; padding-top: 0; }
          .fav-ep-lightbox-title,
          .fav-ep-lightbox-subtitle { text-align: center; font-size: 18px; }
          .fav-ep-lightbox-subtitle { font-size: 14px; }
          .fav-ep-lightbox-badges { justify-content: center; }
        }

        /* ── CALENDÁRIO DE LANÇAMENTOS ── */
        .calendar-toggle-btn[hidden] {
          display: none !important;
        }

        .calendar-toggle-btn {
          width: 44px !important;
          min-width: 44px !important;
          height: 44px;
          padding: 0 !important;
          flex: 0 0 44px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border: 0;
          border-radius: 14px;
          background: transparent;
          color: var(--muted);
          cursor: pointer;
          transition:
            color 0.18s ease,
            background 0.18s ease,
            transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.18s ease;
          -webkit-tap-highlight-color: transparent;
        }

        .calendar-toggle-btn svg {
          width: 21px;
          height: 21px;
          stroke-width: 2;
        }

        .calendar-toggle-btn.active {
          width: 40px !important;
          min-width: 40px !important;
          height: 40px;
          flex-basis: 40px;
          border: 0;
          border-radius: 12px;
          background: transparent;
          color: #cbd5e1;
          box-shadow: none;
        }

        .calendar-toggle-btn:hover,
        .calendar-toggle-btn.active:hover {
          background: rgba(255,255,255,0.05);
          color: #fff;
          transform: scale(1.02);
          box-shadow: none;
        }

        .calendar-toggle-btn.active svg {
          width: 22px;
          height: 22px;
          stroke-width: 2.2;
        }

        .release-calendar-view[hidden] {
          display: none !important;
        }

        /* No calendário, os cards não exibem posição/ranking.
           O layout mode-true-characters também cria o número via .meta::before,
           então os dois pontos precisam ser desligados aqui. */
        .release-calendar-list .rank-wrap {
          display: none !important;
        }

        .release-calendar-list .meta::before {
          content: none !important;
          display: none !important;
        }

        .release-calendar-view {
          width: 100%;
          max-width: none;
          margin: 0;
          padding: 0 0 42px;
          animation: releaseCalendarIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes releaseCalendarIn {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .release-calendar-head {
          display: none !important;
        }

        .release-calendar-kicker {
          margin: 0 0 7px;
          color: var(--muted);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.18em;
          text-transform: uppercase;
        }

        .release-calendar-title {
          margin: 0;
          color: var(--text);
          font: 800 clamp(26px, 3vw, 38px)/1 var(--font-title);
          letter-spacing: -0.025em;
        }

        .release-calendar-count {
          color: var(--muted);
          font-size: 12px;
          font-weight: 700;
          white-space: nowrap;
        }

        .release-day-section {
          padding: 22px 0 34px;
        }

        .release-day-header {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 18px;
        }

        .release-day-name {
          margin: 0;
          color: #fff;
          font: 800 24px/1 var(--font-title);
          letter-spacing: 0.02em;
          text-transform: uppercase;
        }

        .release-day-line {
          display: none;
        }

        .release-calendar-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
          gap: 18px 14px;
        }

        .release-calendar-card {
          position: relative;
          min-width: 0;
        }

        .release-calendar-poster {
          position: relative;
          width: 100%;
          aspect-ratio: 2 / 3;
          overflow: hidden;
          border-radius: 13px;
          background: #111;
          box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
          transform: translateZ(0);
          transition:
            transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.25s ease;
        }

        .release-calendar-card:hover .release-calendar-poster {
          transform: translateY(-3px);
          box-shadow:
            0 12px 30px rgba(0,0,0,0.34),
            0 0 0 1px rgba(255,255,255,0.13);
        }

        .release-calendar-poster img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .release-calendar-card:hover .release-calendar-poster img {
          transform: scale(1.025);
        }

        .release-calendar-card-title {
          margin: 9px 2px 0;
          color: rgba(255,255,255,0.88);
          font-size: 12px;
          font-weight: 700;
          line-height: 1.35;
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          overflow: hidden;
        }

        .release-calendar-empty {
          grid-column: 1 / -1;
          min-height: 84px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px dashed rgba(255,255,255,0.08);
          border-radius: 14px;
          color: rgba(156,163,175,0.62);
          font-size: 12px;
          font-weight: 600;
        }

        .release-calendar-list {
          margin: 0 !important;
          width: 100%;
        }

        .release-calendar-list .anime-item {
          content-visibility: visible;
        }

        .release-calendar-list .watch-progress {
          display: none !important;
        }

        .release-calendar-list .anime-item {
          cursor: pointer !important;
        }

        .release-day-section .release-calendar-empty {
          width: 100%;
          min-height: 72px;
        }

        body.release-calendar-mode #rankingContainer,
        body.release-calendar-mode .load-more-container {
          display: none !important;
        }

        @media (max-width: 600px) {
          .header-controls {
            gap: 5px;
          }

          .calendar-toggle-btn {
            width: 42px !important;
            min-width: 42px !important;
            height: 42px;
            border-radius: 12px;
          }

          .release-calendar-view {
            padding: 0 0 28px;
          }

          .release-calendar-head {
            margin: 0 2px 12px;
            padding-bottom: 14px;
          }

          .release-calendar-title {

              "media info"
              "list list"
              "meta meta"
              "synopsis synopsis"

              "mal mal";

      <script src="info.js"></script>
      <script>
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }

        document.addEventListener("DOMContentLoaded", async function() {
          // ── Trava de scroll compartilhada por todos os drawers/lightbox ──
          // Importante: NUNCA muda "overflow" de html/body. Em vez disso, fixa o
          // body na posição atual (position:fixed + top negativo). Como a
          // propriedade "overflow" nunca é tocada, o navegador nunca recalcula a
          // presença/ausência da scrollbar nativa, então a largura da página
          // (e dos cards) nunca muda ao abrir/fechar um drawer, em nenhum navegador.
          let __scrollLockCount = 0;
          let __scrollLockY = 0;

          function lockBodyScroll() {
            if (__scrollLockCount === 0) {
              __scrollLockY = window.scrollY || window.pageYOffset || 0;
              document.body.style.position = 'fixed';
              document.body.style.top = (-__scrollLockY) + 'px';
              document.body.style.left = '0';
              document.body.style.right = '0';
              document.body.style.width = '100%';
            }
            __scrollLockCount++;
          }

          function unlockBodyScroll(skipRestore) {
            __scrollLockCount = Math.max(0, __scrollLockCount - 1);
            if (__scrollLockCount === 0) {
              document.body.style.position = '';
              document.body.style.top = '';
              document.body.style.left = '';
              document.body.style.right = '';
              document.body.style.width = '';
              // Quando quem chamou já sabe que vai rolar a página pra outro lugar
              // em seguida (ex.: clique num resultado da busca que leva pra um
              // card específico), pular esse scrollTo evita uma corrida no
              // mobile: remover o position:fixed dispara um reflow que alguns
              // navegadores mobile aplicam de forma meio assíncrona, então esse
              // scrollTo "restaurando a posição antiga" às vezes só é efetivado
              // DEPOIS do scroll intencional pro card, cancelando ele e jogando
              // a página de volta pro topo da lista/categoria.
              if (!skipRestore) window.scrollTo(0, __scrollLockY);
            }
          }

          // Uma navegação intencional (busca/tag/calendário) vai definir uma
          // posição nova logo em seguida. Garante que nenhuma trava residual do
          // drawer ou lightbox continue segurando o body em fixed.
          function releaseBodyScrollForNavigation() {
            __scrollLockCount = 0;
            document.body.style.position = '';
            document.body.style.top = '';
            document.body.style.left = '';
            document.body.style.right = '';
            document.body.style.width = '';
          }

          // Cache dos pôsteres verticais usados pelo poster lightbox. No mobile
          // os cards exibem thumbs horizontais leves; sem este aquecimento, o
          // arquivo vertical só começava a baixar depois do clique.
          const __lightboxPosterCache = new Map();

          function preloadLightboxPoster(src, priority = 'auto') {
            const cleanSrc = String(src || '').trim();
            if (!cleanSrc) return Promise.resolve(false);

            const cached = __lightboxPosterCache.get(cleanSrc);
            if (cached) {
              if (priority === 'high' && cached.image && 'fetchPriority' in cached.image) {
                cached.image.fetchPriority = 'high';
              }
              return cached.promise;
            }

            const image = new Image();
            image.decoding = 'async';
            if ('fetchPriority' in image) image.fetchPriority = priority;

            const entry = { image, loaded: false, promise: null };
            let settlePreload;
            entry.promise = new Promise(resolve => {
              settlePreload = resolve;
              image.onload = () => {
                entry.loaded = true;
                resolve(true);
              };
              image.onerror = () => resolve(false);
            });
            __lightboxPosterCache.set(cleanSrc, entry);
            image.src = cleanSrc;

            if (image.complete && image.naturalWidth > 0) {
              entry.loaded = true;
              queueMicrotask(() => settlePreload(true));
            }
            return entry.promise;
          }

          // Começa o download no pointerdown/touchstart, antes do evento click.
          // Mesmo quando ainda não der tempo de concluir, isso elimina uma parte
          // importante da latência de abertura em conexões móveis.
          document.addEventListener('pointerdown', (event) => {
            if (!window.matchMedia('(max-width: 760px)').matches) return;
            const item = event.target.closest('.anime-item');
            if (!item) return;
            const img = item.querySelector('.poster-wrap img.thumb');
            const src = img && img.getAttribute('data-poster-src');
            if (src) preloadLightboxPoster(src, 'high');
          }, { capture: true, passive: true });

          // ── Lightbox: amplia a imagem do card ao clicar nela ──
          (function initPosterLightbox() {
            const lightbox = document.getElementById('posterLightbox');
            const lightboxAmbient = document.getElementById('posterLightboxAmbient');
            const lightboxImg = document.getElementById('posterLightboxImg');
            const lightboxHeroRank = document.getElementById('posterLightboxHeroRank');
            const lightboxTitle = document.getElementById('posterLightboxTitle');
            const lightboxList = document.getElementById('posterLightboxList');
            const lightboxSynopsis = document.getElementById('posterLightboxSynopsis');
            const lightboxAnnounce = document.getElementById('posterLightboxAnnounce');
            const lightboxRatings = document.getElementById('posterLightboxRatings');
            const lightboxMeta = document.getElementById('posterLightboxMeta');
            const lightboxMal = document.getElementById('posterLightboxMal');
            const lightboxMoreInfo = document.getElementById('posterLightboxMoreInfo');
            const lightboxMediaWatchNow = document.getElementById('posterLightboxMediaWatchNow');
            const lightboxInfo = document.getElementById('posterLightboxInfo');
            const lightboxSimpleCategory = document.getElementById('posterLightboxSimpleCategory');
            const lightboxMediaCategory = document.getElementById('posterLightboxMediaCategory');
            const lightboxSimpleCaption = document.getElementById('posterLightboxSimpleCaption');
            const lightboxSimpleLink = document.getElementById('posterLightboxSimpleLink');
            const calendarBtn = document.getElementById('posterLightboxCalendar');
            const soundBtn = document.getElementById('posterLightboxSound');
            const closeBtn = document.getElementById('posterLightboxClose');
            if (!lightbox || !lightboxImg || !closeBtn) return;

            function findSynopsisSource(item, title) {
              const animeId = item.getAttribute('data-calendar-target') || item.id || '';
              const pools = [animeData, watchingData, planToWatchData];
              for (const pool of pools) {
                const byId = pool.find(anime => anime && anime.id === animeId && anime.synopsis);
                if (byId) return byId;
              }
              for (const pool of pools) {
                const byTitle = pool.find(anime => anime && anime.title === title && anime.synopsis);
                if (byTitle) return byTitle;
              }
              return null;
            }

            function renderSynopsis(item, title) {
              if (!lightboxSynopsis) return;
              const source = findSynopsisSource(item, title);
              const synopsis = source && source.synopsis
                ? String(source.synopsis).trim()
                : '';

              lightboxSynopsis.classList.remove('expanded');
              if (!synopsis) {
                lightboxSynopsis.innerHTML = '';
                return;
              }

              const canExpand = synopsis.length > 185;
              const synopsisHeading = canExpand
                ? `<button type="button" class="poster-lightbox-synopsis-header" aria-expanded="false" aria-label="Mostrar sinopse completa"><span class="poster-lightbox-synopsis-label">SINOPSE</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>`
                : `<div class="poster-lightbox-synopsis-header"><span class="poster-lightbox-synopsis-label">SINOPSE</span></div>`;
              lightboxSynopsis.innerHTML = `
                ${synopsisHeading}
                <p class="poster-lightbox-synopsis-text">${escapeHtml(synopsis)}</p>
              `;
            }

            if (lightboxSynopsis) {
              lightboxSynopsis.addEventListener('click', function(e) {
                const toggle = e.target.closest('.poster-lightbox-synopsis-header');
                if (!toggle || !toggle.matches('button')) return;
                const expanded = lightboxSynopsis.classList.toggle('expanded');
                toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                toggle.setAttribute('aria-label', expanded ? 'Recolher sinopse' : 'Mostrar sinopse completa');
              });
            }

            // ── Zoom da imagem no mobile: toca no pôster pequeno e ele aparece
            // ampliado, centralizado, por cima de tudo. Só liga no mobile
            // (ver check da media query dentro do listener de click). ──
            const lightboxImageWrap = lightbox.querySelector('.poster-lightbox-image-wrap');
            const lightboxZoom = document.getElementById('posterLightboxZoom');
            const lightboxZoomImg = document.getElementById('posterLightboxZoomImg');
            const MOBILE_QUERY = '(max-width: 760px)';

            function closeImageZoom() {
              if (!lightboxZoom) return;
              lightboxZoom.classList.remove('open');
              lightboxZoom.setAttribute('aria-hidden', 'true');
            }

            if (lightboxImageWrap && lightboxZoom && lightboxZoomImg) {
              lightboxImageWrap.addEventListener('click', function(e) {
                if (!window.matchMedia(MOBILE_QUERY).matches) return;
                if (!lightboxImg.src) return;
                e.preventDefault();
                e.stopPropagation();
                lightboxZoomImg.src = lightboxImg.src;
                lightboxZoomImg.alt = lightboxImg.alt;
                lightboxZoom.classList.add('open');
                lightboxZoom.setAttribute('aria-hidden', 'false');
              });

              lightboxZoom.addEventListener('click', function(e) {
                e.stopPropagation();
                closeImageZoom();
              });
            }

            let lastFocused = null;
            let currentItem = null;
            let pendingItem = null;
            let lightboxRenderToken = 0;

            // ── Som especial ao abrir o poster-lightbox do Re:ZERO ──
            const rezeroSound = new Audio('assets/sound-effects/rdb-rezero.mp3');
            rezeroSound.loop = true;
            const REZERO_IDS = ['re-zero', 're-zero-4'];

            // ── Som especial ao abrir o poster-lightbox do JJK (sem loop) ──
            const jjkSound = new Audio('assets/sound-effects/yuta-jjk.mp3');
            jjkSound.loop = false;
            const JJK_IDS = ['jjk'];

            // ── Som especial ao abrir o poster-lightbox do AOT (sem loop) ──
            const aotSound = new Audio('assets/sound-effects/aot-roar.mp3');
            aotSound.loop = false;
            const AOT_IDS = ['aot', 'rw-aot'];

            // ── Som especial ao abrir o poster-lightbox do One Piece (sem loop) ──
            const onePieceSound = new Audio('assets/sound-effects/luffy-haki.mp3');
            onePieceSound.loop = false;
            const ONE_PIECE_IDS = ['one-piece'];

            // ── Controle global e persistente dos efeitos do poster lightbox ──
            const POSTER_SOUND_MUTED_KEY = 'posterLightboxSoundMuted';
            const posterSoundEffects = [rezeroSound, jjkSound, aotSound, onePieceSound];
            let posterSoundMuted = false;
            try {
              posterSoundMuted = localStorage.getItem(POSTER_SOUND_MUTED_KEY) === 'true';
            } catch (e) {}

            function itemHasPosterSound(item) {
              if (!item || !item.id) return false;
              return REZERO_IDS.includes(item.id)
                || JJK_IDS.includes(item.id)
                || AOT_IDS.includes(item.id)
                || ONE_PIECE_IDS.includes(item.id);
            }

            function updatePosterSoundButton() {
              posterSoundEffects.forEach(audio => { audio.muted = posterSoundMuted; });
              if (!soundBtn) return;
              const soundOnIcon = soundBtn.querySelector('.poster-lightbox-sound-on');
              const soundOffIcon = soundBtn.querySelector('.poster-lightbox-sound-off');
              if (soundOnIcon) soundOnIcon.style.display = posterSoundMuted ? 'none' : '';
              if (soundOffIcon) soundOffIcon.style.display = posterSoundMuted ? '' : 'none';
              soundBtn.setAttribute('aria-pressed', posterSoundMuted ? 'true' : 'false');
              soundBtn.setAttribute('aria-label', posterSoundMuted ? 'Ativar efeitos sonoros' : 'Silenciar efeitos sonoros');
              soundBtn.title = posterSoundMuted ? 'Ativar efeitos sonoros (M)' : 'Silenciar efeitos sonoros (M)';
            }

            function togglePosterSound() {
              posterSoundMuted = !posterSoundMuted;
              try {
                localStorage.setItem(POSTER_SOUND_MUTED_KEY, String(posterSoundMuted));
              } catch (e) {}
              updatePosterSoundButton();
            }

            updatePosterSoundButton();

            // ── Fade-out suave para os sound effects (usado ao fechar o lightbox) ──
            const _audioFadeTimers = new WeakMap();

            function fadeOutAudio(audio, duration = 1800) {
              if (!audio) return;
              const existingTimer = _audioFadeTimers.get(audio);
              if (existingTimer) {
                clearInterval(existingTimer);
                _audioFadeTimers.delete(audio);
              }
              if (audio.paused) return;
              const steps = 20;
              const stepTime = duration / steps;
              const startVolume = audio.volume > 0 ? audio.volume : 1;
              const volumeStep = startVolume / steps;
              let currentStep = 0;
              const timer = setInterval(() => {
                currentStep++;
                const newVolume = Math.max(0, startVolume - (volumeStep * currentStep));
                audio.volume = newVolume;
                if (currentStep >= steps || newVolume <= 0) {
                  clearInterval(timer);
                  _audioFadeTimers.delete(audio);
                  audio.pause();
                  audio.currentTime = 0;
                  audio.volume = startVolume;
                }
              }, stepTime);
              _audioFadeTimers.set(audio, timer);
            }

            function stopAudioInstantly(audio) {
              if (!audio) return;
              const existingTimer = _audioFadeTimers.get(audio);
              if (existingTimer) {
                clearInterval(existingTimer);
                _audioFadeTimers.delete(audio);
              }
              audio.pause();
              audio.currentTime = 0;
              if (audio.volume === 0) audio.volume = 1;
            }

            // ── Sistema de notas (Story / Animation / Characters / Ending) ──
            const RATING_CATEGORIES = [
              { key: 'animation',  label: 'Animation' },
              { key: 'characters', label: 'Characters' },
              { key: 'emotional',  label: 'Emotional Impact' },
            ];
            const RATINGS_STORAGE_KEY = 'myanimerank_ratings';
            const EXCLUDED_STORAGE_KEY = 'myanimerank_excluded_categories';
            const META_STORAGE_KEY = 'myanimerank_meta';
            const META_FIELDS = [
              { key: 'studio',  label: 'Studio',    placeholder: 'br' },
              { key: 'season',  label: 'Year', placeholder: 'br' },
              { key: 'rewatch', label: 'Rewatch',   placeholder: 'patapim' }
            ];

            // ── SCORE ao vivo do MyAnimeList ──
            // Campo extra que aparece à esquerda do Studio, só quando o anime
            // tem um "malUrl" cadastrado (Watching Now / Plan to Watch — ver
            // showItem/renderMeta). O número vem direto da API pública do
            // Jikan (api.jikan.moe, espelho não-oficial do MyAnimeList), então
            // se a nota mudar lá no MAL, ela muda sozinha aqui também — sem
            // precisar editar nada no site. O valor fica em cache (localStorage)
            // por algumas horas pra não bater na API toda hora à toa.
            const SCORE_FIELD = { key: 'score', label: 'MAL Score', placeholder: '–' };
            const MAL_SCORE_CACHE_KEY = 'myanimerank_mal_score_cache';
            const MAL_SCORE_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 horas (nota já existe)
            // Quando o anime ainda não estreou (ou a nota do MAL ainda não
            // existe), o cache dura bem menos — assim, assim que ele ganhar
            // nota lá no MAL, o site pega isso rápido, sem ficar preso num
            // "sem nota" antigo por 6h.
            const MAL_SCORE_NULL_TTL_MS = 30 * 60 * 1000; // 30 minutos

            function extractMalId(malUrl) {
              if (!malUrl) return null;
              const m = String(malUrl).match(/myanimelist\.net\/anime\/(\d+)/i);
              return m ? m[1] : null;
            }

            function loadMalScoreCache() {
              try {
                return JSON.parse(localStorage.getItem(MAL_SCORE_CACHE_KEY) || '{}');
              } catch (e) {
                return {};
              }
            }

            function saveMalScoreCache(cache) {
              try {
                localStorage.setItem(MAL_SCORE_CACHE_KEY, JSON.stringify(cache));
              } catch (e) {}
            }

            function getCachedMalScore(malId) {
              if (!malId) return null;
              const cache = loadMalScoreCache();
              return cache[malId] || null;
            }

            function setCachedMalScore(malId, score) {
              if (!malId) return;
              const cache = loadMalScoreCache();
              cache[malId] = { score: score, ts: Date.now() };
              saveMalScoreCache(cache);
            }

            function formatMalScoreText(score) {
              return (typeof score === 'number' && !isNaN(score)) ? score.toFixed(2) : '–';
            }

            // Fila simples: espaça as chamadas à API do Jikan (limite público
            // de ~3 por segundo) pra não tomar erro 429 quando o usuário
            // navega rápido entre vários pôsteres do lightbox.
            let malFetchQueueTail = Promise.resolve();
            function queueMalFetch(task) {
              const run = () => task().catch(() => null);
              const result = malFetchQueueTail.then(run);
              malFetchQueueTail = result.then(() => new Promise(resolve => setTimeout(resolve, 400)));
              return result;
            }

            function fetchMalScoreFromApi(malId) {
              return fetch(`https://api.jikan.moe/v4/anime/${malId}`)
                .then(res => {
                  if (!res.ok) throw new Error('jikan http ' + res.status);
                  return res.json();
                })
                .then(json => {
                  const score = json && json.data ? json.data.score : null;
                  return (typeof score === 'number') ? score : null;
                });
            }

            // Busca (com cache) a nota atual do MAL e atualiza o campo na tela
            // — só se o lightbox ainda estiver mostrando esse mesmo anime
            // quando a resposta chegar (evita atualizar o card errado depois
            // que o usuário já trocou de pôster).
            function updateLiveMalScore(animeId, malId, valueEl) {
              if (!malId || !valueEl) return;
              const cached = getCachedMalScore(malId);
              if (cached) {
                valueEl.textContent = formatMalScoreText(cached.score);
                valueEl.classList.toggle('empty', cached.score == null);
              }
              const ttl = (cached && cached.score == null) ? MAL_SCORE_NULL_TTL_MS : MAL_SCORE_CACHE_TTL_MS;
              const isFresh = cached && (Date.now() - cached.ts) < ttl;
              if (isFresh) return;
              queueMalFetch(() => fetchMalScoreFromApi(malId)).then(score => {
                setCachedMalScore(malId, score);
                if (!currentItem || currentItem.id !== animeId) return;
                const liveEl = lightboxMeta && lightboxMeta.querySelector('.rank-meta-value[data-field="score"]');
                if (liveEl) {
                  liveEl.textContent = formatMalScoreText(score);
                  liveEl.classList.toggle('empty', score == null);
                }
              });
            }

            function loadAllMeta() {
              try {
                return JSON.parse(localStorage.getItem(META_STORAGE_KEY) || '{}');
              } catch (e) {
                return {};
              }
            }

            function saveAllMeta(data) {
              try {
                localStorage.setItem(META_STORAGE_KEY, JSON.stringify(data));
              } catch (e) {}
            }

            function getMetaFor(animeId) {
              const all = loadAllMeta();
              const staticMeta = (typeof ANIME_STATIC_META !== 'undefined' && ANIME_STATIC_META[animeId]) || {};
              return { ...staticMeta, ...(all[animeId] || {}) };
            }

            function renderMeta(animeId, isWatchingNow, malUrl, allowLiveScore) {
              if (!lightboxMeta) return;
              // Somente leitura: os valores vêm direto do rawAnimeData (studio, airedSeason, rewatch).
              // Para alterar, edite o objeto correspondente no rawAnimeData pelo VSCode.
              const metaObj = getMetaFor(animeId);

              // No "Watching Now", o campo "Rewatch" não aparece em nenhum
              // Posterlight Box. Nos demais cards, continua sendo exibido normalmente.
              let fields = isWatchingNow
                ? META_FIELDS.filter(field => field.key !== 'rewatch')
                : META_FIELDS;

              // SCORE (nota ao vivo do MAL): só entra na frente do Studio
              // quando o card permite (Watching Now / Plan to Watch) e o
              // anime tem um "malUrl" cadastrado — ver showItem.
              const malId = allowLiveScore ? extractMalId(malUrl) : null;
              if (malId) {
                fields = [SCORE_FIELD, ...fields];
              }

              lightboxMeta.style.gridTemplateColumns = `repeat(${fields.length}, 1fr)`;

              const fieldsHtml = fields.map(field => {
                if (field.key === 'score') {
                  const cached = getCachedMalScore(malId);
                  const initialText = cached ? formatMalScoreText(cached.score) : '…';
                  return `
                  <div class="rank-meta-item">
                    <span class="rank-meta-label">${field.label}</span>
                    <a class="rank-meta-value rank-meta-value--score" data-field="score" href="${escapeHtml(malUrl)}" target="_blank" rel="noopener">${initialText}</a>
                  </div>`;
                }
                let rawValue = metaObj[field.key] || '';
                const isEmpty = !rawValue;
                // O "!" no final de "season" é só um marcador interno e não deve
                // aparecer pro usuário no campo de Lançamento.
                if (field.key === 'season') {
                  rawValue = rawValue.replace(/!$/, '');
                  // Lançamentos ainda em exibição (ex: "1999-?", "2023-?") mostram
                  // só o ano de início ("1999", "2023") — sem o "-?". Intervalos já
                  // fechados (ex: "2006-2008") continuam aparecendo por completo.
                  rawValue = rawValue.replace(/-\?$/, '');
                }
                // Quando há mais de um estúdio (ex: "Wit Studio/MAPPA" ou "PB
                // Animation, LAN Studio, ..."), a lista pode vir separada por
                // "/" ou por vírgula na origem — por isso quebramos por ambos
                // pra sempre extrair os nomes individuais. A partir daí, o
                // separador de exibição segue uma regra fixa: 2 estúdios usam
                // " and " (ex: "Studio 1 and Studio 2"); 3 ou mais usam vírgula
                // (ex: "Studio 1, Studio 2, Studio 3").
                const studioParts = field.key === 'studio'
                  ? rawValue.split(/[\/,]/).map(s => s.trim()).filter(Boolean)
                  : [];
                const isMultiStudio = field.key === 'studio' && studioParts.length > 1;
                const studioSeparator = studioParts.length >= 3 ? ', ' : ' and\u00A0';
                const displayValueHtml = isMultiStudio
                  ? (studioParts.length >= 3
                      ? studioParts.slice(0, -1).map(s => escapeHtml(s)).join(studioSeparator) + ' ' + escapeHtml(studioParts[studioParts.length - 1])
                      : studioParts.map(s => escapeHtml(s)).join(studioSeparator))
                  : escapeHtml(rawValue);
                const labelText = isMultiStudio ? field.label + 's' : field.label;
                const clampClass = field.key === 'studio' ? ' rank-meta-value--clamp' : '';
                return `
                  <div class="rank-meta-item">
                    <span class="rank-meta-label">${labelText}</span>
                    <span class="rank-meta-value${isEmpty ? ' empty' : ''}${clampClass}"
                          data-field="${field.key}">${isEmpty ? escapeHtml(field.placeholder) : displayValueHtml}</span>
                  </div>`;
              }).join('');

              lightboxMeta.innerHTML = fieldsHtml;

              if (malId) {
                const scoreEl = lightboxMeta.querySelector('.rank-meta-value[data-field="score"]');
                updateLiveMalScore(animeId, malId, scoreEl);
              }
            }

            // ── Notas do MyAnimeList (por temporada) ──
            // Só aparece nos cards do "All Animes" (animeData) e somente quando o
            // item tiver um array "mal" preenchido, ex:
            //   mal: [ { label: "1ª temporada", episodes: 25, note: 8.42 }, ... ]
            // Basta editar o objeto correspondente lá no rawAnimeData.
            // Ícone de link externo (mesmo usado no botão do MyAnimeList),
            // reaproveitado nos botões do Anime-Planet e Crunchyroll.
            const EXTERNAL_LINK_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path></svg>`;

            // Ícone (•••) do botão que revela Crunchyroll/MyAnimeList escondidos
            // atrás do Anime-Planet — ver ".watch-now-toggle"/".watch-now-extra".
            const WATCH_NOW_TOGGLE_ICON_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;

            // Link para a sua lista pessoal no MyAnimeList. Usado no logo do MAL
            // dentro do lightbox do "All Animes" — só é clicável no PC (ver CSS
            // ".rank-mal > .rank-mal-label--mal", regra @media min-width:761px);
            // no mobile o logo continua sendo só um ícone, sem ação.
            // Base da URL da sua lista pessoal no MyAnimeList. Cada card do
            // lightbox do "All Animes" usa essa base + o título do anime (via
            // "?s=") pra abrir a lista já filtrada por aquele anime específico.
            const MAL_PROFILE_LIST_BASE_URL = 'https://myanimelist.net/animelist/kssrenba';

            function buildMalProfileSearchUrl(item) {
              if (!item) return MAL_PROFILE_LIST_BASE_URL;
              // "malSearch" é um termo de busca escrito à mão pra casos em que
              // o título completo (ou a parte antes dos ":") não bate direito
              // com o nome que aparece na sua lista do MAL — ex: "Re:ZERO"
              // (o ":" vem colado, sem espaço, então cortar nele vira só "Re")
              // ou "Danmachi" (que na sua lista aparece como "Is It Wrong...").
              // Quando não houver "malSearch", cai no padrão: usa a parte antes
              // de ": " (dois pontos seguido de espaço) — só corta aí porque
              // ":" colado numa palavra (tipo "Re:ZERO") normalmente é parte
              // do próprio nome, não um separador de subtítulo.
              if (item.malSearch) return `${MAL_PROFILE_LIST_BASE_URL}?s=${encodeURIComponent(item.malSearch)}&order=-14`;
              const title = item.title || '';
              const colonSplitIndex = title.indexOf(': ');
              const shortTitle = colonSplitIndex !== -1 ? title.slice(0, colonSplitIndex) : title;
              return `${MAL_PROFILE_LIST_BASE_URL}?s=${encodeURIComponent(shortTitle)}&order=-14`;
            }

            function buildAnimePlanetButtonHtml(url) {
              if (!url) return '';
              return `
                <a class="rank-mal-label rank-mal-label--anime-planet" href="${url}" target="_blank" rel="noopener">
                  <span class="watch-now-more-info-text">LINKS ABOUT</span>
                  <img class="anime-planet-btn-logo" src="assets/credits-webp/anime-planet.webp" alt="Anime-Planet" loading="lazy" decoding="async">
                  ${EXTERNAL_LINK_ICON_SVG}
                </a>`;
            }

            function buildCrunchyrollButtonHtml(url) {
              if (!url) return '';
              // Link normal do Crunchyroll: se o app estiver instalado no
              // celular, o próprio sistema (universal link / app link) abre
              // ele direto no app; sem o app, cai no site normalmente.
              // Quando o link é do YouTube (ex.: Golden Boy, que não tem no
              // Crunchyroll), troca a logo pra do YouTube.
              const isYoutube = /youtube\.com|youtu\.be/i.test(url);
              const logoSrc = isYoutube ? 'assets/credits-webp/youtube.webp' : 'assets/credits-webp/crunchyroll.webp';
              const logoAlt = isYoutube ? 'YouTube' : 'Crunchyroll';
              const logoClass = isYoutube ? 'crunchyroll-btn-logo crunchyroll-btn-logo--youtube' : 'crunchyroll-btn-logo';
              return `
                <a class="rank-mal-label rank-mal-label--crunchyroll" href="${url}" target="_blank" rel="noopener">
                  <img class="${logoClass}" src="${logoSrc}" alt="${logoAlt}" loading="lazy" decoding="async">
                  ${EXTERNAL_LINK_ICON_SVG}
                </a>`;
            }

            function buildNetflixButtonHtml(url) {
              if (!url) return '';
              return `
                <a class="rank-mal-label rank-mal-label--netflix" href="${url}" target="_blank" rel="noopener">
                  <img class="netflix-btn-logo" src="assets/credits-webp/netflix.webp" alt="Netflix" loading="lazy" decoding="async">
                  ${EXTERNAL_LINK_ICON_SVG}
                </a>`;
            }

            function buildWatchNowMalButtonHtml(url) {
              if (!url) return '';
              return `
                <a class="rank-mal-label rank-mal-label--mal" href="${url}" target="_blank" rel="noopener">
                  <img class="mal-btn-logo" src="assets/credits-webp/myanimelist.webp" alt="MyAnimeList" loading="lazy" decoding="async">
                  ${EXTERNAL_LINK_ICON_SVG}
                </a>`;
            }

            // Botão "LINKS ABOUT" do MyAnimeList usado no lightbox do "All
            // Animes" (myranks), acima das notas/temporadas — visual IDÊNTICO
            // ao botão "LINKS ABOUT" do Anime-Planet usado no Watching Now/
            // Plan to Watch (mesma marcação: texto "LINKS ABOUT" + logo +
            // ícone de link externo dentro de ".watch-now-links"), só que
            // aponta pra sua lista pessoal no MyAnimeList em vez do
            // Anime-Planet. Ver CSS ".rank-mal-label--links-about".
            function buildMalLinksAboutButtonHtml(url) {
              if (!url) return '';
              return `
                <a class="rank-mal-label rank-mal-label--mal rank-mal-label--links-about" href="${url}" target="_blank" rel="noopener">
                  <span class="watch-now-more-info-text">LINKS ABOUT</span>
                  <img class="mal-btn-logo" src="assets/credits-webp/myanimelist.webp" alt="MyAnimeList" loading="lazy" decoding="async">
                  ${EXTERNAL_LINK_ICON_SVG}
                </a>`;
            }


            // Monta as linhas de "1ª temporada", "2ª temporada" etc. (sem nota)
            // pra um anime do Watching Now que ainda não tem entrada no Global
            // Ranking, reaproveitando os mesmos campos já usados na barra de
            // progresso (seasons/movieSeasons/movieDurations/cours) — ver
            // buildAnimeItemHtml, mais abaixo, onde esses campos também viram
            // os marcadores de temporada/filme/cour da barra.
            function buildWatchingSeasonEntries(watchItem) {
              if (!watchItem || !Array.isArray(watchItem.seasons) || !watchItem.seasons.length) return null;
              const movieIdxSet = new Set(Array.isArray(watchItem.movieSeasons) ? watchItem.movieSeasons : []);
              const courRomanNumerals = ['I', 'II', 'III', 'IV', 'V'];
              // Total de temporadas "de verdade" (exclui os índices que são
              // filme). Quando só existe UMA, o label vira "1 temporada" em vez
              // de "1ª temporada" — o ordinal só faz sentido quando há mais de
              // uma temporada pra numerar/diferenciar.
              const totalSeasons = watchItem.seasons.reduce(
                (count, _epCount, idx) => count + (movieIdxSet.has(idx) ? 0 : 1),
                0
              );
              let seasonNum = 0;
              const entries = [];
              watchItem.seasons.forEach((epCount, idx) => {
                if (movieIdxSet.has(idx)) {
                  const duration = watchItem.movieDurations && watchItem.movieDurations[idx];
                  // "movieLabels" (opcional): permite dar um nome específico ao
                  // filme (ex: "Movie 5: The Dumpster Battle", "Movie: Legend of
                  // Crimson") em vez do genérico "Filme". Usado quando o filme
                  // tem um subtítulo próprio que vale a pena mostrar.
                  const movieLabel = (watchItem.movieLabels && watchItem.movieLabels[idx]) || 'Filme';
                  entries.push({ label: movieLabel, episodes: duration || epCount, noRating: true });
                  return;
                }
                seasonNum++;
                const seasonWord = totalSeasons === 1 ? `${seasonNum} temporada` : `${seasonNum}ª temporada`;
                // Quando só existe UMA temporada ("1 temporada", sem ordinal),
                // trata a linha como "unwatched" (nome/episódios riscados,
                // nota "-/-") em vez de "noRating" — igual a uma temporada
                // anunciada/ainda não assistida, já que não há temporadas
                // anteriores já avaliadas pra "ancorar" essa linha como em
                // progresso. "allUnwatched" (opcional no watchItem) força esse
                // mesmo tratamento em TODAS as temporadas, mesmo quando há mais
                // de uma (ex: Mob Psycho 100).
                const singleSeasonFlag = (totalSeasons === 1 || watchItem.allUnwatched) ? { unwatched: true } : { noRating: true };
                const courSplit = Array.isArray(watchItem.cours) ? watchItem.cours[idx] : null;
                if (Array.isArray(courSplit) && courSplit.length > 1) {
                  courSplit.forEach((courEpCount, cIdx) => {
                    const courLabel = courRomanNumerals[cIdx] || String(cIdx + 1);
                    entries.push({ label: `${seasonWord} ${courLabel}`, episodes: courEpCount, ...singleSeasonFlag });
                  });
                } else {
                  entries.push({ label: seasonWord, episodes: epCount, ...singleSeasonFlag });
                }
              });
              return entries;
            }

            // Monta, na MESMA ordem/granularidade usada acima (temporada por
            // temporada, respeitando "cours" e filmes intercalados), o total
            // ACUMULADO de episódios até o fim de cada linha. Isso permite
            // comparar com o progresso atual (barra +/- do Watching Now) e
            // decidir se aquela linha já foi "alcançada" pelo progresso —
            // usado logo abaixo pra tirar o "unwatched" dinamicamente conforme
            // o usuário avança na barra.
            function computeWatchingEntryBoundaries(watchItem) {
              if (!watchItem || !Array.isArray(watchItem.seasons) || !watchItem.seasons.length) return null;
              const movieIdxSet = new Set(Array.isArray(watchItem.movieSeasons) ? watchItem.movieSeasons : []);
              const boundaries = [];
              let acc = 0;
              watchItem.seasons.forEach((epCount, idx) => {
                if (movieIdxSet.has(idx)) {
                  acc += epCount;
                  boundaries.push(acc);
                  return;
                }
                const courSplit = Array.isArray(watchItem.cours) ? watchItem.cours[idx] : null;
                if (Array.isArray(courSplit) && courSplit.length > 1) {
                  courSplit.forEach(courEpCount => {
                    acc += courEpCount;
                    boundaries.push(acc);
                  });
                } else {
                  acc += epCount;
                  boundaries.push(acc);
                }
              });
              return boundaries;
            }

            // Guarda se a seta do "watch now" (Crunchyroll/MyAnimeList) está
            // aberta, pra manter esse estado quando o usuário navega pro
            // próximo/anterior pôster do lightbox (renderMalScores é chamado de
            // novo a cada troca de item e, sem isso, sempre voltaria fechada).
            let watchNowExtraOpen = false;

            function renderMalScores(animeId, isWatchingNow, animePlanetUrl, crunchyrollUrl, watchNowMalUrl, netflixUrl) {
              if (!lightboxMal) return;

              lightboxMal.classList.remove('all-unwatched');

              // Limpa a cópia embaixo da imagem a cada render; quem preenche
              // de novo (quando houver) é o final desta função — ver
              // "lightboxMediaWatchNow" mais abaixo.
