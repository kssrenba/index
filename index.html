      .poster-lightbox-media-watchnow .rank-mal-label--anime-planet .anime-planet-btn-logo {
        filter: brightness(1.08) saturate(1.6) contrast(1.1);
      }

      .rank-mal-label--mal .mal-btn-logo {
        display: block;
        width: auto;
        height: 17px;
        max-width: none;
        object-fit: contain;
        border-radius: 0;
        box-shadow: none;
        transform-origin: left center;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      a.rank-mal-label--anime-planet:hover .anime-planet-btn-logo,
      a.rank-mal-label--anime-planet:focus-visible .anime-planet-btn-logo,
      a.rank-mal-label--crunchyroll:hover .crunchyroll-btn-logo,
      a.rank-mal-label--crunchyroll:focus-visible .crunchyroll-btn-logo,
      a.rank-mal-label--netflix:hover .netflix-btn-logo,
      a.rank-mal-label--netflix:focus-visible .netflix-btn-logo,
      a.rank-mal-label--mal:hover .mal-btn-logo,
      a.rank-mal-label--mal:focus-visible .mal-btn-logo {
        filter: brightness(1.15);
      }

      .poster-lightbox-media-watchnow a.rank-mal-label--anime-planet:hover .anime-planet-btn-logo,
      .poster-lightbox-media-watchnow a.rank-mal-label--anime-planet:focus-visible .anime-planet-btn-logo {
        filter: brightness(1.5) saturate(2.2) contrast(1.3);
      }

      a.rank-mal-label--anime-planet svg,
      a.rank-mal-label--crunchyroll svg,
      a.rank-mal-label--netflix svg,
      a.rank-mal-label--mal svg {
        opacity: 0.7;
        transition: opacity 0.15s ease;
      }

      a.rank-mal-label--anime-planet:hover svg,
      a.rank-mal-label--anime-planet:focus-visible svg,
      a.rank-mal-label--crunchyroll:hover svg,
      a.rank-mal-label--crunchyroll:focus-visible svg,
      a.rank-mal-label--netflix:hover svg,
      a.rank-mal-label--netflix:focus-visible svg,
      a.rank-mal-label--mal:hover svg,
      a.rank-mal-label--mal:focus-visible svg {
        opacity: 1;
      }

      @media (min-width: 761px) {
        a.rank-mal-label--anime-planet svg,
        a.rank-mal-label--crunchyroll svg,
        a.rank-mal-label--netflix svg,
        a.rank-mal-label--mal svg {
          display: none;
        }
      }

      a.rank-mal-label--crunchyroll {
        display: inline-flex;
      }

      a.rank-mal-label--crunchyroll:hover,
      a.rank-mal-label--crunchyroll:focus-visible {
        color: #ff640a;
      }

      a.rank-mal-label--netflix {
        display: inline-flex;
      }

      a.rank-mal-label--netflix:hover,
      a.rank-mal-label--netflix:focus-visible {
        color: #e50914;
      }

      a.rank-mal-label--mal {
        display: inline-flex;
      }

      a.rank-mal-label--mal:hover,
      a.rank-mal-label--mal:focus-visible {
        color: #2e51a2;
      }

      /* Botão do MyAnimeList dentro do lightbox do "All Animes": no PC é um
        link de verdade para a lista pessoal do MyAnimeList (clicável, com
        hover); no mobile continua sendo apenas o logo, sem ação — por isso
        o pointer-events é desativado por padrão (mobile-first) e só
        reativado a partir de 761px (ver regra @media logo abaixo). */
      .rank-mal > a.rank-mal-label--mal {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 5px;
        cursor: default;
        pointer-events: none;
      }

      @media (min-width: 761px) {
        .rank-mal > a.rank-mal-label--mal {
          cursor: pointer;
          pointer-events: auto;
        }

        .rank-mal > a.rank-mal-label--mal:hover,
        .rank-mal > a.rank-mal-label--mal:focus-visible {
          color: var(--mal-blue);
        }
      }

      .rank-mal-rows {
        display: flex;
        flex-direction: column;
        row-gap: 5px;
      }

      .rank-mal-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        column-gap: 10px;
      }

      .rank-mal-rows:has(> .rank-mal-row:only-child) .rank-mal-row {
        column-gap: 8px;
      }

      .rank-mal-content {
        flex: 0 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Envelope em volta do pontilhado + nota. Por padrão "invisível"
        (display: contents), então em quase todo lugar (grid do PC, linhas
        alinháveis, etc.) o comportamento continua idêntico a antes, como se
        o wrapper nem existisse — dots e nota seguem como itens
        independentes. Ele só vira uma caixa flex de verdade dentro do
        lightbox mobile (ver regra específica mais abaixo), justamente para
        resolver o bug de quebra de linha das linhas irregulares (filmes,
        especiais, títulos com ":"). */
      .rank-mal-score {
        display: contents;
      }

      /* No PC (telas maiores que o breakpoint mobile), a linha volta a ficar
        espalhada: nome da temporada na esquerda, nota na direita. No celular
        (regra acima) continua tudo centralizado. */
      @media (min-width: 761px) {
        .rank-mal-row {
          justify-content: space-between;
        }

        .rank-mal-content {
          flex: 0 1 auto;
        }

        /* Quebra manual (\n nos dados) usada só pra apertar a caixa do título
          no mobile (ver .rank-mal-linebreak lá embaixo) — no PC ela some,
          então o texto volta a ficar numa linha só. */
        .rank-mal-linebreak {
          display: none;
        }
      }

      /* ── Alinhamento de episódios entre temporadas consecutivas ──
        Quando duas ou mais linhas "numéricas" (ex: "1ª temporada: 25
        episódios") aparecem seguidas, elas são agrupadas em
        .rank-mal-align-group para que o texto de episódios comece sempre
        na mesma posição horizontal. Linhas "grandes"/irregulares (filmes,
        especiais com duração tipo "1h24m") ficam de fora do grupo e não
        influenciam esse alinhamento.
        No mobile o grupo também vira grid (2 colunas: conteúdo + nota),
        mas compacto (inline-grid, largura de conteúdo) e centralizado no
        card, em vez de esticado de ponta a ponta como no PC. */
      .rank-mal-align-group {
        display: contents;
      }

      @media (min-width: 761px) {
        .rank-mal-align-group {
          display: grid;
          grid-template-columns: max-content max-content 1fr max-content;
          column-gap: 4px;
          row-gap: 5px;
        }

        .rank-mal-align-group .rank-mal-row,
        .rank-mal-align-group .rank-mal-content {
          display: contents;
        }

        /* Linhas "irregulares" (filmes, especiais, spacers) dentro do grupo
          de alinhamento: em vez de virar itens soltos do grid (o que
          quebraria o layout, já que elas não têm 3 partes como as linhas
          numéricas), ocupam a largura inteira da linha do grid e mantêm
          seu próprio layout flex interno, igual a uma linha fora do grupo. */
        .rank-mal-align-group .rank-mal-row.rank-mal-row-break {
          display: flex;
          grid-column: 1 / -1;
        }

        .rank-mal-align-group .rank-mal-row.rank-mal-row-break .rank-mal-content {
          display: inline-flex;
        }
      }

      @media (max-width: 760px) {
        .rank-mal-align-group {
          display: inline-grid;
          grid-template-columns: max-content max-content;
          column-gap: 10px;
          row-gap: 5px;
          align-self: center;
        }

        .rank-mal-align-group .rank-mal-row {
          display: contents;
        }

        /* Linhas irregulares (filmes, especiais, spacers) ocupam as duas
          colunas e mantêm o próprio layout flex centralizado, igual a uma
          linha fora do grupo. */
        .rank-mal-align-group .rank-mal-row.rank-mal-row-break {
          display: flex;
          grid-column: 1 / -1;
          justify-content: center;
        }

        a.rank-mal-label:not(.rank-mal-label--anime-planet):not(.rank-mal-label--crunchyroll):not(.rank-mal-label--netflix):not(.rank-mal-label--mal) {
          display: none;
        }
      }

      .rank-mal-season {
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 14px;
        color: var(--text);
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0,0,0,0.85);
      }

      /* Algarismo romano (I, II, III...) ao final do nome da temporada,
        estilizado com fonte serifada e linhas acima/abaixo, tipo numeração
        clássica romana. */
      .rank-mal-roman {
        font-family: "Times New Roman", Times, serif;
      }

      .rank-mal-eps {
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 400;
        color: var(--muted);
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0,0,0,0.85);
      }

      /* ── Pontilhado entre o texto (temporada/episódios) e a nota ──
        Estilo "sumário de livro": os pontinhos preenchem o espaço
        sobrando, empurrando a nota pra ponta direita. Só aparece no PC;
        no celular o layout já é centralizado e compacto, então some. */
      .rank-mal-dots {
        flex: 1 1 auto;
        align-self: center;
        min-width: 14px;
        height: 4px;
        margin: 0 2px;
        background-image: radial-gradient(circle, rgba(255,255,255,0.3) 1.1px, transparent 1.3px);
        background-repeat: repeat-x;
        background-position: bottom left;
        background-size: 7px 4px;
      }

      @media (max-width: 760px) {
        .rank-mal-dots {
          display: none;
        }
      }

      .rank-mal-spacer {
        height: 2px;
        width: 100%;
      }

      .rank-mal-note {
        flex: 0 0 auto;
        align-self: center;
        box-sizing: border-box;
        width: 50px;
        height: 26px;
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 14px;
        color: var(--mal-blue);
        white-space: nowrap;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 2px;
        padding: 0;
        border-radius: 7px;
        background: linear-gradient(135deg, rgba(127,178,255,0.22), rgba(127,178,255,0.07));
        border: 1px solid rgba(127,178,255,0.32);
        box-shadow: 0 1px 4px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
        text-shadow: 0 1px 2px rgba(0,0,0,0.55);
        transition: filter 0.18s ease, transform 0.18s ease;
        cursor: default;
      }

      .rank-mal-note:not(.empty):not(.unwatched):hover {
        filter: brightness(1.18);
        transform: translateY(-1px);
      }

      .rank-mal-note .rank-mal-note-max {
        font-weight: 600;
        opacity: 0.7;
        text-shadow: none;
      }

      /* ── Paleta por faixa de nota (0-5 mesma cor, depois uma cor própria
        pra cada nota de 6 a 10), do mais discreto ao mais vibrante. ── */
      .rank-mal-note.tier-05 {
        color: var(--mal-low);
        background: rgba(169,164,189,0.12);
        border-color: rgba(169,164,189,0.22);
      }

      .rank-mal-note.tier-6 {
        color: var(--mal-tier6);
        background: linear-gradient(135deg, rgba(94,196,201,0.22), rgba(94,196,201,0.06));
        border-color: rgba(94,196,201,0.35);
      }

      .rank-mal-note.tier-7 {
        color: var(--mal-tier7);
        background: linear-gradient(135deg, rgba(129,209,133,0.22), rgba(129,209,133,0.06));
        border-color: rgba(129,209,133,0.35);
      }

      .rank-mal-note.tier-8 {
        color: var(--mal-blue);
        background: linear-gradient(135deg, rgba(127,178,255,0.22), rgba(127,178,255,0.07));
        border-color: rgba(127,178,255,0.32);
      }

      .rank-mal-note.tier-9 {
        color: var(--mal-tier9);
        background: linear-gradient(135deg, rgba(199,146,234,0.24), rgba(199,146,234,0.07));
        border-color: rgba(199,146,234,0.4);
      }

      /* Nota 10: destaque dourado máximo, pra saltar aos olhos como favorita. */
      .rank-mal-note.tier-10 {
        color: var(--mal-gold);
        background: linear-gradient(135deg, rgba(244,196,99,0.28), rgba(244,196,99,0.08));
        border-color: rgba(244,196,99,0.45);
      }

      .rank-mal-note.empty {

        font-weight: 400;

        border-color: transparent;
        box-shadow: none;

      /* ── Temporada não assistida (entry.unwatched = true) ──
        Risca o nome/episódios da temporada e troca a nota por "-/-",
        indicando visualmente que aquela parte ainda não foi vista. */
      .rank-mal-row.unwatched .rank-mal-dots {
        background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1.1px, transparent 1.3px);
      }

      .rank-mal-row.unwatched .rank-mal-season,
      .rank-mal-row.unwatched .rank-mal-eps {
        color: rgba(255,255,255,0.25);
        text-decoration: line-through;
        text-decoration-color: rgba(255,255,255,0.25);
        text-decoration-thickness: 1px;
        text-decoration-skip-ink: none;
      }

      .rank-mal-note.unwatched {
        color: rgba(255,255,255,0.25);
        font-style: italic;
        font-weight: 400;
        background: none;
        border-color: transparent;
        box-shadow: none;

      /* ── Blocos de rank (Story / Animation / Characters / Ending...) ── */
      .rank-ratings {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: 100%;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }

      .rank-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .rank-row-label {
        font-family: var(--font-title);
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.03em;
        color: var(--muted);
        flex: 0 0 auto;
        min-width: 140px;
        cursor: pointer;
        user-select: none;
        transition: color 0.15s ease, opacity 0.15s ease;
      }

      .rank-row-label:hover {
        color: var(--text);
      }

      .rank-row-label.excluded {
        text-decoration: line-through;
        text-decoration-thickness: 1.5px;
        opacity: 0.45;
      }

      .rank-row-label.excluded:hover {
        opacity: 0.65;
      }

      .rank-row.excluded .rank-stars {
        opacity: 0.45;
        position: relative;
      }

      .rank-row.excluded .rank-stars::after {
        content: '';
        position: absolute;
        left: 10px;
        right: -2px;
        top: 50%;
        height: 1.5px;
        background: var(--muted);
        transform: translateY(-50%);
        pointer-events: none;
        z-index: 2;
      }

      .rank-row.excluded .rank-score {
        opacity: 0.45;
        text-decoration: line-through;
        text-decoration-thickness: 1.5px;
        text-decoration-color: var(--muted);
      }

      .rank-stars {
        display: flex;
        align-items: center;
        gap: 4px;
        position: relative;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      .rank-stars .star-zero-hit {
        position: relative;
        width: 8px;
        height: 26px;
        flex: 0 0 auto;
        cursor: pointer;
      }

      .rank-stars .star-slot {
        position: relative;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
      }

      .rank-stars .star-slot svg {
        position: absolute;
        inset: 0;
        width: 26px;
        height: 26px;
        stroke: rgba(255,255,255,0.28);
        stroke-width: 1.6;
        fill: none;
        pointer-events: none;
        transition: stroke 0.15s ease, fill 0.15s ease;
      }

      .rank-stars .star-slot .star-fill {
        fill: var(--star-color, var(--glow-accent));
        stroke: var(--star-color, var(--glow-accent));
        overflow: hidden;
        display: none;
        transition: fill 0.15s ease, stroke 0.15s ease;
      }

      .rank-stars .star-slot .star-fill.half {
        clip-path: inset(0 50% 0 0);
      }

      .rank-stars .star-half-hit,
      .rank-stars .star-full-hit {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        cursor: pointer;
      }
      .rank-stars .star-half-hit { left: 0; }
      .rank-stars .star-full-hit { left: 50%; }

      .rank-score {
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 14px;
        color: var(--star-color, var(--text));
        min-width: 32px;
        text-align: right;
        flex: 0 0 auto;
        transition: color 0.15s ease;
      }

      .rank-average {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding-top: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        width: 100%;
      }

      .rank-average-label {
        font-family: var(--font-title);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .rank-average-value {
        font-family: var(--font-title);
        font-weight: 900;
        font-size: 28px;
        color: var(--star-color-avg, var(--glow-accent));
        transition: color 0.15s ease;
      }

      .rank-average-value .rank-average-max {
        font-size: 15px;
        font-weight: 700;
        opacity: 0.55;

      }

      @media (max-width: 900px) {

          height: min(82vh, 560px);
        }

          width: min(420px, 46vw);
        }
      }

      @media (max-width: 760px) {
        .poster-lightbox {
          align-items: flex-start;
        }

        .poster-lightbox-figure {
          flex-direction: column;
          align-items: center;
          max-height: 90vh;
          max-height: 90dvh;
          overflow-y: auto;
          overflow-x: hidden;
          width: 100%;
          margin-top: 76px;
        }

        .poster-lightbox img {
          width: min(80vw, 340px);
          height: min(46vh, 460px);
        }

        .poster-lightbox-panel {
          width: min(92vw, 460px);
          max-height: none;
          align-items: center;
          text-align: center;
        }

        .poster-lightbox-panel .poster-lightbox-list,
        .poster-lightbox-panel .poster-lightbox-title {
          text-align: center;
          justify-content: center;
        }

        .rank-meta {
          justify-content: center;
          text-align: center;
          padding: 16px 14px;
        }
        .rank-meta-item { align-items: center; padding: 0 16px; }

        .rank-row-label { min-width: 104px; }
      }

      /* ── Layout mobile do poster lightbox: pôster pequeno + título lado a
        lado no topo, com tags/ficha técnica/temporadas abaixo, ocupando a
        largura toda. Só se aplica no modo "completo" (com myranks); o modo
        "simples" mantém seu próprio layout em coluna (regra acima, com
        !important, continua tendo prioridade). ── */
      @media (max-width: 760px) {
        .poster-lightbox:not(.simple-mode) .poster-lightbox-figure {
          display: grid;
          grid-template-columns: 150px 1fr;
          grid-template-areas:
            "media title"
            "media info"
            "meta   meta"
            "moreinfo moreinfo"
            "list   list"
            "mal    mal";
          column-gap: 16px;
          row-gap: 18px;
          align-items: start;
          width: 100%;
          max-width: min(94vw, 460px);
          /* .poster-lightbox-figure é o próprio elemento com scroll no mobile
            (overflow-y: auto lá em cima). Sem esse respiro à direita, a
            barra de rolagem nasce colada nas notas (badges) do MyAnimeList
            e fica por cima delas. O padding empurra o conteúdo pra dentro
            e, como '*' usa box-sizing:border-box, não estoura o max-width. */
          padding-right: 10px;
          scrollbar-gutter: stable;
        }

        /* Barra de rolagem mais discreta só dentro do lightbox mobile, pra
          não precisar de um respiro tão grande quanto os 10px genéricos
          (::-webkit-scrollbar do site inteiro). */
        .poster-lightbox:not(.simple-mode) .poster-lightbox-figure::-webkit-scrollbar {
          width: 5px;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-panel {
          display: contents;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-media {
          grid-area: media;
          align-self: start;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-figure .poster-lightbox-media img {
          width: 100%;
          height: auto;
          aspect-ratio: 2 / 3;
          /* A sombra padrão (30px/80px) foi pensada pro layout desktop, com
            bastante espaço solto ao redor do pôster. Aqui no grid mobile os
            blocos ficam colados (row-gap de 12px), então aquela sombra
            grande "vazava" pra cima da linha de badges/tags logo abaixo,
            formando uma faixa escura que não seguia o resto do ambient. */
          box-shadow: 0 10px 22px rgba(0,0,0,0.45);
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-media-category {
          margin-top: 8px;
          font-size: 10px;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-title {
          grid-area: title;
          align-self: end;
          margin: 0;
          font-size: 19px;
          line-height: 1.2;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-info {
          grid-area: info;
          align-self: start;
          margin-top: 4px;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-info-break {
          display: block;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-info-break::before {
          content: "";
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-panel .poster-lightbox-title,
        .poster-lightbox:not(.simple-mode) .poster-lightbox-panel .poster-lightbox-info {
          text-align: left;
          justify-content: flex-start;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-panel .poster-lightbox-list {
          grid-area: list;
          text-align: center;
          justify-content: center;
          max-width: 100%;
        }

        .poster-lightbox:not(.simple-mode) .rank-meta {
          grid-area: meta;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-more-info {
          grid-area: moreinfo;
          display: flex;
          justify-content: center;
        }

        .poster-lightbox:not(.simple-mode) .poster-lightbox-more-info:empty {
          display: none;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal {
          grid-area: mal;
          display: flex;
          flex-direction: column;
          /* Espaço entre o bloco de temporadas/notas e a linha do
            Anime-Planet/Crunchyroll/MyAnimeList logo abaixo — antes ficava
            colado (8px), deixando tudo mais apertado/poluído. */
          gap: 16px;
          /* Sem isso, a última linha (temporada/filme/especial) fica colada
            no final da área de scroll do lightbox. */
          padding-bottom: 28px;
          /* O espaço entre as tags (#All Animes etc) e o bloco do
            MyAnimeList logo abaixo já vem do row-gap do grid (18px);
            aqui só compensa parte disso pra não somar demais e ficar
            longe demais das tags. */
          margin-top: -6px;
        }

        /* Nos cards do "All Animes" (não Watching Now), o primeiro filho de
          ".rank-mal" é o link/logo do MyAnimeList, não a linha do
          Anime-Planet — esse caso não deve herdar o gap de 16px acima
          (pensado pra separar temporadas da linha de botões), senão o logo
          fica longe demais das temporadas logo abaixo dele. Cancela parte do
          gap com margem negativa, voltando pros ~8px de antes só aqui. */
        .poster-lightbox:not(.simple-mode) .rank-mal > a.rank-mal-label--mal {
          margin-bottom: -8px;
        }

        /* Notas por temporada/filme/especial: no mobile, mesmo layout de
          colunas do PC — temporada / episódios / pontilhado / nota — para
          que "episódios" comece sempre na mesma posição horizontal entre
          temporadas, com o pontilhado preenchendo o espaço até a nota.
          Linhas irregulares (filmes, especiais, spacers) saem do grid e
          ocupam a linha inteira, com o próprio pontilhado esticando até a
          nota, igual acontece no PC. */
        .poster-lightbox:not(.simple-mode) .rank-mal-rows {
          display: flex;
          flex-direction: column;
          row-gap: 16px;
          width: 100%;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-align-group {
          display: grid;
          grid-template-columns: max-content max-content 1fr max-content;
          column-gap: 4px;
          row-gap: 6px;
          width: 100%;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-align-group .rank-mal-row,
        .poster-lightbox:not(.simple-mode) .rank-mal-align-group .rank-mal-content {
          display: contents;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break {
          display: flex;
          align-items: center;
          grid-column: 1 / -1;
        }

        /* Título das linhas irregulares (filmes, especiais, títulos com ":")
          com um teto de largura (max-width). Sem isso, quando o texto é
          comprido, o navegador calcula o espaço "faltando" (título +
          pontilhado + nota não cabem juntos numa linha) usando como base o
          tamanho do título SEM quebra (o texto inteiro em uma linha só, bem
          largo) — e, como o pontilhado começa de uma caixa vazia (0px de
          largura própria), quase todo aquele espaço que falta é descontado
          só do título, nunca do pontilhado. Resultado: o título encolhe até
          caber (quebrando em 2 linhas), mas o pontilhado nunca ganha o
          espaço que sobrou de verdade, ficando preso no mínimo (14px), bem
          coladinho na nota. Limitando a largura máxima do título a 60% da
          linha, o cálculo já começa com um título "menor" desde o início,
          então sobra espaço de verdade pro pontilhado esticar depois. Em
          títulos curtos (que já cabem em menos de 60%), esse limite não faz
          diferença nenhuma — o layout continua idêntico ao de antes, tudo
          numa linha só. */
        .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break .rank-mal-content {
          max-width: 60%;
          /* "block" (em vez de "inline-flex") faz o texto da temporada e dos
            episódios fluir junto, como um parágrafo só. Assim, quando o
            nome é grande e precisa quebrar linha, a quebra acontece num
            ponto natural do texto (ex: "...The Final Chapters" / ": 2
            episódios"), igual acontece com nomes longos tipo o do Monsters
            do One Piece — em vez de temporada e episódios virarem duas
            caixas flex separadas que quebram cada uma por conta própria. */
          display: block;
        }

        /* Quando o label já tem uma quebra manual (\n → <br
          class="rank-mal-linebreak">), a largura da caixa não precisa mais
          do teto fixo de 60% — isso deixava uma "sobra" de espaço vazio
          entre o fim do texto (ex: "...The Final") e o pontilhado, porque
          60% quase sempre é mais largo que a linha de verdade. Com quebra
          manual, o texto já tem um ponto de corte definido, então a caixa
          pode encolher só até a largura real das duas linhas (max-content),
          deixando o pontilhado começar coladinho no texto. */
        .poster-lightbox:not(.simple-mode) .rank-mal-row.rank-mal-row-break .rank-mal-content:has(.rank-mal-linebreak) {
          max-width: max-content;
          width: max-content;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-content {
          min-width: 0;
          white-space: normal;
          overflow: visible;
          text-overflow: clip;
          text-align: left;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-season,
        .poster-lightbox:not(.simple-mode) .rank-mal-eps {
          align-self: center;
          white-space: normal;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-dots {
          display: block;
          align-self: center;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-note {
          justify-self: end;
          align-self: center;
        }

        .poster-lightbox:not(.simple-mode) .rank-mal-spacer {
          grid-column: 1 / -1;
        }

        /* Botão "MyAnimeList" (normalmente escondido no mobile pela regra
          geral acima) volta a aparecer aqui dentro do lightbox — mas sem
          navegar pra lugar nenhum (ver JS: preventDefault nesse breakpoint). */
        .poster-lightbox:not(.simple-mode) a.rank-mal-label:not(.rank-mal-label--anime-planet):not(.rank-mal-label--crunchyroll):not(.rank-mal-label--netflix):not(.rank-mal-label--mal) {
          display: inline-flex;
          cursor: default;
        }

        .poster-lightbox:not(.simple-mode) a.rank-mal-label:not(.rank-mal-label--anime-planet):not(.rank-mal-label--crunchyroll):not(.rank-mal-label--netflix):not(.rank-mal-label--mal) svg {
          display: none;
        }
      }


      .poster-lightbox-announce {

        align-items: center;

        z-index: 2;

        background: rgba(10,10,10,0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%);
      }

      .poster-lightbox-announce:empty { display: none; }

      .poster-lightbox-announce .announce-line {
        font-family: "Inter", sans-serif;
        font-size: 13px;

        letter-spacing: 0.1px;
        color: rgba(255,255,255,0.92);

        .poster-lightbox-announce .announce-line { font-size: 11px; line-height: 26px; height: 26px; padding: 0 14px; }
      }

      .poster-lightbox-title {
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.01em;
        color: var(--text);
        text-align: center;
        max-width: min(92vw, 700px);
      }

      .poster-lightbox-title:empty { display: none; }

      .poster-lightbox-info {
        margin-top: -14px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        text-align: center;
        max-width: min(92vw, 700px);
        line-height: 1.4;
      }

      .poster-lightbox-info:empty { display: none; }

      /* Separador entre linhas de "poster-lightbox-info" (ex: temporadas/episódios
        e Filme(s)): no PC fica inline, mantendo tudo na mesma linha; só no
        lightbox mobile (regra específica mais abaixo) ele vira quebra de linha. */
      .poster-lightbox-info-break {

      }

      .poster-lightbox-info-break::before {
        content: " - ";
      }

      .poster-lightbox-rank {

        margin-right: 8px;
        font-family: var(--font-title);
        font-weight: 900;
        font-size: 14px;
        color: rgba(255,255,255,0.5);
        letter-spacing: -0.01em;

      }

      .poster-lightbox-list {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        max-width: min(92vw, 700px);
      }

      .poster-lightbox-list:empty { display: none; }

      .poster-lightbox-list .list-category {
        font-family: var(--font-title);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .poster-lightbox-list .list-division {
        display: inline-flex;
        align-items: center;
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--list-color, var(--glow-accent));
        transition: color 0.15s ease;
        padding: 2px 0 5px;
        border-bottom: 1px solid transparent;
      }

      /* Sem divisão: o nome da categoria assume o destaque sozinho */
      .poster-lightbox-list.no-division .list-category {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--list-color, var(--glow-accent));
      }

      /* Tags de todas as divisões/categorias às quais o anime pertence
        (ex: "All Animes" + "Mecha/Cyberpunk"). Clicáveis: levam até o
        card do anime naquela lista. */
      .poster-lightbox-list .list-tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.06em;

        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease, filter 0.2s ease;
      }

      .poster-lightbox-list .list-tag:hover,
      .poster-lightbox-list .list-tag:focus-visible {
        border-bottom-color: currentColor;
        filter: brightness(1.25);
      }

      .poster-lightbox-list .list-tag:active {
        filter: brightness(0.95);
      }

      .poster-lightbox-list .list-tag-rank {
        font-weight: 900;
        color: rgba(255,255,255,0.45);
        letter-spacing: -0.01em;
      }

      /* Tag combinada "Watching Now: <divisão>" (usada quando um anime de
        "Announced Sequels" também está em Watching Now) — cada metade tem
        sua própria cor, mas o botão inteiro é um único link clicável. */
      .poster-lightbox-list .list-tag-split .list-tag-part + .list-tag-part {
        margin-left: -2px;
      }

      /* No hover/focus, em vez da linha sólida (currentColor) normal, o
        sublinhado vira uma listra alternando as duas cores da tag (ex:
        laranja do "Watching Now" / azul da divisão), reforçando que o
        botão combina as duas informações. */
      .poster-lightbox-list .list-tag-split {
        position: relative;
        border-bottom-color: transparent;
      }

      .poster-lightbox-list .list-tag-split::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background-image: linear-gradient(
          90deg,
          var(--tag-color-2, var(--glow-accent)) 0%,
          var(--tag-color, var(--glow-accent)) 100%
        );
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .poster-lightbox-list .list-tag-split:hover::after,
      .poster-lightbox-list .list-tag-split:focus-visible::after {
        opacity: 1;
      }

      .poster-lightbox-list .list-sep {
        color: rgba(255,255,255,0.25);
        font-size: 10px;
      }

      /* ── Botão flutuante: ir para o topo / ir para o final ── */
      .scroll-fab {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(20,20,20,0.7);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        z-index: 500;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 8px 24px -6px rgba(0,0,0,0.5);
      }

      .scroll-fab.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .scroll-fab:hover {
        background: rgba(255,255,255,0.06);
        color: #fff;
        box-shadow: 0 10px 28px -6px rgba(0,0,0,0.6);
      }

      .scroll-fab svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2.4;
        fill: none;
        transition: transform 0.25s ease;
      }

      .scroll-fab.scrolled svg {
        transform: rotate(180deg);
      }

      @media (max-width: 600px) {
        .scroll-fab { right: 16px; bottom: 16px; width: 42px; height: 42px; }

      /* ── Faixa de anúncio (nova temp./filme) sobre a imagem ── */
      .announce-strip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 16px; 
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;

        z-index: 3;

        background: rgba(10,10,10,0.38);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);

      .announce-strip .announce-track {
        display: flex;
        align-items: center;
        width: max-content;
        will-change: transform;

      @keyframes announce-marquee {

        linha poster+texto usada nos outros modos). */
      ol.ranking.mode-true-characters {
        --true-character-size: 152px;
        --true-character-pad: 18px;
        column-gap: 16px;
        row-gap: 16px;
      }

      ol.ranking.mode-true-characters li.anime-item {
        display: flex;
        align-items: center;
        gap: 20px;
        grid-template-columns: none;
        min-height: 0;
        padding: var(--true-character-pad) 22px var(--true-character-pad) var(--true-character-pad);
        background: linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 22px;
      }

      ol.ranking.mode-true-characters li.anime-item:hover {
        transform: translateY(-4px) translateZ(0);
        border-color: rgba(244,114,182,0.35);
        box-shadow: 0 16px 34px -12px rgba(244,114,182,0.28), 0 12px 30px -10px rgba(0,0,0,0.6);
      }

      /* Garante que a especificidade maior deste bloco não quebre a
        ocultação de itens filtrados/pesquisados. */
      ol.ranking.mode-true-characters li.anime-item.hidden-item {
        display: none;
      }

      /* ── Avatar circular ── */
      ol.ranking.mode-true-characters .poster-wrap {
        width: var(--true-character-size);
        height: var(--true-character-size);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 6px 16px -4px rgba(0,0,0,0.55);
        transition: box-shadow 0.3s ease;
      }

      ol.ranking.mode-true-characters .thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        aspect-ratio: 1 / 1;
      }

      }

          0 12px 32px -8px rgba(0,0,0,0.7), 
          0 0 0 1px var(--item-hover-color, #2dd4bf),
          0 0 12px -3px var(--item-hover-color, #2dd4bf);
        z-index: 2; /* Garante que a sombra fique sobre os outros cards */
      }

      /* ── Barra de progresso visual (Watching Now) ── */
      .watch-progress {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .watch-progress-track {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        position: relative;
      }

      .watch-progress-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg,
          color-mix(in srgb, var(--item-hover-color, #2dd4bf) 70%, white 10%),
          var(--item-hover-color, #2dd4bf));
        box-shadow: 0 0 8px -1px var(--item-hover-color, #2dd4bf);
        transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        width: 0%;
      }

      /* Estado indeterminado: quando o total de episódios ainda não é conhecido
        (ex: obra em lançamento), não dá pra mostrar um % real, então a barra
        fica vazia (sem preenchimento animado). */
      .watch-progress-fill--indeterminate {
        width: 0% !important;
      }

      /* Marcador de divisão de temporada dentro da barra de progresso.
        Usado quando o anime tem várias temporadas e a barra mostra o
        progresso total (soma de todas), com uma linha em cada ponto
        onde uma temporada termina e a próxima começa. */
      .watch-progress-season-mark {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(3,3,3,0.75);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.28);
        z-index: 2;
        pointer-events: none;
      }

      /* Zona invisível sobre cada trecho da barra correspondente a uma
        temporada. Não altera o visual por padrão, mas no hover realça
        levemente o trecho e mostra (via title, tooltip nativo) quantos
        episódios aquela temporada tem. */
      .watch-progress-season-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        cursor: default;
        transition: background 0.15s ease;
      }

      .watch-progress-season-zone:hover {
        background: rgba(255,255,255,0.18);
      }

      /* Marcador de divisão de "cour" (metades em que uma mesma temporada
        foi exibida, ex: 2ª temporada de Re:Zero em dois blocos). É mais
        discreto que o marcador de temporada — fino e mais curto — pra
        deixar claro que é uma subdivisão, não uma temporada nova. */
      .watch-progress-cour-mark {
        position: absolute;
        top: 25%;
        bottom: 25%;
        width: 1.5px;
        background: rgba(3,3,3,0.55);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
        border-radius: 1px;
        z-index: 2;
        pointer-events: none;
      }

      .watch-progress-label {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      /* Estado "concluído": em vez do "12/12", mostra "COMPLETED" com a cor
        de destaque do próprio card, pra ficar bem visível de cara. */
      .watch-progress-label--completed {
        color: var(--item-hover-color, #2dd4bf);
        font-weight: 800;
        letter-spacing: 0.06em;
        font-size: 10px;
      }

      /* Total geral (soma de todas as temporadas), mostrado bem menor e mais
        apagado ao lado do progresso da temporada atual, entre parênteses. */
      .watch-progress-label-total {
        font-size: 9px;
        font-weight: 500;
        color: var(--low-priority);
        margin-left: 4px;
        letter-spacing: 0.01em;
      }

      .watch-progress-label-total::before { content: "("; }
      .watch-progress-label-total::after { content: ")"; }

      @media (max-width: 600px) {
        .watch-progress-label-total { font-size: 8px; margin-left: 3px; }
      }

      /* Variante compacta usada no card de busca: mesma barra, mas sem os
        botões de +/- (o progresso lá é só leitura). */
      .search-result-progress.watch-progress {
        margin-top: 4px;
        gap: 6px;
      }

      .search-result-progress .watch-progress-track { height: 4px; }

      .search-result-progress .watch-progress-label {
        font-size: 10px;
      }

      .watch-progress-inc,
      .watch-progress-dec {
        flex: 0 0 auto;
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(255,255,255,0.06);
        color: var(--text);
        font-size: 13px;
        line-height: 1;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }

      .watch-progress-inc:hover:not(:disabled),
      .watch-progress-dec:hover:not(:disabled) {
        background: var(--item-hover-color, #2dd4bf);
        border-color: var(--item-hover-color, #2dd4bf);
        color: #030303;
        transform: scale(1.08);
      }

      .watch-progress-inc:active:not(:disabled),
      .watch-progress-dec:active:not(:disabled) {
        transform: scale(0.94);
      }

      .watch-progress-inc:disabled,
      .watch-progress-dec:disabled {
        opacity: 0.3;
        cursor: default;
      }

      @media (max-width: 600px) {
        .watch-progress { margin-top: 6px; gap: 8px; }
        .watch-progress-track { height: 5px; }
        .watch-progress-label { font-size: 10px; }
        .watch-progress-inc, .watch-progress-dec { width: 18px; height: 18px; font-size: 12px; }
      }

      /* ── SEASON HEADERS PERSONALIZADOS ── */
      li.season-header {
        grid-column: 1 / -1;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 40px 4px 16px;
        font-family: var(--font-title);
        font-weight: 900;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--season-color);

        /* Aqui está a mágica: Reinicia o contador para cada cabeçalho de temporada! */
        counter-reset: item;
      }
      li.season-header:first-child { padding-top: 12px; }

      /* Aspas de canto estilo mangá (「 texto 」) em volta do nome da
        temporada, numa serifada clássica — remete à numeração romana usada
        nas temporadas dos cards, dando uma identidade mais "editorial". */
      li.season-header .season-text {
        position: relative;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* Quando o cabeçalho da temporada aponta pro MAL, mantém a cor e a
        tipografia herdadas do .season-header (nada de azul/sublinhado
        padrão de link), só com um hover sutil indicando que é clicável. */
      a.season-text.season-text-link {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      a.season-text.season-text-link:hover,
      a.season-text.season-text-link:focus-visible {
        opacity: 0.75;
      }

      /* Colchetes desenhados em CSS puro (sem depender de glifo de fonte) —
        mesmo problema do .search-section-header: a fonte de fallback usada
        pra renderizar 「」 reserva uma caixa full-width bem maior que o
        traço visível, deslocando o texto pra direita e descentralizando
        verticalmente. Com bordas, a posição fica exata e previsível. */
      li.season-header .season-text::before,
      li.season-header .season-text::after {
        content: "";
        display: block;
        width: 7px;
        height: 15px;
        border: 1.5px solid var(--season-color);
        opacity: 0.8;
      }

      li.season-header .season-text::before { border-right: none; }
      li.season-header .season-text::after { border-left: none; }

      /* Linha tracejada até o fim, sem sumir antes da borda. */
      li.season-header .season-line {
        flex: 1;
        height: 1px;
        background-image: repeating-linear-gradient(
          to right,
          var(--season-color) 0,
          var(--season-color) 5px,
          transparent 5px,
          transparent 11px
        );
        opacity: 0.6;
      }

      @media (max-width: 600px) {
        li.season-header { font-size: 11px; padding: 30px 10px 12px; gap: 10px; }
        li.season-header:first-child { padding-top: 8px; }
        li.season-header .season-text::before,
        li.season-header .season-text::after { width: 6px; height: 12px; }

        ol.ranking.mode-watching li.anime-item:hover {
          transform: translateY(-2px) translateZ(0); /* Leve efeito também no mobile para dar o feedback */
        }
      }

      @media (max-width: 1100px) {
        ol.ranking.mode-watching li.anime-item { grid-template-columns: 56px 138px 1fr; min-height: 192px; }
        ol.ranking.mode-watching .poster-wrap { width: 138px; height: 192px; }
      }

      @media (max-width: 900px) {
        ol.ranking.mode-watching li.anime-item { grid-template-columns: 44px 118px 1fr; min-height: 165px; }
        ol.ranking.mode-watching .poster-wrap { width: 118px; height: 165px; }
      }

      @media (max-width: 600px) {
        ol.ranking.mode-watching li.anime-item { grid-template-columns: 30px 96px 1fr; min-height: 134px; }
        ol.ranking.mode-watching .poster-wrap { width: 96px; height: 134px; }
      }

      @media (max-width: 380px) {
        ol.ranking.mode-watching li.anime-item { grid-template-columns: 26px 82px 1fr; min-height: 115px; }
        ol.ranking.mode-watching .poster-wrap { width: 82px; height: 115px; }
      }

      /* ── Top 3: borda superior especial (ouro, prata, bronze) ── */
      li.anime-item.rank-gold,
      li.anime-item.rank-silver,
      li.anime-item.rank-bronze,
      li.fav-ep-card.rank-gold,
      li.fav-ep-card.rank-silver,
      li.fav-ep-card.rank-bronze {
        position: relative;
      }

      li.anime-item.rank-gold::before,
      li.anime-item.rank-silver::before,
      li.anime-item.rank-bronze::before,
      li.fav-ep-card.rank-gold::before,
      li.fav-ep-card.rank-silver::before,
      li.fav-ep-card.rank-bronze::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        border-radius: 10px 10px 0 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.55;
      }

      /* Os cards de Favorite Episodes têm o border-radius maior (18px) —
        a faixa precisa acompanhar a curvatura do canto do próprio card. */
      li.fav-ep-card.rank-gold::before,
      li.fav-ep-card.rank-silver::before,
      li.fav-ep-card.rank-bronze::before {
        border-radius: 18px 18px 0 0;
      }

      li.anime-item.rank-gold::before,
      li.fav-ep-card.rank-gold::before {
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        box-shadow: 0 0 6px -1px rgba(212, 175, 55, 0.35);
      }

      li.anime-item.rank-silver::before,
      li.fav-ep-card.rank-silver::before {
        background: linear-gradient(90deg, transparent, #b8bcc2, transparent);
        box-shadow: 0 0 6px -1px rgba(184, 188, 194, 0.3);
      }

      li.anime-item.rank-bronze::before,
      li.fav-ep-card.rank-bronze::before {
        background: linear-gradient(90deg, transparent, #b0703f, transparent);
        box-shadow: 0 0 6px -1px rgba(176, 112, 63, 0.3);
      }

      /* ══════════════════════════════════════════════════════════════
        ⭐ FAVORITE EPISODES — card totalmente diferente do resto do site:
        imagem grande no topo, nota pessoal em baixo, em vez da linha
        horizontal poster+meta usada nos outros modos.
        ══════════════════════════════════════════════════════════════ */
      ol.ranking.mode-fav-episodes {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        counter-reset: item;
      }

      @media (max-width: 900px) {
        ol.ranking.mode-fav-episodes { grid-template-columns: 1fr; }
      }

      .fav-ep-empty {
        list-style: none;
        padding: 60px 24px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
        border: 1px dashed rgba(255,255,255,0.14);
        border-radius: 16px;
      }

      .fav-ep-empty code {
        background: rgba(255,255,255,0.06);
        padding: 2px 7px;
        border-radius: 6px;
        color: #3b82f6;
        font-size: 12.5px;
      }

      /* ── Card de episódio favorito (imagem à esquerda + conteúdo à direita) ── */
      li.fav-ep-card {
        counter-increment: item;
        list-style: none;
        display: grid;
        grid-template-columns: 56px 420px 1fr;
        align-items: stretch;
        min-height: 300px;
        border-radius: 18px;
        border: 1.5px solid transparent;
        overflow: hidden;
        background: rgba(255,255,255,0.02);
        position: relative;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* ── Ambient: a própria imagem do episódio, borrada, como wallpaper do
        card — mesma mecânica usada nos outros cards da lista (poster-wrap) ── */
      .fav-ep-ambient {
        position: absolute;
        inset: -30px;
        z-index: 0;
        background-size: cover;
        background-position: center;
        filter: blur(30px) saturate(1.5) brightness(0.55);
        opacity: 0;
        transform: scale(1.1);
        transition: opacity 0.4s ease, background-image 0.3s ease, transform 0.6s ease;
        pointer-events: none;
      }

      .fav-ep-ambient.ready { opacity: 0.9; }

      /* Mesma deriva contínua dos outros cards da lista */
      @keyframes favEpAmbientDrift {
        0%   { transform: scale(1.2) translate(4%, -3%); }
        25%  { transform: scale(1.38) translate(-4%, 3%); }
        50%  { transform: scale(1.25) translate(3%, 4%); }
        75%  { transform: scale(1.4) translate(-3%, -4%); }
        100% { transform: scale(1.2) translate(4%, -3%); }
      }

      li.fav-ep-card:hover .fav-ep-ambient.ready {
        animation: favEpAmbientDrift 4s ease-in-out infinite;
      }

      .fav-ep-ambient-shade {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(90deg, rgba(10,10,14,0.55) 0%, rgba(10,10,14,0.25) 45%, rgba(10,10,14,0.78) 100%);
        pointer-events: none;
      }

      .fav-ep-media,
      .fav-ep-content {
        position: relative;
        z-index: 2;
      }

      /* Mesmo overlay branco sutil usado nos outros cards do site ao passar o mouse */
      li.fav-ep-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.06);
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
        border-radius: inherit;
      }

      li.fav-ep-card:hover::after { opacity: 1; }

      li.fav-ep-card:hover {
        transform: translateY(-3px) translateZ(0);
        box-shadow: 0 12px 32px -8px rgba(0,0,0,0.6);
      }

      li.fav-ep-card:hover .fav-ep-media-main .thumb {
        transform: scale(1.05);
      }

      /* Hover colorido igual ao resto do site (usa --item-hover-color, azul por padrão nesta lista) */
      li.fav-ep-card[style*="--item-hover-color"]:hover {
        background: color-mix(in srgb, var(--item-hover-color) 8%, transparent);
        border-color: var(--item-hover-color);
        box-shadow:
          0 12px 32px -8px rgba(0,0,0,0.7),
          0 0 12px -3px var(--item-hover-color);
      }

      /* ── Coluna de mídia: imagem grande + carrossel de mini-thumbnails ── */
      .fav-ep-media {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        min-width: 0;
      }

      .fav-ep-media-main.poster-wrap {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        cursor: zoom-in;
        touch-action: pan-y;
      }

      .fav-ep-media-main .thumb,
      .fav-ep-media-main .poster-fallback {
        border-radius: 12px;
      }

      /* ── Contador "posição/total" (ex: 1/5) sobre o canto da imagem grande,
        indicando em qual imagem do carrossel o usuário está ── */
      .fav-ep-counter {
        position: absolute;
        right: 10px;
        top: 10px;
        z-index: 2;
        font-family: var(--font-title);
        font-weight: 800;
        font-size: 11.5px;
        letter-spacing: 0.02em;
        color: #fff;
        background: rgba(10,10,10,0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 3px 9px;
        border-radius: 999px;
        pointer-events: none;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
      }

      /* Navegação de mini-thumbnails (setas ‹ › + tira de imagens) */
      .fav-ep-thumbnav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .fav-ep-thumbnav-arrow {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.15s ease;
      }

      .fav-ep-thumbnav-arrow svg { width: 13px; height: 13px; }

      .fav-ep-thumbnav-arrow:hover {
        color: #fff;
      }

      .fav-ep-thumbstrip {
        flex: 1;
        display: flex;
        gap: 7px;
        overflow-x: auto;
        scroll-behavior: smooth;
        scrollbar-width: none;
        min-width: 0;
        /* A largura real é travada via JS (sizeFavEpThumbstrip) para caber
          só miniaturas inteiras, então nenhuma aparece cortada na borda. */
      }

      .fav-ep-thumbstrip::-webkit-scrollbar { display: none; }

      .fav-ep-thumb {
        flex: 0 0 auto;
        width: 92px;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        overflow: hidden;
        padding: 0;
        border: 1.5px solid rgba(255,255,255,0.08);
        background: var(--surface);
        cursor: pointer;
        opacity: 0.55;
        transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }

      .fav-ep-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .fav-ep-thumb:hover { opacity: 0.85; transform: translateY(-1px); }
      .fav-ep-thumb.is-active { opacity: 1; border-color: #3b82f6; }

      /* ── Coluna de conteúdo: título, nota estilo IMDb + link, descrição ── */
      .fav-ep-content {
        padding: 22px 28px 24px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        min-width: 0;
      }

      .fav-ep-heading {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .fav-ep-anime {
        margin: 0;
        font-family: var(--font-title);
        font-weight: 800;
        font-size: 23px;
        color: #fff;
        line-height: 1.25;
      }

      .fav-ep-episode {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      /* Linha com o selo de nota estilo IMDb + link pro anime */
      .fav-ep-rating-row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .fav-ep-rating {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        text-decoration: none;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      a.fav-ep-rating:hover { opacity: 0.8; }

      .fav-ep-rating-source {
        font-family: var(--font-title);
        font-weight: 900;
        font-size: 12px;
        letter-spacing: -0.02em;
        color: #000;
        background: #f5c518;
        padding: 2px 6px;
        border-radius: 4px;
        line-height: 1.3;
      }

      .fav-ep-rating-value {
        font-family: var(--font-title);
        font-weight: 800;
        font-size: 15px;
        color: #fff;
      }

      .fav-ep-rating-max {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-left: 1px;
      }

      /* Selo de nota pessoal, ao lado do selo do IMDb */
      .fav-ep-my-rating {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        transition: opacity 0.15s ease;
      }

      /* Mesmo efeito de hover do selo do IMDb (opacity), mas sem cursor:pointer,
        já que o MNP não é um link clicável. */
      .fav-ep-my-rating:hover {
        opacity: 0.8;
      }

      .fav-ep-my-rating-source {
        font-family: var(--font-title);
        font-weight: 900;
        font-size: 12px;
        letter-spacing: -0.02em;
        color: #0b0b0b;
        background: linear-gradient(135deg, #f8fafc, var(--glow-accent, #cbd5e1));
        padding: 2px 7px;
        border-radius: 4px;
        line-height: 1.3;
      }

      .fav-ep-my-rating-value {
        font-family: var(--font-title);
        font-weight: 900;
        font-size: 16.5px;
        color: var(--glow-accent, #cbd5e1);
        text-shadow: 0 0 16px rgba(203,213,225,0.28);
      }

      .fav-ep-my-rating-max {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        opacity: 0.75;
        margin-left: 1px;
      }

      .fav-ep-rating-sep {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
      }

      .fav-ep-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-title);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .fav-ep-link:hover { color: #fff; }
      .fav-ep-link svg { width: 12px; height: 12px; flex: 0 0 12px; }

        margin: 0;
        font-size: 14px;
        line-height: 1.65;
        color: #d1d5db;
        font-style: italic;
      }

      .fav-ep-quote-mark {
        font-family: var(--font-title);
        font-size: 26px;
        font-weight: 900;
        font-style: normal;
        color: rgba(59,130,246,0.55);
        line-height: 0;
        vertical-align: -5px;
        margin-right: 3px;
      }

      .fav-ep-quote-mark-end {
        margin-right: 0;
        margin-left: 3px;
      }

      @media (max-width: 760px) {
        li.fav-ep-card { grid-template-columns: 1fr; }
        /* No mobile o número não fica mais numa linha própria acima da
          imagem: o rank-wrap original é escondido e o número reaparece
          embutido antes do nome do anime (ex.: "#1 Code Geass..."),
          via ::before com o mesmo counter(item) que já numera a lista. */
        li.fav-ep-card .rank-wrap {
          display: none;
        }
        .fav-ep-anime::before {
          content: "#" counter(item) " ";
          font-weight: 900;
          color: rgba(255,255,255,0.4);
        }
        .fav-ep-content { padding: 18px 20px 22px; }
      }

      @media (max-width: 420px) {
        .fav-ep-anime { font-size: 19px; }
        .fav-ep-thumb { width: 62px; }
      }

      /* ══════════════════════════════════════════════════════════════════
        Fav Ep Lightbox — modal em tela cheia ao clicar na imagem de um
        card de "Favorite Episodes". Baseado no layout de referência feito
        no Canva: imagem grande com contador, setas nas laterais, título +
        episódio centralizados e os selos MNP/IMDb embaixo (IMDb linkando
        pra ep.imdbUrl). Componente próprio, separado do .poster-lightbox
        (que é mais robusto e usado só pelo "All Animes"/"Watching Now").
        ══════════════════════════════════════════════════════════════════ */
      .fav-ep-lightbox {
        position: fixed;
        inset: 0;
        height: 100vh;
        height: 100dvh;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        transition: opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        cursor: zoom-out;
      }

      .fav-ep-lightbox.open {
        display: flex;
        opacity: 1;
      }

      /* ── Ambient: a própria imagem do episódio, ampliada e borrada, como
        wallpaper do fundo (mesma mecânica do .poster-lightbox-ambient) ── */
      .fav-ep-lightbox-ambient {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .fav-ep-lightbox-ambient img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 140%;
        height: 140%;
        min-width: 140vw;
        min-height: 140vh;
        object-fit: cover;
        filter: blur(70px) saturate(1.6) brightness(0.7);
        transform: translate(-50%, -50%) scale(1.4);
      }

      .fav-ep-lightbox-ambient::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 130% 120% at 50% 45%, transparent 0%, rgba(0,0,0,0.25) 100%);
      }

      .fav-ep-lightbox.open .fav-ep-lightbox-ambient.ready {
        opacity: 0.67;
      }

      .fav-ep-lightbox-box {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: min(96vw, 1400px);
        max-height: 92vh;
        overflow-y: auto;
        scrollbar-width: none;
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 22px 22px 28px;
        display: flex;
        flex-direction: column;
        cursor: default;
        transform: scale(0.96);
        transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .fav-ep-lightbox-box::-webkit-scrollbar { display: none; }

      .fav-ep-lightbox.open .fav-ep-lightbox-box {
        transform: scale(1);
      }

      /* Botão de fechar fixo no canto superior direito da tela, igual ao
        .poster-lightbox-close (não fica preso à caixa/box). */
      .fav-ep-lightbox-close {
        position: fixed;
        top: 20px;
        right: 24px;
        z-index: 2;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: none;
        background: rgba(255,255,255,0.015);
        color: #cbd5e1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: background 0.12s ease, color 0.12s ease, transform 0.12s ease;
      }

      .fav-ep-lightbox-close:hover {
        background: rgba(255,255,255,0.05);
        color: #fff;
        transform: scale(1.02);
      }

      .fav-ep-lightbox-close:focus,
      .fav-ep-lightbox-close:focus-visible {
        outline: none;
        box-shadow: none;
      }

      .fav-ep-lightbox-close svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2.2;
        fill: none;
      }

      .fav-ep-lightbox-content {
        display: flex;
        align-items: flex-start;
        gap: 40px;
        width: 100%;
      }

      .fav-ep-lightbox-media {
        flex: 1 1 60%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .fav-ep-lightbox-image-wrap {
        position: relative;
        width: 100%;
        min-width: 0;
        line-height: 0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .fav-ep-lightbox-image-wrap img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: var(--surface);
      }

      /* Mesmo contador "posição/total" (ex: 1/5) usado no card normal
        (.fav-ep-counter), só reaproveitado aqui dentro do lightbox. */
      .fav-ep-lightbox-counter {
        position: absolute;
        right: 10px;
        top: 10px;
        z-index: 2;
        font-family: var(--font-title);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.02em;
        line-height: 1.6;
        white-space: nowrap;
        color: #fff;
        background: rgba(10,10,10,0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 4px 12px;
        border-radius: 999px;
        pointer-events: none;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
      }

      /* Tira de mini-thumbnails abaixo da imagem grande, com as setas ‹ ›
        nas laterais — reaproveita as classes .fav-ep-thumbnav /
        .fav-ep-thumbstrip / .fav-ep-thumb já usadas no carrossel do card. */
      #favEpLightboxThumbnav.fav-ep-thumbnav { display: none; }
      #favEpLightboxThumbnav.fav-ep-thumbnav.has-gallery { display: flex; }

      /* Ao contrário da tira do card (que preenche o espaço disponível e
        trava via JS em quantas miniaturas cabem inteiras), aqui a tira
        deve só ter o tamanho do próprio conteúdo, pra centralizar de
        verdade junto com as setas — sem sobrar espaço vazio de um lado. */
      #favEpLightboxThumbstrip.fav-ep-thumbstrip {
        flex: 0 1 auto;
        max-width: 100%;
      }

      .fav-ep-lightbox-info {
        flex: 1 1 34%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: 4px;
      }

      .fav-ep-lightbox-title {
        margin: 0;
        font-family: var(--font-title);
        font-weight: 800;
        font-size: 28px;
        color: #fff;
        text-align: left;
        line-height: 1.3;
      }

      .fav-ep-lightbox-rank {
        display: inline-block;
        margin-right: 6px;
        font-family: var(--font-title);
        font-weight: 900;
        font-size: 0.68em;
        color: rgba(255,255,255,0.5);
        letter-spacing: -0.01em;
        vertical-align: middle;
      }

      .fav-ep-lightbox-subtitle {
        margin: 10px 0 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        text-align: left;
      }

      .fav-ep-lightbox-badges {
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 16px;
        flex-wrap: wrap;
      }

      /* Botão do Crunchyroll, ao lado do selo do IMDb: no PC é só a logo
        (o link já é óbvio pelo hover), no mobile a logo vem acompanhada
        do ícone de link externo, igual ao padrão já usado nos botões do
        "All Animes" (.rank-mal-label--crunchyroll). */
      .fav-ep-crunchyroll-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        text-decoration: none;
        cursor: pointer;
        transition: opacity 0.15s ease, filter 0.15s ease;
      }

      a.fav-ep-crunchyroll-btn:hover,
      a.fav-ep-crunchyroll-btn:focus-visible {
        filter: brightness(1.15);
        opacity: 0.85;
      }

      .fav-ep-crunchyroll-logo {
        display: block;
        width: auto;
        height: 17px;
        max-width: none;
        object-fit: contain;
      }

      .fav-ep-crunchyroll-btn svg {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        color: var(--muted);
        opacity: 0.8;
      }

      @media (min-width: 641px) {
        .fav-ep-crunchyroll-btn svg { display: none; }
      }

      @media (max-width: 640px) {
        .fav-ep-lightbox { padding: 16px; }
        .fav-ep-lightbox-box { padding: 18px 16px 22px; border-radius: 18px; }
        .fav-ep-lightbox-content { flex-direction: column; align-items: center; gap: 18px; }
        .fav-ep-lightbox-media { flex: none; width: 100%; }
        .fav-ep-lightbox-info { align-items: center; text-align: center; padding-top: 0; }
        .fav-ep-lightbox-title,
        .fav-ep-lightbox-subtitle { text-align: center; font-size: 18px; }
        .fav-ep-lightbox-subtitle { font-size: 14px; }
        .fav-ep-lightbox-badges { justify-content: center; }
      }
    </style>

  </head>

    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      document.addEventListener("DOMContentLoaded", async function() {
        // ── Trava de scroll compartilhada por todos os drawers/lightbox ──
        // Importante: NUNCA muda "overflow" de html/body. Em vez disso, fixa o
        // body na posição atual (position:fixed + top negativo). Como a
        // propriedade "overflow" nunca é tocada, o navegador nunca recalcula a
        // presença/ausência da scrollbar nativa, então a largura da página
        // (e dos cards) nunca muda ao abrir/fechar um drawer, em nenhum navegador.
        let __scrollLockCount = 0;
        let __scrollLockY = 0;

        function lockBodyScroll() {
          if (__scrollLockCount === 0) {
            __scrollLockY = window.scrollY || window.pageYOffset || 0;
            document.body.style.position = 'fixed';
            document.body.style.top = (-__scrollLockY) + 'px';
            document.body.style.left = '0';
            document.body.style.right = '0';
            document.body.style.width = '100%';
          }
          __scrollLockCount++;
        }

        function unlockBodyScroll(skipRestore) {
          __scrollLockCount = Math.max(0, __scrollLockCount - 1);
          if (__scrollLockCount === 0) {
            document.body.style.position = '';
            document.body.style.top = '';
            document.body.style.left = '';
            document.body.style.right = '';
            document.body.style.width = '';
            // Quando quem chamou já sabe que vai rolar a página pra outro lugar
            // em seguida (ex.: clique num resultado da busca que leva pra um
            // card específico), pular esse scrollTo evita uma corrida no
            // mobile: remover o position:fixed dispara um reflow que alguns
            // navegadores mobile aplicam de forma meio assíncrona, então esse
            // scrollTo "restaurando a posição antiga" às vezes só é efetivado
            // DEPOIS do scroll intencional pro card, cancelando ele e jogando
            // a página de volta pro topo da lista/categoria.
            if (!skipRestore) window.scrollTo(0, __scrollLockY);
          }
        }

        // ── Lightbox: amplia a imagem do card ao clicar nela ──
        (function initPosterLightbox() {
          const lightbox = document.getElementById('posterLightbox');
          const lightboxAmbient = document.getElementById('posterLightboxAmbient');
          const lightboxImg = document.getElementById('posterLightboxImg');
          const lightboxTitle = document.getElementById('posterLightboxTitle');
          const lightboxList = document.getElementById('posterLightboxList');
          const lightboxAnnounce = document.getElementById('posterLightboxAnnounce');
          const lightboxRatings = document.getElementById('posterLightboxRatings');
          const lightboxMeta = document.getElementById('posterLightboxMeta');
          const lightboxMal = document.getElementById('posterLightboxMal');
          const lightboxMoreInfo = document.getElementById('posterLightboxMoreInfo');
          const lightboxMediaWatchNow = document.getElementById('posterLightboxMediaWatchNow');
          const lightboxInfo = document.getElementById('posterLightboxInfo');
          const lightboxSimpleCategory = document.getElementById('posterLightboxSimpleCategory');
          const lightboxMediaCategory = document.getElementById('posterLightboxMediaCategory');
          const lightboxSimpleCaption = document.getElementById('posterLightboxSimpleCaption');
          const lightboxSimpleLink = document.getElementById('posterLightboxSimpleLink');
          const closeBtn = document.getElementById('posterLightboxClose');
          if (!lightbox || !lightboxImg || !closeBtn) return;

          // ── Zoom da imagem no mobile: toca no pôster pequeno e ele aparece
          // ampliado, centralizado, por cima de tudo. Só liga no mobile
          // (ver check da media query dentro do listener de click). ──
          const lightboxImageWrap = lightbox.querySelector('.poster-lightbox-image-wrap');
          const lightboxZoom = document.getElementById('posterLightboxZoom');
          const lightboxZoomImg = document.getElementById('posterLightboxZoomImg');
          const MOBILE_QUERY = '(max-width: 760px)';

          function closeImageZoom() {
            if (!lightboxZoom) return;
            lightboxZoom.classList.remove('open');
            lightboxZoom.setAttribute('aria-hidden', 'true');
          }

          if (lightboxImageWrap && lightboxZoom && lightboxZoomImg) {
            lightboxImageWrap.addEventListener('click', function(e) {
              if (!window.matchMedia(MOBILE_QUERY).matches) return;
              if (!lightboxImg.src) return;
              e.preventDefault();
              e.stopPropagation();
              lightboxZoomImg.src = lightboxImg.src;
              lightboxZoomImg.alt = lightboxImg.alt;
              lightboxZoom.classList.add('open');
              lightboxZoom.setAttribute('aria-hidden', 'false');
            });

            lightboxZoom.addEventListener('click', function(e) {
              e.stopPropagation();
              closeImageZoom();
            });
          }

          let lastFocused = null;
          let currentItem = null;

          // ── Som especial ao abrir o poster-lightbox do Re:ZERO ──
          const rezeroSound = new Audio('assets/sound-effects/rdb-rezero.mp3');
          rezeroSound.loop = true;
          const REZERO_IDS = ['re-zero', 're-zero-4'];

          // ── Som especial ao abrir o poster-lightbox do JJK (sem loop) ──
          const jjkSound = new Audio('assets/sound-effects/yuta-jjk.mp3');
          jjkSound.loop = false;
          const JJK_IDS = ['jjk'];

          // ── Som especial ao abrir o poster-lightbox do AOT (sem loop) ──
          const aotSound = new Audio('assets/sound-effects/aot-roar.mp3');
          aotSound.loop = false;
          const AOT_IDS = ['aot', 'rw-aot'];

          // ── Som especial ao abrir o poster-lightbox do One Piece (sem loop) ──
          const onePieceSound = new Audio('assets/sound-effects/luffy-haki.mp3');
          onePieceSound.loop = false;
          const ONE_PIECE_IDS = ['one-piece'];

          // ── Fade-out suave para os sound effects (usado ao fechar o lightbox) ──
          const _audioFadeTimers = new WeakMap();

          function fadeOutAudio(audio, duration = 1800) {
            if (!audio) return;
            const existingTimer = _audioFadeTimers.get(audio);
            if (existingTimer) {
              clearInterval(existingTimer);
              _audioFadeTimers.delete(audio);
            }
            if (audio.paused) return;
            const steps = 20;
            const stepTime = duration / steps;
            const startVolume = audio.volume > 0 ? audio.volume : 1;
            const volumeStep = startVolume / steps;
            let currentStep = 0;
            const timer = setInterval(() => {
              currentStep++;
              const newVolume = Math.max(0, startVolume - (volumeStep * currentStep));
              audio.volume = newVolume;
              if (currentStep >= steps || newVolume <= 0) {
                clearInterval(timer);
                _audioFadeTimers.delete(audio);
                audio.pause();
                audio.currentTime = 0;
                audio.volume = startVolume;
              }
            }, stepTime);
            _audioFadeTimers.set(audio, timer);
          }

          function stopAudioInstantly(audio) {
            if (!audio) return;
            const existingTimer = _audioFadeTimers.get(audio);
            if (existingTimer) {
              clearInterval(existingTimer);
              _audioFadeTimers.delete(audio);
