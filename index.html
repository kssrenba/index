      <script>
        // Cria uma versão a partir dos bytes dos ícones. Quando qualquer imagem
        // for trocada mantendo o mesmo nome, o navegador passa a enxergar uma
        // URL nova e atualiza também o ícone do PWA já instalado.
        (function () {
          const ICON_FILES = [
            'assets/icon-site.webp',
            'assets/icon-192.png',
            'assets/icon-512.png'
          ];

          function hashBytes(buffer) {
            const bytes = new Uint8Array(buffer);
            let hash = 2166136261;
            for (let i = 0; i < bytes.length; i += 1) {
              hash ^= bytes[i];
              hash = Math.imul(hash, 16777619);
            }
            return `${bytes.length.toString(36)}${(hash >>> 0).toString(36)}`;
          }

          function withIconVersion(path, version) {
            const url = new URL(path, document.baseURI);
            url.searchParams.set('iconVersion', version);
            return url.href;
          }

          async function refreshPwaIconVersion() {
            try {
              const versions = await Promise.all(
                ICON_FILES.map(async (path) => {
                  const response = await fetch(path, { cache: 'no-cache' });
                  if (!response.ok) throw new Error(`Icon not found: ${path}`);
                  return hashBytes(await response.arrayBuffer());
                })
              );

              const version = versions.join('-');
              const manifest = document.getElementById('siteManifest');
              const favicon = document.getElementById('siteFavicon');
              const appleIcon = document.getElementById('siteAppleTouchIcon');

              if (manifest) manifest.href = withIconVersion('manifest.json', version);
              if (favicon) favicon.href = withIconVersion(ICON_FILES[0], versions[0]);
              if (appleIcon) appleIcon.href = withIconVersion(ICON_FILES[1], versions[1]);

              try {
                localStorage.setItem('myhtml_pwa_icon_version', version);
              } catch (e) {}

              return version;
            } catch (error) {
              // Se estiver offline, mantém os ícones que já estavam disponíveis.
              return null;
            }
          }

          window.refreshPwaIconVersion = refreshPwaIconVersion;
          window.addEventListener('load', () => {
            const scheduleRefresh = () => refreshPwaIconVersion();
            if ('requestIdleCallback' in window) {
              requestIdleCallback(scheduleRefresh, { timeout: 2500 });
            } else {
              setTimeout(scheduleRefresh, 1200);
            }
          });
          let lastIconRefreshAt = 0;
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && Date.now() - lastIconRefreshAt > 300000) {
              lastIconRefreshAt = Date.now();
              refreshPwaIconVersion();
            }
          });
        })();
      </script>

      <script>
        // Registra e atualiza o service worker sem reutilizar uma cópia antiga.
        if ('serviceWorker' in navigator) {
          window.addEventListener('DOMContentLoaded', () => {
            navigator.serviceWorker
              // A versão na URL força o navegador a instalar esta revisão do
              // worker, inclusive para quem ainda tem um cache antigo ativo.
              .register('service-worker.js?v=image-refresh-v2', { updateViaCache: 'none' })
              // register já faz a verificação de atualização, sem recarregar a tela.
              .then(() => navigator.serviceWorker.ready)
              .catch(() => {});
          });
        }
      </script>
