            // única temporada também não tiver divisão em cours (ex: anime de
            // temporada única e sem cour, tipo Frieren: aí cur/tot já basta).
            const hasMultipleSeasons = anime.seasons.length > 1;
            const hasAnyCourSplit = Array.isArray(anime.cours) && anime.cours.some(c => Array.isArray(c) && c.length > 1);
            if (!hasMultipleSeasons && !hasAnyCourSplit) return null;

            let acc = 0;
            for (let i = 0; i < anime.seasons.length; i++) {
              const epCount = anime.seasons[i];
              const isLastSeason = i === anime.seasons.length - 1;
              if (cur <= acc + epCount || isLastSeason) {
                const withinSeason = Math.max(0, cur - acc);

                const courSplit = Array.isArray(anime.cours) ? anime.cours[i] : null;
                if (Array.isArray(courSplit) && courSplit.length > 1) {
                  let courAcc = 0;
                  for (let c = 0; c < courSplit.length; c++) {
                    const courEp = courSplit[c];
                    const isLastCour = c === courSplit.length - 1;
                    if (withinSeason <= courAcc + courEp || isLastCour) {
                      return {
                        seasonIdx: i,
                        withinCur: Math.max(0, withinSeason - courAcc),
                        seasonTot: courEp,
                        isCour: true,
                        courIdx: c,
                      };
                    }
                    courAcc += courEp;
                  }
                }

                return { seasonIdx: i, withinCur: withinSeason, seasonTot: epCount, isCour: false };
              }
              acc += epCount;
            }
            return null;
          }

          function parseWatchProgress(anime) {
            if (!anime) return null;
            const infoStr = anime.info;
            const m = infoStr ? String(infoStr).match(/(?:Progress:\s*)?(\d+|-)\s*\/\s*(\d+|-)(?!\d)/i) : null;

            // Quando o anime já tem o campo "seasons", o total de episódios vem da
            // soma das temporadas — não precisa mais escrever "Progress: X/Y" no info.
            const seasonsTotal = (Array.isArray(anime.seasons) && anime.seasons.length)
              ? anime.seasons.reduce((a, b) => a + b, 0)
              : null;

            if (!m && seasonsTotal === null) return null;

            const curRaw = m ? m[1] : '0';
            const cur = curRaw === '-' ? 0 : parseInt(curRaw, 10);
            if (!Number.isFinite(cur)) return null;

            if (seasonsTotal !== null) {
              const pct = Math.max(0, Math.min(100, (cur / seasonsTotal) * 100));
              return { cur, tot: seasonsTotal, pct, curLabel: String(cur), indeterminate: false };
            }

            const totRaw = m[2];
            if (totRaw === '-') {
              // Total ainda não definido (ex: obra em andamento sem episódio final anunciado).
              // Não dá pra calcular %, então a barra usa um estado "indeterminado".
              return { cur, tot: null, pct: null, curLabel: String(cur), indeterminate: true };
            }
            const tot = parseInt(totRaw, 10);
            if (!Number.isFinite(tot) || tot <= 0) return null;
            const pct = Math.max(0, Math.min(100, (cur / tot) * 100));
            return { cur, tot, pct, curLabel: curRaw === '-' ? '-' : String(cur), indeterminate: false };
          }

                    </div>`;
                } else {
                  if (override !== null) {
                    progress.cur = Math.max(0, Math.min(progress.tot, override));
                    progress.pct = Math.max(0, Math.min(100, (progress.cur / progress.tot) * 100));
                    progress.curLabel = String(progress.cur);
                  }
                  const atMax = progress.cur >= progress.tot;
                  const atMin = progress.cur <= 0;
                  // Se o anime tiver várias temporadas (campo "seasons"), desenha uma

                  // já que a barra mostra o progresso somado de todas elas.
                  let seasonMarksHtml = '';
                  let seasonZonesHtml = '';
                  let courMarksHtml = '';
                  if (Array.isArray(anime.seasons) && anime.seasons.length >= 1) {
                    let acc = 0;
                    const seasonTotal = anime.seasons.reduce((a, b) => a + b, 0);
                    if (anime.seasons.length > 1) {
                      // Alguns animes intercalam um filme canônico entre as
                      // temporadas dentro do próprio array "seasons" (ex: Konosuba
                      // [10,10,1,11], onde o "1" é o filme). O array opcional
                      // "movieSeasons" lista (0-indexado) quais posições desse
                      // array são na verdade filmes, não temporadas — assim a
                      // numeração ("1ª", "2ª"...) pula esses índices e o
                      // marcador/zona mostra "Filme" em vez de virar uma
                      // "temporada" de 1 episódio só.
                      const movieIdxSet = new Set(Array.isArray(anime.movieSeasons) ? anime.movieSeasons : []);
                      let seasonNum = 0;
                      const seasonLabels = anime.seasons.map((epCount, idx) => {
                        if (movieIdxSet.has(idx)) return { isMovie: true, label: (anime.movieLabels && anime.movieLabels[idx]) || 'Filme' };
                        seasonNum++;
                        return { isMovie: false, label: `${seasonNum}ª temporada` };

                      // (via "movieDurations") ao invés do "1 episódio" fake —
                      // assim o pedaço do filme na barra fica do tamanho real
                      // dele (ex: 2h35m ≈ 7-8 "episódios" de largura).
                      const { weights: visualWeights, total: visualTotal } = computeSeasonVisualWeights(anime);

                      let visAcc = 0;
                      seasonMarksHtml = anime.seasons.slice(0, -1).map((epCount, idx) => {
                        visAcc += visualWeights[idx];
                        const markPct = Math.max(0, Math.min(100, (visAcc / visualTotal) * 100));
                        const { isMovie, label } = seasonLabels[idx];
                        return `<span class="watch-progress-season-mark" style="left:${markPct}%;" title="Fim ${isMovie ? 'do' : 'da'} ${label}"></span>`;
                      }).join('');

                      let zoneAcc = 0;
                      seasonZonesHtml = anime.seasons.map((epCount, idx) => {
                        const startPct = Math.max(0, Math.min(100, (zoneAcc / visualTotal) * 100));
                        zoneAcc += visualWeights[idx];
                        const endPct = Math.max(0, Math.min(100, (zoneAcc / visualTotal) * 100));
                        const widthPct = Math.max(0, endPct - startPct);
                        const { isMovie, label } = seasonLabels[idx];
                        const epLabel = epCount === 1 ? 'episódio' : 'episódios';
                        const durStr = isMovie && anime.movieDurations ? anime.movieDurations[idx] : null;
                        const zoneTitle = isMovie
                          ? `${label}: ${durStr || `${epCount} ${epLabel}`}`
                          : `${label}: ${epCount} ${epLabel}`;
                        return `<span class="watch-progress-season-zone" style="left:${startPct}%;width:${widthPct}%;" title="${zoneTitle}"></span>`;
                      }).join('');
                    }

                    // temporada (campo "seasons") foi exibida em dois ou mais

                    // a "seasons") descreve como dividi-la, ex: cours[1] = [13,13]
                    // divide a 2ª temporada ao meio. Diferente do marcador de
                    // temporada, esse não encerra a barra em uma temporada nova.
                    if (Array.isArray(anime.cours)) {

                      anime.cours.forEach((courSplit, sIdx) => {

                        if (Array.isArray(courSplit) && courSplit.length > 1) {
                          let courAcc = 0;
                          courMarksHtml += courSplit.slice(0, -1).map((courEpCount, cIdx) => {
                            courAcc += courEpCount;
                            const pct = Math.max(0, Math.min(100, ((seasonAcc + courAcc) / seasonTotal) * 100));
                            return `<span class="watch-progress-cour-mark" style="left:${pct}%;" title="Fim do ${cIdx + 1}º cour (${sIdx + 1}ª temporada)"></span>`;

                        }

                      });

                    // (baseado na contagem real de episódios) ficaria
                    // desalinhado com a zona do filme, que agora é mais larga.
                    if (anime.seasons.length > 1) {
                      progress.pct = computeVisualFillPct(anime, progress.cur);

                  ${remainingInfo ? `<div class="info-row">
                    <p class="info">${remainingInfo}</p>
                  </div>` : ''}
                  ${progressHtml}
                </div>
              </li>
            `;
          }

          function hexToRgb(hex) {
            const clean = hex.trim().replace('#', '');
            const full = clean.length === 3
              ? clean.split('').map(c => c + c).join('')
              : clean;
            const num = parseInt(full, 16);
            return {
              r: (num >> 16) & 255,
              g: (num >> 8) & 255,
              b: num & 255
            };
          }

              const { r, g, b } = hexToRgb(color);
              const root = document.documentElement.style;

              // Cor pura (sem mistura) da categoria atual, usada em detalhes pontuais da UI
              // que devem acompanhar a lista ativa.
              root.setProperty('--current-cat-color', color);

              // Glow visível sobre a base preta — as "partes coloridas" da categoria
              root.setProperty('--glow-1', `rgba(${r}, ${g}, ${b}, 0.38)`);
              root.setProperty('--glow-2', `rgba(${r}, ${g}, ${b}, 0.24)`);
              root.setProperty('--glow-3', `rgba(${r}, ${g}, ${b}, 0.16)`);

              const mixWithBlack = (channel) => Math.round(channel * 0.12);
              const pr = mixWithBlack(r), pg = mixWithBlack(g), pb = mixWithBlack(b);
              root.setProperty('--page-base', `rgb(${pr}, ${pg}, ${pb})`);

              const mr = Math.round(r * 0.5 + 156 * 0.5);
              const mg = Math.round(g * 0.5 + 163 * 0.5);
              const mb = Math.round(b * 0.5 + 175 * 0.5);
              root.setProperty('--glow-accent', `rgb(${mr}, ${mg}, ${mb})`);
            } catch (e) {}
          }

            // Por padrão, trocar de aba foca o campo de busca (quando a aba for

            // mesmo drawer (exposto via window.__ pela sua própria
            // inicialização, chamada mais abaixo no script).
            if (target === 'search' && shouldFocus && window.__onSearchTabActive) window.__onSearchTabActive();
            saveDrawerStateNow();
          }

          drawerTabs.forEach(t => {
            const active = t.getAttribute('data-tab') === 'ranks';
            t.classList.toggle('active', active);
            t.setAttribute('aria-selected', active ? 'true' : 'false');
          });
          drawerPanels.forEach(p => p.classList.toggle('active', p.getAttribute('data-panel') === 'ranks'));

          function openDrawer(tab, opts) {
            if (!drawer || !backdrop) return;
            if (drawerFrame) cancelAnimationFrame(drawerFrame);
            isDrawerOpen = true;
            if (tab) {
              switchDrawerTab(tab, opts);
            } else {
              const activeTab = drawerTabs.find(t => t.classList.contains('active'));
              updateHeaderTriggerButtons(activeTab ? activeTab.getAttribute('data-tab') : 'ranks');
            }
            drawer.setAttribute('aria-hidden', 'false');
            lockBodyScroll();

            drawerFrame = requestAnimationFrame(() => {
              drawer.classList.add('show');
              backdrop.classList.add('show');
              drawerFrame = 0;
            });

            saveDrawerStateNow();
          }

          function closeDrawer(skipScrollRestore) {
            if (!drawer || !backdrop) return;
            if (drawerFrame) cancelAnimationFrame(drawerFrame);
            isDrawerOpen = false;
            drawer.classList.remove('show');
            backdrop.classList.remove('show');
            drawer.setAttribute('aria-hidden', 'true');
            updateHeaderTriggerButtons(null);
            unlockBodyScroll(skipScrollRestore);
            if (window.__cancelPendingSearchFocus) window.__cancelPendingSearchFocus();
            const input = document.getElementById('searchDrawerInput');
            if (input) input.blur();
            saveDrawerStateNow();
          }

          // ── Salvamento/restauração do estado do drawer (aberto/fechado, aba
          // ativa e texto de busca). Guardado em local + sessionStorage (mesmo
          // padrão do scroll) pra sobreviver a um reload/atualização do site: se
          // o usuário estava com o drawer aberto numa aba, ele reabre do mesmo
          // jeito depois que a página recarrega. ──
          const DRAWER_STATE_KEY = 'myanimerank_drawerState';

          function saveDrawerStateNow() {
            try {
              const activePanel = drawerPanels.find(p => p.classList.contains('active'));
              const tabName = activePanel ? activePanel.getAttribute('data-panel') : 'ranks';
              const searchInputEl = document.getElementById('searchDrawerInput');
              const state = {
                open: isDrawerOpen,
                tab: tabName,
                query: searchInputEl ? searchInputEl.value : ''
              };
              const json = JSON.stringify(state);
              localStorage.setItem(DRAWER_STATE_KEY, json);
              sessionStorage.setItem(DRAWER_STATE_KEY, json);
            } catch (e) {}
          }

          function restoreDrawerState() {
            try {
              const raw = localStorage.getItem(DRAWER_STATE_KEY) || sessionStorage.getItem(DRAWER_STATE_KEY);
              if (!raw) return;
              const state = JSON.parse(raw);
              if (!state || !state.open) return;

              const tab = state.tab || 'ranks';
              openDrawer(tab, { focus: false });

              if (tab === 'search' && state.query) {
                const searchInputEl = document.getElementById('searchDrawerInput');
                const searchBoxDrawerEl = document.getElementById('searchBoxDrawer');
                if (searchInputEl) {
                  searchInputEl.value = state.query;
                  if (searchBoxDrawerEl) searchBoxDrawerEl.classList.toggle('has-value', state.query.length > 0);
                  searchInputEl.dispatchEvent(new Event('input'));
                }
              }
            } catch (e) {}
          }

          // Mapa de qual aba do drawer ("ranks" ou "lists") contém cada
          // modo/categoria — usado para abrir o drawer sempre na aba certa
          // pra lista que está sendo exibida no momento, em vez de reabrir
          // simplesmente a última aba que ficou marcada como "active" no DOM
          // (o que fazia, por ex., a Watching Now abrir o drawer em "Ranks").
          const MODE_TAB = {
            all: 'ranks', romance: 'ranks', isekai: 'ranks', sports: 'ranks', mecha: 'ranks',
            watching: 'lists', plan: 'lists', incomplete: 'lists', announced: 'lists',
            watchedMonth: 'lists', favEpisodes: 'lists', trueCharacters: 'lists'
          };

          function createDrawerController() {
            filterBtnEl.addEventListener('click', (e) => {
              e.stopPropagation();
              if (isDrawerOpen) {
                closeDrawer();
              } else {
                openDrawer(MODE_TAB[currentCategory] || 'ranks');
              }
            });

            closeBtn.addEventListener('click', () => closeDrawer());
            backdrop.addEventListener('click', () => closeDrawer());

            if (resetBtnEl) {
              resetBtnEl.addEventListener('click', () => {
                const changed = currentCategory !== 'all';
                if (!changed) return;

                currentCategory = 'all';

                try {
                  const kS = 'myanimerank_scrollY_' + currentCategory;
                  const kE = 'myanimerank_expanded_' + currentCategory;
                  localStorage.removeItem(kS);
                  sessionStorage.removeItem(kS);
                  localStorage.removeItem(kE);
                  sessionStorage.removeItem(kE);
                } catch(e) {}

                if (isDrawerOpen) closeDrawer();
                render();
                window.scrollTo({ top: 0, behavior: 'instant' });
              });
            }

            drawerTabs.forEach(tab => {
              tab.addEventListener('click', () => {
                switchDrawerTab(tab.getAttribute('data-tab'));
              });
            });

            // ── Swipe (só no celular, via eventos de touch) para trocar de aba
            // dentro do drawer "You Decided That": arrastar p/ esquerda vai pra
            // próxima aba, arrastar p/ direita volta pra anterior.
            (function initDrawerTabSwipe() {
              const drawerContent = document.querySelector('#categoryDrawer .drawer-content');
              if (!drawerContent || drawerTabs.length < 2) return;

              const SWIPE_MIN_DIST = 55;      // distância horizontal mínima (px)
              const SWIPE_MAX_OFF_AXIS = 65;   // tolerância de desvio vertical (px)

              let startX = 0;
              let startY = 0;
              let tracking = false;

              drawerContent.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) { tracking = false; return; }
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
              }, { passive: true });

              drawerContent.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                const touch = e.changedTouches && e.changedTouches[0];
                if (!touch) return;

                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;

                if (Math.abs(deltaX) < SWIPE_MIN_DIST) return;
                if (Math.abs(deltaY) > SWIPE_MAX_OFF_AXIS) return;

                const currentIndex = drawerTabs.findIndex(t => t.classList.contains('active'));
                if (currentIndex === -1) return;

                let nextIndex;
                if (deltaX < 0) {
                  // Arrastou pra esquerda -> próxima aba
                  nextIndex = currentIndex + 1;
                } else {
                  // Arrastou pra direita -> aba anterior
                  nextIndex = currentIndex - 1;
                }

                if (nextIndex < 0 || nextIndex >= drawerTabs.length) return;
                switchDrawerTab(drawerTabs[nextIndex].getAttribute('data-tab'));
              }, { passive: true });
            })();

            drawerItems.forEach(item => {
              item.addEventListener('click', () => {
                const mode = item.getAttribute('data-mode');
                
                if (currentCategory !== mode) {
                  currentCategory = mode;
                  
                  try {
                    const kS = 'myanimerank_scrollY_' + currentCategory;
                    const kE = 'myanimerank_expanded_' + currentCategory;
                    localStorage.removeItem(kS);
                    sessionStorage.removeItem(kS);
                    localStorage.removeItem(kE);
                    sessionStorage.removeItem(kE);
                  } catch(e) {}
                  
                  render();
                  window.scrollTo({ top: 0, behavior: 'instant' });
                }
                closeDrawer();
              });
            });
          }

          function getFilteredData(mode) {
            if (mode === 'all') {
              return animeData.filter(a => !planIds.has(a.id));
            } else if (mode === 'romance') {
              const romanceSet = new Set(romanceIds);
              return animeData.filter(a => romanceSet.has(a.id) && !planIds.has(a.id));
            } else if (mode === 'isekai') {
              const isekaiSet = new Set(isekaiIds);
              return animeData.filter(a => isekaiSet.has(a.id) && !planIds.has(a.id));
            } else if (mode === 'incomplete') {
              return animeData.filter(anime => anime.info && anime.info.includes('⏸') && !planIds.has(anime.id));
            } else if (mode === 'plan') {
              return planToWatchData;
            } else if (mode === 'watching') {
              return watchingData;
            } else if (mode === 'sports') {
              const sportsSet = new Set(sportsIds);
              return animeData.filter(a => sportsSet.has(a.id) && !planIds.has(a.id));
            } else if (mode === 'mecha') {
              const mechaSet = new Set(mechaIds);
              return animeData.filter(a => mechaSet.has(a.id) && !planIds.has(a.id));
            } else if (mode === 'announced') {
              const watchedAnnounced = animeData.filter(a => nextSeasonMap[a.id] && !planIds.has(a.id));
              const watchingAnnounced = watchingData.filter(a => nextSeasonMap[a.id]);
              const planAnnounced = planToWatchData.filter(a => nextSeasonMap[a.id]);
              // Ordena pela mesma sequência das chaves em nextSeasonMap, em vez
              // da ordem original de animeData/watchingData/planToWatchData.
              const nextSeasonOrder = Object.keys(nextSeasonMap);
              const byNextSeasonOrder = (a, b) => nextSeasonOrder.indexOf(a.id) - nextSeasonOrder.indexOf(b.id);
              watchedAnnounced.sort(byNextSeasonOrder);
              watchingAnnounced.sort(byNextSeasonOrder);
              planAnnounced.sort(byNextSeasonOrder);
              return [...watchedAnnounced, ...watchingAnnounced, ...planAnnounced];
            } else if (mode === 'favEpisodes') {
              return favoriteEpisodesData;
            } else if (mode === 'trueCharacters') {
              return trueCharactersData;
            } else if (mode === 'watchedMonth') {
              return (typeof watchedMonthlyData !== 'undefined' ? watchedMonthlyData : []).flatMap(m => m.animes || []);
            }
            return [];
          }

          function updateDrawerCounts() {
            document.querySelectorAll('[data-count-mode]').forEach(el => {
              const mode = el.getAttribute('data-count-mode');
              const n = getFilteredData(mode).length;
              el.textContent = n + (n === 1 ? ' item' : ' items');
            });
          }

          function renderWatchingList(data) {
            const groups = {};
            const noSeason = [];

            data.forEach(anime => {
              const key = anime.season || null;
              if (key) {
                (groups[key] = groups[key] || []).push(anime);
              } else {
                noSeason.push(anime);
              }
            });

            const seasonKeys = Object.keys(groups).sort((a, b) => {
              const ia = WATCHING_SEASON_ORDER.indexOf(a);
              const ib = WATCHING_SEASON_ORDER.indexOf(b);
              if (ia === -1 && ib === -1) return a.localeCompare(b);
              if (ia === -1) return -1;
              if (ib === -1) return 1;
              return ia - ib;
            });

            let html = '';

            if (noSeason.length) {
              html += `<li class="season-header season-header-novisual" style="--season-color: ${WATCHING_NO_SEASON_LABEL.color};">
                        <span class="season-text">${WATCHING_NO_SEASON_LABEL.text}</span>
                        <div class="season-line"></div>
                      </li>`;
              html += noSeason.map(anime => createAnimeCard(anime, 'watching', WATCHING_NO_SEASON_LABEL.color)).join('');
            }

            seasonKeys.forEach(key => {
              const seasonObj = WATCHING_SEASON_LABELS[key] || { text: key, color: "var(--muted)" };
              // Nota: não dá pra usar escapeHtml() aqui — é local a outro
              // escopo do arquivo e não existe dentro de renderWatchingList
              // (mesmo bug documentado no escapeHtml duplicado da busca).
              const escSeason = str => String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
              const seasonTextHtml = seasonObj.url
                ? `<a class="season-text season-text-link" href="${escSeason(seasonObj.url)}" target="_blank" rel="noopener">${escSeason(seasonObj.text)}</a>`
                : `<span class="season-text">${escSeason(seasonObj.text)}</span>`;
              html += `<li class="season-header" style="--season-color: ${seasonObj.color};">
                        ${seasonTextHtml}
                        <div class="season-line"></div>
                      </li>`;
              html += groups[key].map(anime => createAnimeCard(anime, 'watching', seasonObj.color)).join('');
            });

            return html;
          }

          function renderAnnouncedList(data) {
            const watchingIdSet = new Set(watchingData.map(a => a.id));
            const watchedList = [];
            const watchingList = [];
            const planningList = [];

            data.forEach(anime => {
              if (watchingIdSet.has(anime.id)) {
                watchingList.push(anime);
              } else if (planIds.has(anime.id)) {
                planningList.push(anime);
              } else {
                watchedList.push(anime);
              }
            });

            let html = '';

            if (watchedList.length) {
              const g = ANNOUNCED_GROUP_LABELS.watched;
              html += `<li class="season-header" style="--season-color: ${g.color};">
                        <span class="season-text">${g.text}</span>
                        <div class="season-line"></div>
                      </li>`;
              html += watchedList.map(anime => createAnimeCard(anime, 'announced', g.color)).join('');
            }

            if (watchingList.length) {
              const g = ANNOUNCED_GROUP_LABELS.watching;
              html += `<li class="season-header" style="--season-color: ${g.color};">
                        <span class="season-text">${g.text}</span>
                        <div class="season-line"></div>
                      </li>`;
              html += watchingList.map(anime => createAnimeCard(anime, 'announced-unwatched', g.color)).join('');
            }

            if (planningList.length) {
              const g = ANNOUNCED_GROUP_LABELS.planning;
              html += `<li class="season-header" style="--season-color: ${g.color};">
                        <span class="season-text">${g.text}</span>
                        <div class="season-line"></div>
                      </li>`;
              html += planningList.map(anime => createAnimeCard(anime, 'announced-unwatched', g.color)).join('');
            }

            return html;
          }

          // ── Card diferenciado da lista "Peak Episodes" ──
          // "rank" aqui já vem calculado com empate considerado (ex: 1, 1, 3 —
          // ver renderFavoriteEpisodesList), não é mais o índice puro do array.
          function createFavoriteEpisodeCard(ep, rank = null) {
            if (!ep) return '';

            const topRankClass = rank === 1 ? ' rank-gold'
              : rank === 2 ? ' rank-silver'
              : rank === 3 ? ' rank-bronze'
              : '';

            // Galeria de imagens do carrossel: usa "ep.images" (array) se existir,
            // senão cai pra imagem única "ep.img". Com 2+ imagens, mostra as
            // mini-thumbnails com setas de navegação; com 1 só, mostra a imagem
            // grande sem carrossel.
            const gallery = Array.isArray(ep.images) && ep.images.length
              ? ep.images
              : (ep.img ? [ep.img] : []);
            const hasGallery = gallery.length > 1;
            const galleryAttr = hasGallery
              ? ` data-gallery='${JSON.stringify(gallery).replace(/'/g, "&apos;")}'`
              : '';

            // Índice inicial do carrossel: só marcamos uma miniatura como ativa
            // se a imagem grande (ep.img, ou gallery[0] na ausência dele) for
            // de fato uma das imagens do array "gallery". Muitas vezes ep.img é
            // uma capa/arte que não está entre as miniaturas — nesse caso nenhuma
            // fica marcada como selecionada até o usuário clicar numa.
            const initialSrc = ep.img || gallery[0] || '';
            const initialIndex = gallery.indexOf(initialSrc);

            const thumbsHtml = hasGallery
              ? gallery.map((src, i) => `
                    <button type="button" class="fav-ep-thumb${i === initialIndex ? ' is-active' : ''}" data-index="${i}" aria-label="Ver imagem ${i + 1}">
                      <img src="${src}" alt="" loading="lazy" decoding="async">
                    </button>`).join('')
              : '';

            const thumbnavHtml = hasGallery ? `
                  <div class="fav-ep-thumbnav">
                    <button type="button" class="fav-ep-thumbnav-arrow fav-ep-thumbnav-prev" aria-label="Imagem anterior">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
                    </button>
                    <div class="fav-ep-thumbstrip">${thumbsHtml}</div>
                    <button type="button" class="fav-ep-thumbnav-arrow fav-ep-thumbnav-next" aria-label="Próxima imagem">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
                    </button>
                  </div>` : '';

            // Contador "posição atual/total" sobreposto no canto da imagem grande,
            // ex: "1/5". Só aparece quando há um carrossel de fato (2+ imagens).
            const counterHtml = hasGallery
              ? `<span class="fav-ep-counter">${(initialIndex === -1 ? 1 : initialIndex + 1)}/${gallery.length}</span>`
              : '';

            // Selo de nota estilo IMDb — só aparece se "ep.rating" for definido.
            // Se "ep.imdbUrl" existir, o selo vira um link pra página do episódio no IMDb.
            const ratingInner = `<span class="fav-ep-rating-source">IMDb</span>
                  <span class="fav-ep-rating-value">${ep.rating}<span class="fav-ep-rating-max">/10</span></span>`;
            const ratingHtml = (ep.rating !== undefined && ep.rating !== null && ep.rating !== '')
              ? (ep.imdbUrl
                  ? `<a class="fav-ep-rating" href="${ep.imdbUrl}" target="_blank" rel="noopener">${ratingInner}</a>`
                  : `<div class="fav-ep-rating">${ratingInner}</div>`)
              : '';

            // MNP = Minha Nota Pessoal
            // Selo com a nota pessoal (minha nota), sempre em /10, exibido antes do selo do IMDb.
            const myRatingHtml = (ep.myRating !== undefined && ep.myRating !== null && ep.myRating !== '')
              ? `<div class="fav-ep-my-rating">
                  <span class="fav-ep-my-rating-source">MNP</span>
                  <span class="fav-ep-my-rating-value">${ep.myRating}<span class="fav-ep-my-rating-max">/10</span></span>
                </div>`
              : '';

            // Botão do Crunchyroll, ao lado do selo do IMDb: no PC é só a logo,
            // no mobile a logo vem acompanhada do ícone de link externo (ver
            // CSS .fav-ep-crunchyroll-btn, que já cuida de esconder o svg no PC).
            const crunchyrollHtml = ep.crunchyrollUrl
              ? `<a class="fav-ep-crunchyroll-btn" href="${ep.crunchyrollUrl}" target="_blank" rel="noopener">
                  <img class="fav-ep-crunchyroll-logo" src="assets/credits-webp/crunchyroll.webp" alt="Crunchyroll" loading="lazy" decoding="async">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path></svg>
                </a>`
              : '';

            // Monta a linha de selos na ordem MNP -> IMDb -> Crunchyroll, sem separador "//" entre eles.
            const ratingRowParts = [myRatingHtml, ratingHtml, crunchyrollHtml].filter(Boolean);
            const ratingRowHtml = ratingRowParts.length
              ? `<div class="fav-ep-rating-row">${ratingRowParts.join('')}</div>`
              : '';

            return `
              <li class="fav-ep-card${topRankClass}" id="${ep.id || ''}"${galleryAttr} style="--item-hover-color: #3b82f6;">
                <div class="fav-ep-ambient" aria-hidden="true"></div>
                <div class="fav-ep-ambient-shade" aria-hidden="true"></div>
                <div class="rank-wrap">
                  <span class="rank rank-fixed" aria-hidden="true">${rank != null ? rank : ''}</span>
                </div>
                <div class="fav-ep-media">
                  <div class="poster-wrap fav-ep-media-main">
                    <img class="thumb fav-ep-main-img" data-src="${ep.img || gallery[0] || ''}" alt="${ep.anime || ''} - ${ep.episodeLabel || ''}" decoding="async">
                    <div class="poster-fallback" aria-hidden="true"></div>
                    ${counterHtml}
                  </div>
                  ${thumbnavHtml}
                </div>
                <div class="fav-ep-content">
                  <div class="fav-ep-heading">
                    <h3 class="fav-ep-anime">${ep.anime || ''}</h3>
                    <span class="fav-ep-episode">${ep.episodeLabel || ''}</span>
                  </div>
                  ${ratingRowHtml}
                  <p class="fav-ep-note">${ep.note ? `<span class="fav-ep-quote-mark" aria-hidden="true">&ldquo;</span>${ep.note}<span class="fav-ep-quote-mark fav-ep-quote-mark-end" aria-hidden="true">&rdquo;</span>` : ''}</p>
                </div>
              </li>
            `;
          }

          // Calcula a posição de cada episódio levando em conta empate de MNP
          // (minha nota pessoal): quando dois episódios seguidos têm a mesma
          // MNP, os dois recebem a mesma posição (ex: os dois em "#1"), e o
          // próximo episódio com nota diferente pula pra posição real dele
          // (ex: "#3", nunca "#2") — é o chamado ranking "1224".
          // Presume que "data" já está ordenado da maior MNP pra menor.
          function computeFavEpisodeRanks(data) {
            const ranks = [];
            let lastRating = null;
            let lastRank = 0;
            data.forEach((ep, idx) => {
              const rating = (ep.myRating !== undefined && ep.myRating !== null && ep.myRating !== '')
                ? ep.myRating
                : null;
              if (rating !== null && rating === lastRating) {
                ranks.push(lastRank);
              } else {
                const rank = idx + 1;
                ranks.push(rank);
                lastRank = rank;
                lastRating = rating;
              }
            });
            return ranks;
          }

          function renderFavoriteEpisodesList(data) {
            if (!data.length) {
              return `<li class="fav-ep-empty">
                Nenhum episódio favorito adicionado ainda.<br>
                Abra o <code>index.html</code> no VSCode e preencha o array
                <code>favoriteEpisodesData</code> com os seus.
              </li>`;
            }
            const ranks = computeFavEpisodeRanks(data);
            return data.map((ep, idx) => createFavoriteEpisodeCard(ep, ranks[idx])).join('');
          }


          // ── Carrossel de mini-thumbnails do card de episódio favorito ──
          // Troca a imagem grande ao clicar nas setas ‹ › ou numa das thumbnails,
          // sem disparar o clique do card (que abre o link em outra aba).
          function attachFavEpisodeGalleryControls() {
            document.querySelectorAll('.fav-ep-card[data-gallery]').forEach(card => {
              if (card.dataset._galleryAttached === '1') return;
              card.dataset._galleryAttached = '1';

              let gallery = [];
              try { gallery = JSON.parse(card.getAttribute('data-gallery')); } catch (e) {}
              if (!Array.isArray(gallery) || gallery.length < 2) return;

              const mainImg = card.querySelector('.fav-ep-main-img');
              const counterEl = card.querySelector('.fav-ep-counter');
              const thumbs = Array.from(card.querySelectorAll('.fav-ep-thumb'));
              const thumbstrip = card.querySelector('.fav-ep-thumbstrip');
              const ambient = card.querySelector('.fav-ep-ambient');
              const activeIdx = thumbs.findIndex(t => t.classList.contains('is-active'));
              // -1 quando nenhuma thumb começa ativa (capa não faz parte da
              // galeria): assim a 1ª clicada em "próxima" cai no índice 0, e em
              // "anterior" cai na última — em vez de pular a 2ª imagem.
              let index = activeIdx;

              // Guarda a imagem "comprometida" (a que fica de fato selecionada,
              // por clique ou pela capa inicial) pra poder voltar pra ela quando
              // o mouse sai de uma miniatura, depois de um hover de preview.
              let committedSrc = mainImg ? mainImg.getAttribute('data-src') : '';

              // Troca o wallpaper borrado do card pra imagem em questão. Como as
              // imagens da galeria já estão em cache (thumbs carregadas antes),
              // não precisa esperar nenhum "load" pra aplicar o efeito.
              function setAmbient(src) {
                if (ambient && src) ambient.style.backgroundImage = `url("${src}")`;
              }

              function goTo(i) {
                index = ((i % gallery.length) + gallery.length) % gallery.length;
                committedSrc = gallery[index];
                if (mainImg) mainImg.src = committedSrc;
                setAmbient(committedSrc);
                if (counterEl) counterEl.textContent = `${index + 1}/${gallery.length}`;
                thumbs.forEach((t, idx) => t.classList.toggle('is-active', idx === index));

                // Desliza a tira suavemente até a miniatura ativa quando ela
                // estiver fora da área visível, criando o efeito de carrossel.
                const activeThumb = thumbs[index];
                if (activeThumb && thumbstrip) {
                  activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                }
              }

              thumbs.forEach((t, idx) => {
                t.addEventListener('click', (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  goTo(idx);
                });

                // Preview ao passar o mouse: só troca a <img> grande, sem mexer
                // no índice/seleção nem na miniatura marcada como ativa.
                t.addEventListener('mouseenter', () => {
                  if (mainImg) mainImg.src = gallery[idx];
                  setAmbient(gallery[idx]);
                });
                t.addEventListener('mouseleave', () => {
                  if (mainImg) mainImg.src = committedSrc;
                  setAmbient(committedSrc);
                });
              });

              const prevBtn = card.querySelector('.fav-ep-thumbnav-prev');
              const nextBtn = card.querySelector('.fav-ep-thumbnav-next');
              if (prevBtn) prevBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); goTo(index - 1); });
              if (nextBtn) nextBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); goTo(index + 1); });

              // ── Swipe (arrastar o dedo) na imagem grande — mobile ──
              // Arrastar pra esquerda avança pra próxima imagem, pra direita
              // volta pra anterior, igual às setas ‹ ›.
              const mediaMain = card.querySelector('.fav-ep-media-main');
              if (mediaMain) {
                const SWIPE_MIN_DISTANCE = 40;   // px mínimos no eixo X
                const SWIPE_MAX_OFF_AXIS = 60;   // tolerância no eixo Y
                const SWIPE_MAX_TIME = 600;      // ms
                let touchStartX = 0;
                let touchStartY = 0;
                let touchStartTime = 0;
                let touching = false;

                mediaMain.addEventListener('touchstart', (e) => {
                  if (e.touches.length !== 1) return;
                  touchStartX = e.touches[0].clientX;
                  touchStartY = e.touches[0].clientY;
                  touchStartTime = Date.now();
                  touching = true;
                }, { passive: true });

                mediaMain.addEventListener('touchend', (e) => {
                  if (!touching) return;
                  touching = false;

                  const touch = e.changedTouches[0];
                  const dx = touch.clientX - touchStartX;
                  const dy = touch.clientY - touchStartY;
                  const dt = Date.now() - touchStartTime;

                  if (dt > SWIPE_MAX_TIME) return;
                  if (Math.abs(dy) > SWIPE_MAX_OFF_AXIS) return;
                  if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return;

                  e.preventDefault();
                  e.stopPropagation();

                  if (dx < 0) {
                    goTo(index + 1); // arrastou pra esquerda = próxima imagem
                  } else {
                    goTo(index - 1); // arrastou pra direita = imagem anterior
                  }
                });
              }
            });

            sizeAllFavEpThumbstrips();
          }

          // Trava a largura do carrossel de mini-thumbnails para caber SOMENTE
          // miniaturas inteiras — nunca deixa uma parcialmente cortada na borda.
          // Recalcula quantas thumbs (92px + 7px de gap, ou 62px no mobile) cabem
          // no espaço disponível e limita a largura do container a esse valor
          // exato, escondendo (via overflow) qualquer sobra incompleta.
          function sizeFavEpThumbstrip(strip) {
            const thumbs = strip.querySelectorAll('.fav-ep-thumb');
            if (thumbs.length < 2) return;

            // Libera a largura antes de medir, senão uma restrição aplicada
            // numa medição anterior distorceria a próxima leitura.
            strip.style.maxWidth = 'none';
            void strip.offsetWidth; // força reflow

            const thumbWidth = thumbs[0].getBoundingClientRect().width;
            const available = strip.clientWidth;
            if (!thumbWidth || !available) return;

            const cs = getComputedStyle(strip);
            const gap = parseFloat(cs.columnGap) || parseFloat(cs.gap) || 7;

            const count = Math.max(1, Math.floor((available + gap) / (thumbWidth + gap)));
            const exactWidth = count * thumbWidth + Math.max(0, count - 1) * gap;
            strip.style.maxWidth = exactWidth + 'px';
          }

          function sizeAllFavEpThumbstrips() {
            document.querySelectorAll('.fav-ep-thumbstrip').forEach(sizeFavEpThumbstrip);
          }

          let __favEpResizeTO = null;
          window.addEventListener('resize', () => {
            clearTimeout(__favEpResizeTO);
            __favEpResizeTO = setTimeout(sizeAllFavEpThumbstrips, 150);
          }, { passive: true });

          // ── "Watched This Month" — lista separada (dentro de MyLists) com um
          // carrossel horizontal por mês, estilo "Assistidos" da Crunchyroll.
          // Os dados vêm de "watchedMonthlyData" (definido no info.js). Modo
          // simples: não usa o sistema de card/lightbox do resto do site — só
          // pôster, título, tags e (opcional) link externo. ──
          //
          // Existe uma função escapeHtml em outro escopo do arquivo (fora do
          // alcance daqui), então precisamos da nossa própria cópia local
          // (mesmo motivo documentado em outros trechos do script).
          function escapeHtmlWatchedMonth(str) {
            return String(str == null ? '' : str)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
          }

          // Detecta um algarismo romano (I, II, III, IV...) no final de textos
          // tipo "4ª Temporada I" e envolve só ele numa span em Times New Roman,
          // deixando o resto do texto na fonte normal.
          function formatSeasonLabelWatchedMonth(str) {
            const escaped = escapeHtmlWatchedMonth(str);
            return escaped.replace(/\b([IVXLCDM]+)$/, '<span style="font-family: \'Times New Roman\', Times, serif;">$1</span>');
          }

          // Lookup usado pelo preview de hover estilo Crunchyroll.
          // IMPORTANTE: não pode ser indexado pelo "id" do anime, porque o
          // mesmo id se repete em várias entradas (cada temporada/filme do
          // mesmo anime usa o mesmo id, só mudando title/synopsis/episodes).
          // Se a chave fosse o id, cada card novo sobrescreveria os dados do
          // card anterior com o mesmo id, e todos os cards daquele anime
          // acabariam mostrando o preview do último renderizado. Por isso
          // usamos uma chave sequencial única por card (data-preview-key)
          // só para o preview; o data-anime-id original continua existindo
          // à parte, para a navegação por categoria (que precisa do id
          // compartilhado mesmo).
          const watchedMonthPreviewLookup = {};
          let watchedMonthPreviewSeq = 0;

          function renderWatchedMonthCard(anime) {
            const escapeHtml = escapeHtmlWatchedMonth;
            const ns = (typeof nextSeasonMap !== 'undefined') ? nextSeasonMap[anime.id] : null;
            let stripHtml = '';
            if (ns && ns.info) {
              const nsLines = String(ns.info).split(/<\/br>|<br\s*\/?>/i).map(s => s.trim()).filter(Boolean);
              const isMulti = nsLines.length > 1;
              stripHtml = `
                  <div class="announce-strip"${isMulti ? ` data-lines='${JSON.stringify(nsLines).replace(/'/g, "&apos;")}'` : ''}>
                    <div class="announce-track"><span class="announce-line">${nsLines[0]}</span></div>
                  </div>`;
            }
            let cardBadgeHtml = '';
            if (anime.badge) {
              const badgeMatch = String(anime.badge).match(/^(\S+)\s+(.*)$/);
              const badgeIcon = badgeMatch ? badgeMatch[1] : '';
              const badgeText = badgeMatch ? badgeMatch[2] : anime.badge;
              const iconHtml = badgeIcon ? `<span class="watched-month-card-badge-icon">${escapeHtml(badgeIcon)}</span>` : '';
              cardBadgeHtml = `<div class="watched-month-card-badge">${iconHtml}<span class="watched-month-card-badge-text">${escapeHtml(badgeText)}</span></div>`;
            }
            const inner = `
              <div class="watched-month-card-badge-slot">${cardBadgeHtml}</div>
              <div class="watched-month-card-poster">
                <img src="${escapeHtml(anime.img)}" alt="${escapeHtml(anime.title)}" loading="lazy">
                ${stripHtml}
              </div>
              <div class="watched-month-card-title">${escapeHtml(anime.title)}</div>
            `;
            const previewKey = `wm${watchedMonthPreviewSeq++}`;
            watchedMonthPreviewLookup[previewKey] = anime;
            const idAttr = anime.id ? ` data-anime-id="${escapeHtml(anime.id)}"` : '';
            const previewKeyAttr = ` data-preview-key="${previewKey}"`;
            return anime.url
              ? `<a class="watched-month-card"${idAttr}${previewKeyAttr} href="${escapeHtml(anime.url)}" target="_blank" rel="noopener">${inner}</a>`
              : `<div class="watched-month-card"${idAttr}${previewKeyAttr}>${inner}</div>`;
          }

          // ── Preview flutuante ao passar o mouse (estilo Crunchyroll), sem nota
          // e sem os botões (play/salvar/+) — só pôster, título, temporadas/
          // episódios (se definidos em info.js) e sinopse (se definida). ──
          let watchedMonthPreviewEl = null;
          let watchedMonthPreviewHideTimer = null;
          let watchedMonthActiveCard = null;
          let watchedMonthActiveCarousel = null;
          // Enquanto a página rola com o mouse parado, o navegador recalcula
          // qual elemento está "sob o cursor" e dispara mouseenter/mouseleave
          // sintéticos pros cards que passam por baixo dele — o que fazia o
          // preview trocar de anime (ou até piscar) sozinho s recalcular
          // durante o scroll. Enquanto watchedMonthSuppressHoverUntil (um
          // timestamp) não passar, ignoramos esses eventos de hover vindos
          // dos cards, mantendo o preview grudado no card que o usuário
          // realmente colocou o mouse em cima. Esses eventos sintéticos são
          // ignorados; só reposicionamos (ver scroll listener mais abaixo).
          let watchedMonthSuppressHoverUntil = 0;
          function watchedMonthMarkScrolling() {
            watchedMonthSuppressHoverUntil = Date.now() + 250;
          }

          // Diferencia um "mouseenter" de verdade (o usuário moveu o cursor
          // até o card) de um sintético (disparado pelo navegador quando o
          // conteúdo rola por baixo do cursor PARADO). Sem isso, a janela de
          // supressão acima (250ms após qualquer scroll) também engolia
          // hovers genuínos — por exemplo, rolar a página até o carrossel e
          // já ir passando o mouse num card em seguida, o caso mais comum de
          // uso, ficava sem preview instantâneo até tirar e recolocar o
          // mouse. Um "mousemove" real só existe quando o cursor de fato se
          // deslocou; scroll por wheel/teclado/barra não dispara isso.
          let watchedMonthLastRealMouseMoveTs = 0;
          document.addEventListener('mousemove', () => {
            watchedMonthLastRealMouseMoveTs = Date.now();
          }, { passive: true });
          function watchedMonthIsSyntheticHover() {
            if (Date.now() >= watchedMonthSuppressHoverUntil) return false;
            // Passou pouquíssimo tempo desde um movimento real do mouse ->
            // é um hover genuíno acontecendo durante/logo após o scroll,
            // não um recálculo do navegador com o cursor parado.
            return (Date.now() - watchedMonthLastRealMouseMoveTs) > 50;
          }

          function getWatchedMonthPreviewEl() {
            if (watchedMonthPreviewEl) return watchedMonthPreviewEl;
            const el = document.createElement('a');
            el.className = 'watched-month-preview';
            el.innerHTML = `
              <img class="watched-month-preview-img" alt="">
              <div class="watched-month-preview-overlay">
                <p class="watched-month-preview-title"></p>
                <p class="watched-month-preview-meta"></p>
                <p class="watched-month-preview-synopsis"></p>
                <div class="watched-month-preview-lists"></div>
              </div>
            `;
            document.body.appendChild(el);
            el.addEventListener('mouseenter', () => { clearTimeout(watchedMonthPreviewHideTimer); });
            el.addEventListener('mouseleave', hideWatchedMonthPreview);
            // O preview é position:fixed, solto direto no <body> (fora do
            // carrossel), então enquanto o mouse está sobre ele é ELE quem
            // recebe o evento de wheel — e como não tem altura própria pra
            // rolar, o navegador não acha um ancestral scrollável e a
            // página inteira trava (não dá pra rolar pra cima/baixo
            // enquanto o mouse estiver em cima de um card). Repassa o
            // delta manualmente pro scroll da página pra isso nunca travar.
            // Importante: quem realmente rola aqui é o <body> (ele tem
            // overflow-y: auto próprio), não a window/<html> — por isso
            // usamos document.body.scrollBy e não window.scrollBy, que não
            // tinha efeito nenhum nesse layout.
            el.addEventListener('wheel', (e) => {
              // e.deltaY vem em unidades diferentes dependendo do
              // deltaMode do evento: 0 = pixels (a maioria dos trackpads
              // e Chrome/Windows), 1 = linhas (comum em mouse comum no
              // Firefox — cada "clique" da rodinha reporta só ~3), 2 =
              // página inteira. Como repassamos o valor puro pro
              // scrollBy, no modo "linha" cada scroll do mouse só movia
              // ~3px, obrigando a girar a rodinha um monte pra descer —
              // por isso escalamos aqui pro equivalente em pixels antes
              // de repassar, igualando à sensação do scroll nativo.
              let dy = e.deltaY;
              if (e.deltaMode === 1) dy *= 16;
              else if (e.deltaMode === 2) dy *= window.innerHeight;
              document.body.scrollBy(0, dy);
              e.preventDefault();
            }, { passive: false });
            // Ícones de lista (canto inferior esquerdo) navegam pra categoria
            // correspondente em vez de abrir o link do anime — precisa
            // interceptar o clique antes que o <a> do preview atue.
            el.addEventListener('click', (e) => {
              const iconBtn = e.target.closest('.watched-month-preview-list-icon');
              if (!iconBtn) return;
              e.preventDefault();
              e.stopPropagation();
              const mode = iconBtn.dataset.listMode;
              const animeId = watchedMonthActiveCard ? watchedMonthActiveCard.dataset.animeId : null;
              el.classList.remove('is-visible');
              if (watchedMonthActiveCard) {
                watchedMonthActiveCard.classList.remove('is-previewing');
                watchedMonthActiveCard = null;
              }
              if (watchedMonthActiveCarousel) {
                watchedMonthActiveCarousel.classList.remove('has-preview');
                watchedMonthActiveCarousel = null;
              }
              if (mode && animeId) navigateToAnimeInCategory(animeId, mode);
            });
            watchedMonthPreviewEl = el;
            return el;
          }

          // Mapa de listas/categorias -> ícone e cor, reaproveitando os
          // mesmos SVGs e cores usados nos itens do drawer, pra manter a
          // identidade visual consistente entre o menu e os ícones do
          // preview do "Month by Month".
          const WATCHED_MONTH_LIST_META = {
            all: {
              label: 'All Animes',
              color: '#e2e8f0',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>'
            },
            romance: {
              label: 'Romance Anime',
              color: '#f472b6',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>'
            },
            isekai: {
              label: 'Isekai Anime',
              color: '#a78bfa',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>'
            },
            sports: {
              label: 'Sport Anime',
              color: '#facc15',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path><path d="M7 4H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4"></path><path d="M17 4h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"></path></svg>'
            },
            mecha: {
              label: 'Mecha/Cyberpunk',
              color: '#38bdf8',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"></path><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>'
            },
            watching: {
              label: 'Watching Now',
              color: '#2dd4bf',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>'
            },
            plan: {
              label: 'Plan to Watch',
              color: '#f59e0b',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="m9 15 2 2 4-4"></path></svg>'
            },
            announced: {
              label: 'Announced Sequels',
              color: '#34d399',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>'
            },
            favEpisodes: {
              label: 'Peak Episodes',
              color: '#3b82f6',
              icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M12 18v3"></path></svg>'
            }
          };

          // Descobre em quais listas/categorias um anime (pelo id) aparece,
          // reaproveitando os mesmos arrays/sets que getFilteredData() usa
          // pra montar cada categoria. "trueCharacters" fica de fora de
          // propósito: os ids dessa lista são de personagens, não de anime,
          // e podem colidir por coincidência com ids da lista principal
          // (ver comentário perto de trueCharRankById), então não dá pra
          // confiar num match por id ali.
          function getWatchedMonthAnimeLists(id) {
            if (!id) return [];
            const modes = [];
            const inPlan = typeof planIds !== 'undefined' && planIds.has(id);
            const inAll = typeof animeData !== 'undefined' && animeData.some(a => a.id === id);
            if (inAll && !inPlan) modes.push('all');
            if (typeof romanceIds !== 'undefined' && romanceIds.includes(id) && !inPlan) modes.push('romance');
            if (typeof isekaiIds !== 'undefined' && isekaiIds.includes(id) && !inPlan) modes.push('isekai');
            if (typeof sportsIds !== 'undefined' && sportsIds.includes(id) && !inPlan) modes.push('sports');
            if (typeof mechaIds !== 'undefined' && mechaIds.includes(id) && !inPlan) modes.push('mecha');
            if (typeof watchingData !== 'undefined' && watchingData.some(a => a.id === id)) modes.push('watching');
            if (inPlan) modes.push('plan');
            if (typeof nextSeasonMap !== 'undefined' && nextSeasonMap[id]) modes.push('announced');
            if (typeof favoriteEpisodesData !== 'undefined' && favoriteEpisodesData.some(e => e.id === id)) modes.push('favEpisodes');
            return modes;
          }

          // Monta o label letra por letra: cada <span> ganha um transition-delay
          // crescente, criando o efeito de "digitação" surgindo da esquerda
          // pra direita quando o botão recebe hover/foco.
          function buildWatchedMonthLetterSpans(text) {
            return text.split('').map((ch, i) => {
              const delay = (i * 26) + 'ms';
              const safeCh = ch === ' ' ? '&nbsp;' : ch;
              return `<span class="letter" style="transition-delay:${delay}">${safeCh}</span>`;
            }).join('');
          }

          // Categorias de "MyRanks" onde faz sentido mostrar a posição do
          // anime dentro da lista (ex: "#3 Romance Anime"). As demais
          // (Watching Now, Plan to Watch, Announced Sequels) não são listas
          // ordenadas por ranking, então ficam sem número — mesma convenção
          // já usada em getMembershipTags/RANK_POSITION_KEYS.
          const WATCHED_MONTH_RANK_MODES = new Set(['all', 'romance', 'isekai', 'sports', 'mecha']);

          function getWatchedMonthListPosition(mode, animeId) {
            if (WATCHED_MONTH_RANK_MODES.has(mode)) {
              const list = (typeof getFilteredData === 'function') ? getFilteredData(mode) : [];
              const idx = list.findIndex(a => a.id === animeId);
              return idx === -1 ? null : idx + 1;
            }
            if (mode === 'favEpisodes' && typeof favoriteEpisodesData !== 'undefined') {
              const favIdx = favoriteEpisodesData.findIndex(e => e.id === animeId);
              if (favIdx === -1) return null;
              return (typeof computeFavEpisodeRanks === 'function')
                ? computeFavEpisodeRanks(favoriteEpisodesData)[favIdx]
                : favIdx + 1;
            }
            return null;
          }

          function renderWatchedMonthPreviewLists(el, anime) {
            const wrap = el.querySelector('.watched-month-preview-lists');
            if (!wrap) return;
            const modes = getWatchedMonthAnimeLists(anime.id);
            wrap.innerHTML = modes.map((mode) => {
              const meta = WATCHED_MONTH_LIST_META[mode];
              if (!meta) return '';
              const position = getWatchedMonthListPosition(mode, anime.id);
              const labelText = position != null ? `#${position} ${meta.label}` : meta.label;
              return `<button type="button" class="watched-month-preview-list-icon" data-list-mode="${mode}" style="--list-color: ${meta.color};" aria-label="${labelText}"><span class="wml-icon">${meta.icon}</span><span class="wml-label-wrap"><span class="wml-label">${buildWatchedMonthLetterSpans(labelText)}</span></span></button>`;
            }).join('');
          }

          function positionWatchedMonthPreview(card) {
            const el = getWatchedMonthPreviewEl();
            const cardRect = card.getBoundingClientRect();
            // O preview cobre só do pôster pra baixo (poster + título) — o
            // slot do badge (ex.: "ASSISTIDO EM 1 DIA") fica ACIMA dessa
            // área e continua visível por cima do preview, em vez de ser
            // coberto junto com o resto do card.
            const posterEl = card.querySelector('.watched-month-card-poster');
            const posterRect = posterEl ? posterEl.getBoundingClientRect() : cardRect;
            const height = cardRect.bottom - posterRect.top;
            // Mesmo tamanho e posição exatos do pôster do card — o preview só
            // sobrepõe um gradiente + texto em cima da própria arte, sem
            // aumentar nem esticar o card.
            // Cobre um pouco além do card (arredondamento + qualquer resíduo
            // de layout) pra garantir que nada do título/tags original apareça.
            el.style.width = `${Math.ceil(posterRect.width) + 4}px`;
            el.style.height = `${Math.ceil(height) + 8}px`;
            el.style.left = `${Math.floor(posterRect.left) - 2}px`;
            el.style.top = `${Math.floor(posterRect.top) - 2}px`;
          }

          // Enquanto tem um preview aberto, mantém a posição sincronizada com
          // o card via requestAnimationFrame em vez de depender só do evento
          // "scroll". O evento "scroll" pode disparar um pouco depois da
          // repintura real do navegador durante rolagens rápidas — nesse
          // intervalo o preview (position:fixed) fica alguns pixels
          // desalinhado do pôster de verdade por trás dele, e como o overlay
          // com blur só cobre a área do preview, sobra uma fina tira da
          // imagem original (sem blur) aparecendo na borda. Repetir o
          // reposicionamento a cada frame elimina esse atraso.
          let watchedMonthRafId = null;
          // Timestamp do último evento de scroll real enquanto um preview
          // está ativo. O sync loop (abaixo) só continua rodando enquanto
          // esse timestamp for recente — ou seja, só enquanto a página
          // está de fato rolando. Antes ele rodava pra sempre (a cada
          // frame, 60x/s) só por ter um preview aberto, mesmo com o mouse
          // parado, recalculando getBoundingClientRect + reescrevendo
          // left/top/width/height do preview (que tem backdrop-filter,
          // caro de repintar). Isso somava trabalho em cima do scroll da
          // página e deixava a rolagem pesada sempre que um card estava
          // em hover. Agora o loop se autoencerra ~120ms depois do último
          // scroll e só é reativado quando um novo scroll acontece.
          let watchedMonthLastScrollTs = 0;

          function watchedMonthSyncLoop() {
            if (!watchedMonthActiveCard) {
              watchedMonthRafId = null;
              return;
            }
            const rect = watchedMonthActiveCard.getBoundingClientRect();
            const viewportH = window.innerHeight || document.documentElement.clientHeight;
            if (rect.bottom <= 0 || rect.top >= viewportH) {
              hideWatchedMonthPreviewNow();
              return;
            }
            positionWatchedMonthPreview(watchedMonthActiveCard);
            if (Date.now() - watchedMonthLastScrollTs < 120) {
              watchedMonthRafId = requestAnimationFrame(watchedMonthSyncLoop);
            } else {
              watchedMonthRafId = null;
            }
          }

          function watchedMonthStartSyncLoop() {
            if (watchedMonthRafId != null) return;
            watchedMonthRafId = requestAnimationFrame(watchedMonthSyncLoop);
          }

          function watchedMonthStopSyncLoop() {
            if (watchedMonthRafId != null) {
              cancelAnimationFrame(watchedMonthRafId);
              watchedMonthRafId = null;
            }
          }

          function showWatchedMonthPreview(card) {
            const anime = watchedMonthPreviewLookup[card.dataset.previewKey];
            if (!anime) return;
            clearTimeout(watchedMonthPreviewHideTimer);
            if (watchedMonthActiveCard && watchedMonthActiveCard !== card) {
              watchedMonthActiveCard.classList.remove('is-previewing');
            }
            card.classList.add('is-previewing');
            watchedMonthActiveCard = card;

            // O preview fica em position:fixed fora do carrossel (ver
            // getWatchedMonthPreviewEl), então enquanto o mouse está sobre ele
            // o CSS :hover do .watched-month-carousel se perde (o preview não
            // é descendente dele no DOM) e as setas somem. Marca manualmente
            // o carrossel correspondente pra manter as setas visíveis.
            const carouselEl = card.closest('.watched-month-carousel');
            if (watchedMonthActiveCarousel && watchedMonthActiveCarousel !== carouselEl) {
              watchedMonthActiveCarousel.classList.remove('has-preview');
            }
            if (carouselEl) carouselEl.classList.add('has-preview');
            watchedMonthActiveCarousel = carouselEl;

            const el = getWatchedMonthPreviewEl();
            if (anime.url) el.href = anime.url; else el.removeAttribute('href');
            const imgEl = el.querySelector('.watched-month-preview-img');
            imgEl.src = anime.img || '';
            imgEl.alt = anime.title || '';
            el.querySelector('.watched-month-preview-title').textContent = anime.title || '';

            const metaParts = [];
            if (anime.seasonLabel) metaParts.push({ html: formatSeasonLabelWatchedMonth(anime.seasonLabel) });
            else if (anime.seasons) metaParts.push({ html: escapeHtmlWatchedMonth(`${anime.seasons} Temporada${anime.seasons == 1 ? '' : 's'}`) });
            if (anime.episodes != null && anime.episodes !== '') {
              // "episodes" pode ser um número de episódios (série) ou uma
              // duração tipo "1h25m" (filme) — só quando é número mesmo é
              // que faz sentido colar o sufixo "Episódio(s)".
              const isNumericEpisodes = typeof anime.episodes === 'number';
              const episodesText = isNumericEpisodes
                ? `${anime.episodes} episódio${anime.episodes === 1 ? '' : 's'}`
                : `${anime.episodes}`;
              metaParts.push({ html: escapeHtmlWatchedMonth(episodesText) });
            }
            const metaEl = el.querySelector('.watched-month-preview-meta');
            metaEl.innerHTML = metaParts.length
              ? `<span class="watched-month-preview-meta-badge">${metaParts.map(part => part.html).join(': ')}</span>`
              : '';
            metaEl.style.display = metaParts.length ? '' : 'none';

            // Badge (ex.: "ASSISTIDO EM 1 DIA") não é mais duplicado aqui
            // dentro do preview flutuante — ele já aparece acima do card
            // (slot fixo, ver .watched-month-card-badge-slot) e continua
            // visível mesmo durante o preview, então repetir aqui embaixo
            // (com fundo/borda) seria redundante.

            const synopsisEl = el.querySelector('.watched-month-preview-synopsis');
            synopsisEl.textContent = anime.synopsis || '';
            synopsisEl.style.display = anime.synopsis ? '' : 'none';

            renderWatchedMonthPreviewLists(el, anime);

            positionWatchedMonthPreview(card);
            el.classList.add('is-visible');
            watchedMonthStartSyncLoop();
          }

          function hideWatchedMonthPreviewNow() {
            clearTimeout(watchedMonthPreviewHideTimer);
            watchedMonthStopSyncLoop();
            if (watchedMonthPreviewEl) watchedMonthPreviewEl.classList.remove('is-visible');
            if (watchedMonthActiveCard) {
              watchedMonthActiveCard.classList.remove('is-previewing');
              watchedMonthActiveCard = null;
            }
            if (watchedMonthActiveCarousel) {
              watchedMonthActiveCarousel.classList.remove('has-preview');
              watchedMonthActiveCarousel = null;
            }
          }

          function hideWatchedMonthPreview() {
            watchedMonthPreviewHideTimer = setTimeout(hideWatchedMonthPreviewNow, 60);
          }

          function initWatchedMonthPreviewHovers(wrap) {
            const hasHover = window.matchMedia('(hover: hover)').matches;
            wrap.querySelectorAll('.watched-month-card[data-preview-key]').forEach((card) => {
              if (hasHover) {
                card.addEventListener('mouseenter', () => {
                  if (watchedMonthIsSyntheticHover()) return;
                  showWatchedMonthPreview(card);
                });
                card.addEventListener('mouseleave', () => {
                  if (watchedMonthIsSyntheticHover()) return;
                  hideWatchedMonthPreview();
                });
              } else {
                // Touch: o 1º toque revela o preview (em vez de já navegar);
                // como o card já fica marcado "is-previewing" depois disso,
                // um 2º toque passa direto (sem preventDefault) e segue o
                // comportamento normal do link/card.
                card.addEventListener('click', (e) => {
                  if (!card.classList.contains('is-previewing')) {
                    e.preventDefault();
                    e.stopPropagation();
                    showWatchedMonthPreview(card);
                  }
                });
              }
            });
          }

          // Toque fora do card ativo ou do próprio preview fecha o preview
          // (equivalente ao mouseleave, que não existe em telas touch).
          document.addEventListener('click', (e) => {
            if (!watchedMonthActiveCard) return;
            if (e.target.closest('.watched-month-card') || e.target.closest('.watched-month-preview')) return;
            hideWatchedMonthPreview();
          });

          // O preview é position:fixed e sua posição é calculada a partir do
          // pôster (ver positionWatchedMonthPreview). Rolar a página verticalmente
          // move o card mas não atualiza o preview sozinho — ele "descolaria" do
          // pôster se nada fosse feito. Em vez de esconder o preview a cada
          // scroll (o que fazia ele sumir e reaparecer toda hora ao subir/descer),
          // aqui reposicionamos o preview pra seguir o card em tempo real,
          // mantendo-o aberto enquanto o usuário rola a página. Só escondemos de
          // fato quando o card sai completamente da área visível (rolou pra fora
          // da tela). Usa capture:true pra pegar o scroll de qualquer container
          // que role (o <body>, no layout atual, mas também cobre outros
          // possíveis containers scrolláveis).
          // Marca que a página está rolando pra suprimir hovers sintéticos
          // disparados pelos cards durante o scroll (ver
          // watchedMonthSuppressHoverUntil, no início do bloco de preview).
          // Reposicionar/esconder o preview em si já é feito continuamente
          // pelo loop de requestAnimationFrame (watchedMonthSyncLoop) acima.
          window.addEventListener('scroll', () => {
            if (!watchedMonthActiveCard) return;
            watchedMonthMarkScrolling();
            watchedMonthLastScrollTs = Date.now();
            watchedMonthStartSyncLoop();
          }, { passive: true, capture: true });

          // Se um card do carrossel (que é um <a>, focável) estiver com foco
          // de teclado — por ter sido clicado antes, tabulado, etc. — apertar
          // as setas ←/→ faz o navegador rolar o track HORIZONTALMENTE de
          // forma nativa (scroll-into-view do elemento focado), sem passar
          // pelo clique do botão de seta. Isso ainda dispara o evento
          // "scroll" do track (que já chama hideWatchedMonthPreviewNow via
          // o listener registrado em renderWatchedMonthPanel), só que o
          // preview (position:fixed, calculado a partir do card no momento
          // do hover) pode ficar visualmente "preso" na posição antiga por
          // um instante enquanto o navegador ainda está processando o
          // scroll nativo — e como o card rolado pode nem ser o mesmo que
          // está com o preview aberto (o foco pode estar em outro card, de
          // outra fileira/mês, diferente do que o mouse está sobre agora),
          // o preview antigo passa a sobrepor visualmente conteúdo de outra
          // lista. Pra evitar essa sobreposição, fecha o preview de
          // imediato assim que uma tecla de seta é pressionada, em vez de
          // esperar o evento de scroll resolver isso sozinho.
          document.addEventListener('keydown', (e) => {
            if (!watchedMonthActiveCard) return;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
              hideWatchedMonthPreviewNow();
            }
          }, { capture: true });

          function renderWatchedMonthSection(monthData, idx) {
            const rowId = `watchedMonthRow-${idx}`;
            const cards = (monthData.animes || []).map(renderWatchedMonthCard).join('');
            return `
              <section class="watched-month-section">
                <div class="watched-month-header">
                  <h2 class="watched-month-title">${escapeHtmlWatchedMonth(monthData.monthLabel || monthData.month || '')}</h2>
                  ${monthData.monthTheme ? `<p class="watched-month-theme">${escapeHtmlWatchedMonth(monthData.monthTheme)}</p>` : ''}
                </div>
                <div class="watched-month-carousel">
                  <button type="button" class="watched-month-arrow watched-month-arrow--prev" data-row="${rowId}" aria-label="Anterior">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
                  </button>
                  <div class="watched-month-track" id="${rowId}">${cards}</div>
                  <button type="button" class="watched-month-arrow watched-month-arrow--next" data-row="${rowId}" aria-label="Próximo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
                  </button>
                </div>
              </section>
            `;
          }

          // Atualiza as classes "at-start"/"at-end" do carrossel de acordo
          // com a posição atual do scroll — some a seta correspondente
          // quando não há mais pra onde rolar naquela direção.
          function updateWatchedMonthArrows(track) {
            const carousel = track.closest('.watched-month-carousel');
            if (!carousel) return;
            const maxScroll = track.scrollWidth - track.clientWidth;
            carousel.classList.toggle('at-start', track.scrollLeft <= 1);
            carousel.classList.toggle('at-end', track.scrollLeft >= maxScroll - 1);
          }

          // Ajusta o respiro do header (.watched-month-header) conforme os
          // cards que estão VISUALMENTE na frente da fileira no momento —
          // e não os 2 primeiros cards do mês em ordem de DOM (que é o que
          // um seletor CSS :nth-child(-n+2) enxergaria). Como o carrossel só
          // rola (não reordena o DOM), depois de usar as setas os cards que
          // ficam encostados no início do carrossel podem ser outros, e um
          // deles pode ter a badge (ex: "assistido em 1 dia") sem que os 2
          // primeiros do DOM tenham — por isso o cálculo precisa ser
          // dinâmico, refeito a cada scroll/resize.
          function updateWatchedMonthHeaderSpacing(track) {
            const section = track.closest('.watched-month-section');
