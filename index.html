<!doctype html>
    <html lang="pt-br">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width,initial-scale=1" />
      <title>myhtml</title>
      <link rel="shortcut icon" href="assets/icon-site.webp" type="image/x-icon">
      <link rel="manifest" href="manifest.json">
      <meta name="theme-color" content="#030303">
      <link rel="apple-touch-icon" href="assets/icon-192.png">
      <meta name="mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
      <meta name="apple-mobile-web-app-title" content="myhtml">
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      <style>
        :root{
          --bg: #030303;
          --page-base: #050505;
          --glow-1: rgba(226, 232, 240, 0.38);
          --glow-2: rgba(226, 232, 240, 0.24);
          --glow-3: rgba(226, 232, 240, 0.16);
          --drawer-glow-1: rgba(226, 232, 240, 0.5);
          --drawer-glow-2: rgba(226, 232, 240, 0.3);
          --drawer-glow-3: rgba(226, 232, 240, 0.22);
          --glow-accent: #cbd5e1;
          --surface: #0b0b0b;
          --text: #ffffff;
          --muted: #9ca3af;
          --low-priority: #4b5563;
          --font-title: 'Outfit', sans-serif;
          --drawer-w: 425px;
        }

        * { box-sizing: border-box; }

        ::selection {
          background: var(--glow-accent);
          color: #030303;
          text-shadow: none;
        }

        ::-moz-selection {
          background: var(--glow-accent);
          color: #030303;
          text-shadow: none;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; border: 2px solid var(--bg); }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        html{
          overflow-y: scroll;
          scrollbar-gutter: stable;
          scrollbar-width: thin;
          scrollbar-color: #333 var(--bg);
          overflow-x: hidden;
        }

        html,body{
          height:100%;
          margin:0;
          background: var(--page-base, #050505);
          color:var(--text);
          font-family: "Inter", sans-serif;
          -webkit-font-smoothing:antialiased;
          scroll-behavior: smooth;
          overflow-x: hidden;
          overflow-anchor: none;
          position: relative;
        }

        /* Fundo decorativo movido para um pseudo-elemento fixed próprio:
          assim o navegador compõe isso numa camada isolada e não precisa
          repintar o gradiente inteiro a cada frame de scroll (o que causava
          o travamento). */
        body::before {
          content: "";
          position: fixed;
          inset: 0;
          z-index: -1;
          pointer-events: none;
          background:
            radial-gradient(ellipse 120% 55% at 50% -5%, var(--glow-1), transparent 62%),
            radial-gradient(ellipse 90% 40% at 15% 0%, var(--glow-2), transparent 55%),
            radial-gradient(ellipse 90% 40% at 85% 0%, var(--glow-3), transparent 55%),
            var(--page-base, #050505);
          transition: background-color 0.4s ease;
          transform: translateZ(0);
          will-change: transform;
        }

        .wrap{
          max-width: 100%;
          margin: 40px auto;
          padding: 0 16px 0;
          position: relative;
        }

        header.page-header{
          display:flex;
          justify-content: space-between;
          align-items: center;
          gap: 20px;
          margin-bottom: 36px;
          position: relative;
          z-index: 100;
        }

        .header-content {
          display: flex;
          flex-direction: column;
          position: relative;
          cursor: default;
          text-transform: lowercase;
        }

        h1.title{
          margin:0;
          margin-bottom: 10px;
          font-size: 36px;
          font-weight:800;
          letter-spacing: -0.02em;
          line-height: 1.1;
          font-family: var(--font-title);
          transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
          background: linear-gradient(100deg, #ffffff 0%, #ffffff 55%, color-mix(in srgb, var(--glow-accent) 70%, #ffffff) 100%);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          position: relative;
          width: fit-content;
        }

        .subtitle {
          color: var(--muted);
          font-size: 12.5px;
          font-weight: 600;
          margin: 0;
          display: flex;
          align-items: center;
          gap: 8px;
          background: rgba(255,255,255,0.04);
          border: 1px solid rgba(255,255,255,0.08);
          padding: 6px 14px 6px 12px;
          border-radius: 999px;
          width: fit-content;
          letter-spacing: 0.1px;
          transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease;
          cursor: default;
        }

        .subtitle:hover {
          background: rgba(255,255,255,0.075);
          border-color: rgba(255,255,255,0.16);
          color: var(--text);
          transform: translateY(-1px);
        }

        .header-controls {
          display: flex;
          gap: 12px;
          align-items: center;
          flex-wrap: wrap;
          justify-content: flex-end;
          padding-bottom: 2px;
        }

        .filter-wrapper { position: relative; }

        /* ── Busca ── */
        .search-wrapper { position: relative; }

        /* ── Drawer de busca (agora vive como aba dentro do drawer único) ── */
        .search-drawer-input-wrap {
          padding: 10px 0 16px;
          border-bottom: 1px solid rgba(255,255,255,0.06);
          flex: 0 0 auto;
          position: relative;
        }

        /* Barra de pesquisa "foda": cartão de vidro com brilho interno sutil e,
          quando focada, um anel neon giratório na borda (gradiente cônico
          mascarado só na linha do contorno) + glow externo em camadas. */
        .search-drawer-input-wrap.dropdown-open {
          padding-bottom: 0;
          border-bottom-color: transparent;
        }

        .search-box-drawer {
          display: flex;
          align-items: center;
          gap: 10px;
          background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
          backdrop-filter: blur(40px) saturate(1.1);
          -webkit-backdrop-filter: blur(40px) saturate(1.1);
          border: 1px solid rgba(255,255,255,0.09);
          border-radius: 0;
          padding: 7px 14px;
          height: auto;
          position: relative;
          isolation: isolate;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 3px rgba(0,0,0,0.25);
          transition: border-color 0.35s ease, background 0.4s ease, box-shadow 0.35s ease, transform 0.35s ease;
        }

        @property --search-ring-angle {
          syntax: '<angle>';
          inherits: false;
          initial-value: 0deg;
        }

        .search-box-drawer::before {
          content: '';
          position: absolute;
          inset: -1px;
          border-radius: inherit;
          padding: 1px;
          background: var(--glow-accent);
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
          opacity: 0;
          transition: opacity 0.35s ease;
          pointer-events: none;
        }

        .search-box-drawer:focus-within {
          border-color: rgba(255,255,255,0.09);
          background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 3px rgba(0,0,0,0.25);
        }

        .search-box-drawer.has-value {
          border-color: rgba(255,255,255,0.09);
        }

        @media (prefers-reduced-motion: reduce) {
          .search-box-drawer:focus-within::before { opacity: 0.85; }
        }

        .search-box-drawer svg {
          width: 18px;
          height: 18px;
          flex: 0 0 18px;
          color: var(--muted);
          stroke-width: 2;
          transition: color 0.2s ease, transform 0.2s ease;
        }

        .search-box-drawer:focus-within svg,
        .search-box-drawer.has-value svg {
          color: var(--glow-accent);
          transform: scale(1.05);
        }

        /* Wrapper que segura o input e o texto-fantasma da sugestão "/all",
          alinhados exatamente por cima um do outro (mesma fonte/tamanho) pra
          a sugestão nascer bem na posição onde o texto digitado termina. */
        .search-input-ghost-wrap {
          position: relative;
          flex: 1;
          min-width: 0;
          display: flex;
          align-items: center;
        }

        .search-box-drawer input {
          position: relative;
          z-index: 1;
          flex: 1;
          min-width: 0;
          background: transparent;
          border: none;
          outline: none;
          color: var(--text);
          font-family: var(--font-title);
          font-size: 16px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }

        .search-box-drawer input::placeholder {
          color: var(--muted);
          font-weight: 400;
          letter-spacing: -0.005em;
        }

        /* Texto-fantasma: fica atrás do input, com a parte já digitada invisível
          (só ocupando espaço, pra empurrar a sugestão pro lugar certo) e a
          sugestão "all" em itálico/apagado, tipo o "Digite para filtrar" do
          comando / no chat. */
        .search-ghost-hint {
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          width: max-content;
          max-width: none;
          display: flex;
          align-items: center;
          pointer-events: none;
          white-space: pre;
          overflow: visible;
          font-family: var(--font-title);
          font-size: 16px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }

        .search-box-drawer.slash-mode input {
          color: transparent;
          caret-color: var(--text);
        }

        .search-ghost-hint .ghost-typed {
          color: var(--text);
        }

        /* Só a "/" ganha a cor do comando que está batendo com o que foi
          digitado — o resto da palavra continua na cor normal do texto, e
          essa cor vai mudando a cada letra digitada conforme o match muda
          (ver ghostRandomPick em updateGhostHint). */
        .search-ghost-hint .ghost-typed-slash {
          color: var(--glow-accent);
          transition: color 0.15s ease;
        }

        .search-ghost-hint .ghost-suggestion {
          color: var(--muted);
          font-weight: 400;
          font-style: italic;
          letter-spacing: -0.005em;
          opacity: 0.7;
        }

        /* Dropdown com todos os comandos de barra disponíveis (ex: digitando
          só "/" mostra /all, /ranking, /watching, /planwatch, etc, não só
          a sugestão-fantasma de um único comando). */
        /* Continuação visual da própria search-box: mesmo fundo/borda dela,
          colada embaixo sem gap e sem cantos arredondados — como se a barra
          de pesquisa tivesse "esticado" pra baixo pra mostrar os comandos. */
        .search-drawer-input-wrap.dropdown-open .search-box-drawer {
          border-bottom-color: transparent;
          box-shadow: none;
          background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
        }

        .slash-command-list {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.55) 100%);
          backdrop-filter: blur(40px) saturate(1.1);
          -webkit-backdrop-filter: blur(40px) saturate(1.1);
          border: none;
          border-radius: 0;
          z-index: 30;
          display: none;
          box-shadow: none;
          /* Fica dentro do .search-stage (mesmo pai de .search-drawer-results,
            que usa a mesma técnica de inset:0) — assim o fundo cinza sempre
            preenche até o rodapé real do drawer, sem depender de altura
            calculada em JS (que deixava um vão preto quando o cálculo não
            batia certo). */
          overflow-y: auto;
        }

        .slash-command-list.visible {
          display: block;
          animation: slashListIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slashListIn {
          from { opacity: 0; transform: translateY(-4px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        /* Cada comando tem uma cor própria (--cmd-color, setada inline) que
          tinge o ícone, a barra de acento e o hover — em vez de tudo cinza
          igual, cada linha tem sua identidade visual, tipo command palette
          do Notion/Linear. */
        .slash-command-item {
          position: relative;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 10px 16px;
          cursor: pointer;
          font-family: var(--font-title);
          transition: background 0.18s ease;
        }

        .slash-command-item + .slash-command-item {
          border-top: 1px solid rgba(255,255,255,0.055);
        }

        /* Filete vertical de acento que acende no hover/active. */
        .slash-command-item::before {
          content: '';
          position: absolute;
          left: 0;
          top: 4px;
          bottom: 4px;
          width: 2.5px;
          border-radius: 0 2px 2px 0;
          background: var(--cmd-color, var(--glow-accent));
          box-shadow: 0 0 10px color-mix(in srgb, var(--cmd-color, var(--glow-accent)) 70%, transparent);
          opacity: 0;
          transform: scaleY(0.35);
          transform-origin: center;
          transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .slash-command-item:hover,
        .slash-command-item.active {
          background: color-mix(in srgb, var(--cmd-color, var(--glow-accent)) 12%, transparent);
        }

        .slash-command-item .cmd-text {
          flex: 1;
          min-width: 0;
          display: flex;
          flex-direction: column;
          gap: 1px;
        }

        .slash-command-item .cmd-name {
          font-size: 13.5px;
          font-weight: 700;
          color: var(--text);
          letter-spacing: -0.005em;
          transition: color 0.18s ease;
        }

        /* Parte do nome que já foi digitada (ex: "/inco" de "/incomplete")
          ganha a cor do comando (--cmd-color) — o resto da palavra
          ("mplete") continua na cor normal do texto. Isso é só dentro do
          dropdown; não mexe na "/" da barra de pesquisa (.ghost-typed-slash),
          que é um elemento totalmente separado. */
        .slash-command-item .cmd-name-typed {
          color: var(--cmd-color, var(--glow-accent));
          font-weight: 900;
        }

        .slash-command-item .cmd-desc {
          font-size: 11px;
          font-weight: 500;
          color: var(--muted);
          letter-spacing: 0.01em;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .search-clear-btn {
          background: rgba(255,255,255,0.06);
          border: none;
          border-radius: 50%;
          width: 22px;
          height: 22px;
          padding: 0;
          display: none;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          flex: 0 0 22px;
          transition: background 0.15s ease;
        }

        .search-clear-btn:hover { background: rgba(255,255,255,0.14); }

        .search-clear-btn svg {
          width: 11px;
          height: 11px;
          color: var(--muted);
          cursor: pointer;
        }

        .search-box-drawer.has-value .search-clear-btn { display: none; }

        .search-drawer-results {
          position: absolute;
          inset: 0;
          overflow-y: auto;
          overflow-x: hidden;
          padding: 10px 12px 20px;
          display: grid;
          grid-template-columns: 1fr;
          align-content: start;
          gap: 14px;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s ease;
        }

        .search-panel-live.has-min-query .search-drawer-results {
          opacity: 1;
          pointer-events: auto;
        }

        .search-section-header,
        .search-empty {
          grid-column: 1 / -1;
        }

        .search-drawer-results::-webkit-scrollbar { width: 8px; }
        .search-drawer-results::-webkit-scrollbar-track { background: transparent; }
        .search-drawer-results::-webkit-scrollbar-thumb {
          background: rgba(255,255,255,0.14);
          border-radius: 10px;
          border: 2px solid transparent;
          background-clip: padding-box;
        }
        .search-drawer-results::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); background-clip: padding-box; }

        /* ── Cards de busca: thumb 16:9 + título sempre visível embaixo ── */
        .search-result-item {
          position: relative;
          display: block;
          width: 100%;
          min-width: 0;
          border-radius: 10px;
          cursor: pointer;
          text-align: left;
          color: var(--text);
          background: #141414;
          box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
          transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease;
        }

        .search-result-item:hover,
        .search-result-item.active {
          transform: translateY(-1px);
          box-shadow: 0 8px 16px rgba(0,0,0,0.45), 0 0 0 1.5px color-mix(in srgb, var(--acc, #e2e8f0) 65%, transparent);
        }

        /* Wrapper interno que recorta o ambient nos cantos arredondados. O corte
          fica aqui (e não em .search-result-item, que é item de um CSS Grid)
          porque um overflow != visible num grid item some com o dimensionamento
          automático da linha do grid — o padding-top percentual do thumb some
          da conta e o card colapsa pra altura do título. Isolando o overflow
          num descendente comum, o grid volta a medir a altura certa. */
        .search-result-card-inner {
          position: relative;
          overflow: hidden;
          border-radius: 10px;
        }

        /* ── Ambient: o próprio poster, borrado, como wallpaper do card (mesma mecânica dos cards do ranking) ── */
        .search-result-ambient {
          position: absolute;
          inset: -20px;
          z-index: 0;
          background-size: cover;
          background-position: center;
          filter: blur(24px) saturate(2.2) brightness(0.85);
          opacity: 0;
          transform: scale(1.1);
          transition: opacity 0.4s ease, transform 0.6s ease;
          pointer-events: none;
        }

        .search-result-ambient.ready {
          opacity: 1;
        }

        /* Mesma deriva contínua dos cards do ranking, só que num raio menor
          (o card de busca é bem mais compacto). */
        @keyframes searchAmbientDrift {
          0%   { transform: scale(1.18) translate(4%, -3%); }
          25%  { transform: scale(1.3) translate(-4%, 3%); }
          50%  { transform: scale(1.2) translate(3%, 4%); }
          75%  { transform: scale(1.32) translate(-3%, -4%); }
          100% { transform: scale(1.18) translate(4%, -3%); }
        }

        .search-result-item:hover .search-result-ambient.ready,
        .search-result-item.active .search-result-ambient.ready {
          animation: searchAmbientDrift 4s ease-in-out infinite;
        }

        .search-result-ambient-shade {
          position: absolute;
          inset: 0;
          z-index: 1;
          background: linear-gradient(180deg, rgba(10,10,14,0.05) 0%, rgba(10,10,14,0.35) 58%, rgba(10,10,14,0.8) 100%);
          pointer-events: none;
        }

        /* Wrapper com padding-top trava a altura da imagem em pixels reais no
          momento do layout, evitando o bug de alguns navegadores onde uma
          imagem dimensionada só por "aspect-ratio" confunde o cálculo de
          altura das linhas do grid e acaba cortando o título. */
        .search-result-thumb-wrap {
          position: relative;
          z-index: 2;
          width: 100%;
          padding-top: 56.25%; /* proporção 16:9 */
          border-radius: 10px 10px 0 0;
          overflow: hidden;
          background: #1c1c1c;
        }

        .search-result-thumb {
          position: absolute;
          inset: 0;
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-result-item:hover .search-result-thumb,
        .search-result-item.active .search-result-thumb {
          transform: scale(1.03);
        }

        .search-result-item::after {
          display: none;
        }

        .search-result-info {
          position: relative;
          z-index: 2;
          padding: 8px 10px 10px;
          border-radius: 0 0 10px 10px;
          min-height: 46px;
          background: transparent;
          display: flex;
          flex-direction: column;
          gap: 1px;
        }

        .search-result-title {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 1;
          overflow: hidden;
          font-size: 15px;
          font-weight: 700;
          letter-spacing: -0.005em;
          line-height: 1.3;
          color: var(--text);
          overflow-wrap: break-word;
        }

        .search-result-meta {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 1;
          overflow: hidden;
          margin-top: 2px;
          font-size: 12px;
          font-weight: 500;
          line-height: 1.3;
          color: var(--muted);
          overflow-wrap: break-word;
        }

        .search-result-rank {
          display: inline-block;
          margin-right: 6px;
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 13px;
          color: rgba(255,255,255,0.5);
          letter-spacing: -0.01em;
          vertical-align: middle;
        }

        .search-result-rank.rank-gold { color: #d4af37; }
        .search-result-rank.rank-silver { color: #b8bcc2; }
        .search-result-rank.rank-bronze { color: #b0703f; }

        .search-result-title mark {
          background: transparent;
          color: var(--acc, currentColor);
          font-weight: 900;
          text-decoration: none;
        }

        .search-result-arrow { display: none; }

        .search-section-header {
          display: flex;
          align-items: center;
          flex-shrink: 0;
          padding: 18px 4px 4px;
          margin-bottom: -8px;
        }

        .search-section-header:first-child { padding-top: 2px; }

        .search-section-header .search-section-text {
          margin: 0;
          font-family: var(--font-title);
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 0.03em;
          text-transform: uppercase;
          color: var(--section-color, var(--muted));
        }

        .search-section-header .search-section-line {
          display: none;
        }

        .search-drawer-results.is-empty-state {
          display: flex;
        }

        .search-empty {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          width: 100%;
          padding: 32px 24px;
          text-align: center;
          color: var(--muted);
          position: relative;
          z-index: 1;
        }

        /* Véu escuro atrás do texto do estado vazio: garante contraste mesmo
          quando um pôster claro/branco do carrossel borrado fica bem atrás
          da mensagem "NADA ENCONTRADO". */
        .search-empty::before {
          content: "";
          position: absolute;
          inset: -8px -20px;
          z-index: -1;
          border-radius: 20px;
          background: radial-gradient(ellipse 100% 90% at 50% 50%, rgba(0,0,0,0.72), rgba(0,0,0,0.42) 65%, transparent 100%);
          backdrop-filter: blur(2px);
          -webkit-backdrop-filter: blur(2px);
        }

        .search-empty-title {
          font-family: var(--font-title);
          font-weight: 800;
          font-size: 19px;
          color: var(--text);
          letter-spacing: -0.01em;
          text-shadow: 0 1px 8px rgba(0,0,0,0.65);
        }

        .search-empty-title--caps {
          letter-spacing: 0.04em;
        }

        .search-empty-sub {
          font-size: 13px;
          line-height: 1.55;
          color: var(--muted);
          max-width: 240px;
          text-align: justify;
          text-align-last: center;
          text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }

        .search-empty-sub mark {
          background: transparent;
          color: var(--glow-accent);
          font-weight: 700;
        }

        .drawer-panel.search-panel-live.active {
          display: flex;
          flex-direction: column;
          position: relative;
          height: 100%;
          overflow: hidden;
        }

        /* ── Palco: área abaixo do input onde carrossel e resultados se revezam ──
          Os dois ocupam o mesmo espaço (absolute, inset:0) e alternam via
          opacidade/pointer-events, controlados pela classe .has-min-query no
          painel — que é ligada/desligada pelo JS conforme o tamanho da busca. */
        .search-stage {
          position: relative;
          flex: 1 1 auto;
          min-height: 0;
          overflow: hidden;
        }

        .search-preview-blur {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: space-evenly;
          align-items: center;
          gap: 12px;
          filter: blur(5px) saturate(0.8) brightness(0.85);
          opacity: 0.7;
          pointer-events: none;
          user-select: none;
          overflow: hidden;
          mask-image: linear-gradient(180deg, transparent, #000 8%, #000 92%, transparent);
          -webkit-mask-image: linear-gradient(180deg, transparent, #000 8%, #000 92%, transparent);
          transition: opacity 0.25s ease;
        }

        /* Com 4+ caracteres digitados, o carrossel some e dá lugar aos cards
          de resultado de verdade (ver .search-drawer-results.is-visible). */
        .search-panel-live.has-min-query .search-preview-blur {
          opacity: 0;
        }

        /* Exceção: quando a busca não encontrou nada, o carrossel volta a
          aparecer (borrado) por trás da mensagem "NADA ENCONTRADO", em vez
          de sumir totalmente — igual ao estado de placeholder normal. */
        .search-panel-live.has-min-query.is-no-results .search-preview-blur {
          opacity: 0.7;
          filter: blur(5px) saturate(0.8) brightness(0.85);
        }

        .search-marquee-row {
          overflow: hidden;
          width: 100%;
        }

        .search-marquee-track {
          display: flex;
          align-items: center;
          gap: 12px;
          width: max-content;
          will-change: transform;
          transform: translateZ(0);
          backface-visibility: hidden;
        }

        .search-marquee-row-right .search-marquee-track {
          animation: marqueeRight 42s linear infinite;
        }

        .search-marquee-row-left .search-marquee-track {
          animation: marqueeLeft 42s linear infinite;
        }

        @keyframes marqueeRight {
          from { transform: translateX(-50%); }
          to { transform: translateX(0); }
        }

        @keyframes marqueeLeft {
          from { transform: translateX(0); }
          to { transform: translateX(-50%); }
        }

        .search-marquee-poster {
          flex: 0 0 auto;
          width: 150px;
          height: 211px;
          border-radius: 14px;
          object-fit: cover;
          background: #111;
          transform: translateZ(0);
          backface-visibility: hidden;
        }

        .search-marquee-poster--wide {
          width: 375px;
          height: 211px;
          border-radius: 12px;
        }

        @media (max-width: 480px) {
          .search-marquee-poster {
            width: 124px;
            height: 175px;
          }

          .search-marquee-poster--wide {
            width: 311px;
            height: 175px;
          }
        }

        .filter-btn {
          background: transparent;
          border: none;
          color: var(--muted);
          padding: 10px 14px;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          transition: color 0.15s ease, transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
          border-radius: 14px;
          font-weight:700;
          min-width: 150px;
          max-width: 100%;
          text-decoration: none;
          font-size: 14px;
          box-shadow: 0 0 0 0 rgba(255,255,255,0);
          will-change: transform;
        }

        .filter-btn .left-pill {
          display:flex;
          align-items:center;
          gap:8px;
          min-width: 0;
        }

        .filter-btn svg.icon-left,
        .filter-btn svg.arrow-icon {
          width: 20px !important;
          height: 20px !important;
          flex: 0 0 16px;
        }

        .filter-btn svg { stroke-width: 2 !important; }

        .filter-btn:hover,
        .filter-btn.active {
          color: var(--text);
          transform: translateY(-1px) scale(1.005);
        }

        .filter-btn.active {
          box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
        }

        .filter-btn.icon-only {
          min-width: 0;
          width: auto;
          justify-content: center;
          gap: 4px;
          padding: 10px 12px;
        }
        .filter-btn.icon-only .filter-text { display: none !important; }

        .drawer-backdrop {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0);
          pointer-events: none;
          z-index: 1200;
          visibility: hidden;
          transition: background 0.14s linear, visibility 0s linear 0.14s;
        }

        .drawer-backdrop.show {
          background: rgba(0,0,0,0.45);
          pointer-events: auto;
          visibility: visible;
          transition: background 0.14s linear, visibility 0s linear 0s;
        }

        .category-drawer {
          position: fixed;
          top: 0;
          right: 0;
          height: 100vh;
          width: min(var(--drawer-w), 92vw);
          background:
            radial-gradient(ellipse 120% 55% at 50% -5%, var(--drawer-glow-1), transparent 62%),
            radial-gradient(ellipse 90% 40% at 15% 0%, var(--drawer-glow-2), transparent 55%),
            radial-gradient(ellipse 90% 40% at 85% 0%, var(--drawer-glow-3), transparent 55%),
            linear-gradient(180deg, #050505 0%, #020202 100%);
          border-left: 1px solid rgba(255,255,255,0.12);
          box-shadow: -10px 0 40px rgba(0,0,0,0.5), inset 1px 0 0 rgba(255,255,255,0.05);
          isolation: isolate;
          transform: translate3d(100%, 0, 0);
          transition: transform 0.18s ease-out;
          z-index: 1300;
          will-change: transform;
          backface-visibility: hidden;
          contain: layout style paint;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        .category-drawer.show {
          transform: translate3d(0, 0, 0);
        }

        .drawer-top,
        .drawer-tabs,
        .drawer-content {
          position: relative;
          z-index: 1;
        }

        .drawer-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          padding: 20px 18px 16px 18px;
          border-bottom: 1px solid rgba(255,255,255,0.06);
          flex: 0 0 auto;
        }

        .drawer-top-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

        .drawer-top-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

        .drawer-eyebrow {
          font-size: 10px;
          font-weight: 800;
          letter-spacing: 1.6px;
          text-transform: uppercase;
          color: var(--glow-accent, #34d399);
        }

        .drawer-eyebrow-credits {
          color: var(--glow-accent, #34d399);
          text-decoration: none;
          cursor: pointer;
          transition: color 0.2s ease;
        }

        .drawer-eyebrow-credits:hover,
        .drawer-eyebrow-credits:focus-visible {
          color: #ffffff;
        }

        .drawer-title {
          margin: 0;
          font-family: var(--font-title);
          font-size: 20px;
          font-weight: 800;
          letter-spacing: -0.02em;
          line-height: 1.15;
          color: var(--text);
        }

        .drawer-close {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          border: none;
          background: rgba(255,255,255,0.015);
          color: #cbd5e1;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          transition: background 0.12s ease, color 0.12s ease, transform 0.12s ease;
          flex: 0 0 auto;
        }

        .drawer-close:hover {
          background: rgba(255,255,255,0.05);
          color: #fff;
          transform: scale(1.02);
        }

        .drawer-close svg {
          width: 22px;
          height: 22px;
          stroke-width: 2.2;
        }

        .drawer-content {
          overflow-y: auto;
          padding: 0 0 18px;
          flex: 1;
        }

        .drawer-section {
          padding: 8px 0 0;
        }

        .drawer-section-title {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 1.5px;
          color: #4b5563;
          font-weight: 800;
          padding: 6px 18px 10px;
        }

        .drawer-grid {
          display: block;
        }

        .drawer-item {
          width: 100%;
          background: transparent;
          border: none;
          color: #a9b0bb;
          text-align: left;
          padding: 14px 18px;
          cursor: pointer;
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 15px;
          transition: background 0.12s ease, color 0.12s ease, padding-left 0.12s ease;
          display: flex;
          align-items: center;
          gap: 14px;
          justify-content: flex-start;
          border-top: 1px solid rgba(255,255,255,0.02);
          outline: none;
          border-radius: 0;
          position: relative;
        }

        .drawer-item-icon {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 22px;
          height: 22px;
          flex: 0 0 22px;
          color: var(--cat-color, #a9b0bb);
          transition: color 0.15s ease;
        }
        .drawer-item-icon svg {
          width: 100%;
          height: 100%;
          stroke-width: 2.2;
        }

        .drawer-item:hover {
          background: color-mix(in srgb, var(--cat-color, #fff) 14%, transparent);
          color: #fff;
          padding-left: 24px;
        }

        .drawer-item.selected {
          background: #fff;
          color: #0b0b0b;
          font-weight: 800;
        }

        .drawer-item.selected .drawer-item-icon {
          color: #0b0b0b;
        }

        .drawer-item-text {
          min-width: 0;
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 2px;
        }

        .drawer-item .label {
          line-height: 1.15;
        }

        .drawer-item-count {
          font-size: 11.5px;
          font-weight: 600;
          color: var(--low-priority);
          font-family: "Inter", sans-serif;
        }

        .drawer-item.selected .drawer-item-count { color: rgba(11,11,11,0.55); }

        .drawer-item .chev {
          width: 18px;
          height: 18px;
          flex: 0 0 18px;
          opacity: 0.85;
          transform: none;
          position: static;
          transition: transform 0.15s ease, opacity 0.15s ease;
          color: currentColor;
        }

        .drawer-item:hover .chev {
          transform: translateX(3px);
          opacity: 1;
        }

        .drawer-item.selected .chev {
          opacity: 1;
          color: #0b0b0b;
        }

        /* ── Item indisponível (em breve) ──
          Sem highlight/deslocamento no hover (fica visualmente "parado"),
          só o cursor muda pra "not-allowed" indicando que não é clicável. */
        .drawer-item.disabled {
          cursor: not-allowed;
          opacity: 0.55;
        }

        .drawer-item.disabled:hover {
          background: transparent;
          color: #a9b0bb;
          padding-left: 18px;
          cursor: not-allowed;
        }

        .drawer-item.disabled .chev {
          opacity: 0.35;
        }

        .drawer-item.disabled:hover .chev {
          transform: none;
          opacity: 0.35;
        }

        /* ── DRAWER: TABS ── */
        .drawer-tabs {
          display: flex;
          align-items: center;
          gap: 16px;
          margin: 18px 18px 0;
          padding: 0 2px 8px;
          flex: 0 0 auto;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: none;
          -ms-overflow-style: none;
        }

        .drawer-tabs::-webkit-scrollbar { display: none; }

        .drawer-tab {
          display: inline-flex;
          align-items: center;
          gap: 7px;
          background: transparent;
          border: none;
          padding: 0;
          cursor: pointer;
          color: var(--muted);
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 13px;
          letter-spacing: 0.01em;
          opacity: 0.6;
          white-space: nowrap;
          flex: 0 0 auto;
          transform-origin: left center;
          transition: color 0.25s ease, opacity 0.25s ease, font-size 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .drawer-tab svg {
          width: 14px;
          height: 14px;
          stroke-width: 2.4;
          flex: 0 0 auto;
          transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.25s ease;
        }

        .drawer-tab:hover:not(.active) { color: #fff; opacity: 0.85; }

        .drawer-tab.active {
          color: #fff;
          opacity: 1;
          font-size: 17px;
        }

        .drawer-tab.active svg {
          width: 17px;
          height: 17px;
          stroke: var(--glow-accent, #34d399);
          transform: translateY(1px);
        }

        /* ── DRAWER: CREDITS ──
          Lista estática de créditos, com pegada de créditos de filme
          (cargo em caixa alta + nome), mas em fluxo normal dentro do
          drawer-content, sobre o fundo padrão do drawer (sem tela preta,
          sem rolagem automática). */
        :root {
          --credits-gold: var(--glow-accent);
          --credits-gold-bright: color-mix(in srgb, var(--glow-accent) 55%, #ffffff);
        }

        .credits-crawl {
          padding: 4px 22px 24px;
        }

        .credits-block {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          text-align: center;
          padding: 22px 12px;
          width: 100%;
          max-width: 320px;
          margin: 0 auto;
        }

        .credits-block + .credits-block {
          border-top: 1px solid rgba(255,255,255,0.05);
        }

        .credits-role {
          font-size: 11px;
          font-weight: 800;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: var(--credits-gold);
          opacity: 0.85;
        }

        .credits-names {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 9px;
        }

        .credits-name {
          font-family: var(--font-title);
          font-weight: 700;
          font-size: clamp(17px, 4.5vw, 21px);
          letter-spacing: 0.01em;
          color: #f2f0ea;
          text-decoration: none;
          transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .credits-name:hover,
        .credits-name:focus-visible {
          color: var(--credits-gold-bright);
          text-shadow: 0 0 14px rgba(203,213,225,0.35);
        }

        /* ── Créditos com o logo do serviço em vez de texto ──
          Cada entrada vira um link que mostra a imagem do logo
          (assets/credits-webp/*.webp), com uma altura fixa e largura
          livre para caber logos de proporções diferentes (ícone quadrado
          vs. wordmark alongado, como o da Canva). */
        .credits-name.credits-name-logo {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 0;
          transition: filter 0.2s ease, transform 0.2s ease;
        }

        .credits-name.credits-name-logo:hover,
        .credits-name.credits-name-logo:focus-visible {
          filter: brightness(1.2);
          transform: translateY(-1px);
          text-shadow: none;
        }

        .credits-logo-img {
          display: block;
          height: 24px;
          width: auto;
          max-width: 160px;
          object-fit: contain;
        }

        /* Alguns wordmarks (ex: Canva) tendem a ser mais largos/baixos —
          um pouco menor de altura fica proporcionalmente mais parecido
          com o restante da lista. */
        .credits-logo-img--wide {
          height: 20px;
        }

        .credits-logo-img--canva {
          height: 26px;
        }
        
        /* Link com ícone do GitHub + nome de usuário */
        .credits-name-github {
          display: inline-flex;
          align-items: center;
          gap: 8px;
        }

        .credits-github-icon {
          flex-shrink: 0;
        }

        /* Ajustes finos de tamanho por logo específico (pedidos pelo usuário) */
        .credits-logo-img--prime {
          height: 30px;
        }

        .credits-logo-img--anime-planet {
          height: 40px;
        }

        .credits-logo-img--pinterest {
          height: 26px;
        }

        /* Gemini um pouco maior no bloco Fontes & Referências */
        .credits-logo-img--gemini-source {
          height: 20px;
        }

        /* ChatGPT um pouco maior no bloco Fontes & Referências */
        .credits-logo-img--chatgpt-source {
          height: 30px;
        }

        /* Bloco Fontes & Referências em grade de 2 colunas (2 logos por linha) */
        .credits-names--sources {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          align-items: center;
          justify-items: center;
          column-gap: 22px;
          row-gap: 18px;
        }

        /* Se sobrar um item ímpar (ex: 5º logo), ele ocupa a linha toda e fica centralizado */
        .credits-names--sources > .credits-name-logo:last-child:nth-child(odd) {
          grid-column: 1 / -1;
        }

        .drawer-panel {
          display: none;
        }

        .drawer-panel.active {
          display: block;
          animation: drawerPanelIn 0.16s ease;
        }

        @keyframes drawerPanelIn {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* ── RANKING LIST ── */
        ol.ranking {
          margin: 0;
          padding: 0;
          list-style: none;
          counter-reset: item;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 0;
          contain: layout style;
        }

        li.anime-item {
          counter-increment: item;
          display: grid;
          grid-template-columns: 64px 280px 1fr;
          align-items: center;
          gap: 0;
          padding: 0;
          cursor: pointer;
          position: relative;
          transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, background 0.2s ease;
          min-height: 114px;
          border-radius: 10px;
          background: rgba(255,255,255,0.02);
          overflow: hidden;
          contain: layout style paint;
          transform: translateZ(0);
          backface-visibility: hidden;
        }

        /* will-change só entra durante o hover, não em todos os cards o tempo todo —
          manter will-change ligado em dezenas de itens simultaneamente força o
          navegador a reservar camadas de composição para todos eles, o que é
          uma das maiores causas de travamento em listas grandes. */
        li.anime-item:hover {
          will-change: transform, box-shadow;
        }

        /* ── Ambient: o próprio poster, borrado, como wallpaper do card (mesma mecânica do posterlight) ── */
        .anime-item-ambient {
          position: absolute;
          inset: -30px;
          z-index: 0;
          background-size: cover;
          background-position: center;
          filter: blur(30px) saturate(1.5) brightness(0.55);
          opacity: 0;
          transform: scale(1.1);
          transition: opacity 0.4s ease, transform 0.6s ease;
          pointer-events: none;
        }

        .anime-item-ambient.ready {
          opacity: 0.9;
        }

        /* No hover, o wallpaper borrado ganha um zoom + deriva contínua,
          dando a sensação de "respirar" em vez de ficar parado. */
        @keyframes ambientDrift {
          0%   { transform: scale(1.2) translate(4%, -3%); }
          25%  { transform: scale(1.38) translate(-4%, 3%); }
          50%  { transform: scale(1.25) translate(3%, 4%); }
          75%  { transform: scale(1.4) translate(-3%, -4%); }
          100% { transform: scale(1.2) translate(4%, -3%); }
        }

        li.anime-item:hover .anime-item-ambient.ready {
          animation: ambientDrift 4s ease-in-out infinite;
          animation-delay: 140ms;
        }

        .anime-item-ambient-shade {
          position: absolute;
          inset: 0;
          z-index: 1;
          background: linear-gradient(90deg, rgba(10,10,14,0.55) 0%, rgba(10,10,14,0.25) 45%, rgba(10,10,14,0.78) 100%);
          pointer-events: none;
        }

        .rank-wrap,
        .poster-wrap,
        .meta {
          position: relative;
          z-index: 2;
        }

        li.anime-item::after {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 3;
          background: rgba(255,255,255,0.06);
          opacity: 0;
          transition: opacity 0.2s ease;
          pointer-events: none;
          border-radius: inherit;
        }

        li.anime-item:hover::after { opacity: 1; }

        li.anime-item:hover {
          transform: translateY(-3px) translateZ(0);
          box-shadow: 0 12px 32px -8px rgba(0,0,0,0.6);
        }
        li.anime-item:hover .thumb { transform: scale(1.05); }

        /* Hover colorido por categoria (usa --item-hover-color quando definido no card) */
        li.anime-item[style*="--item-hover-color"]:hover {
          background: color-mix(in srgb, var(--item-hover-color) 8%, transparent);
          box-shadow:
            0 12px 32px -8px rgba(0,0,0,0.7),
            0 0 0 1px var(--item-hover-color),
            0 0 12px -3px var(--item-hover-color);
        }

        li.anime-item.hidden-item { display: none; }
        li.season-header.hidden-item { display: none; }
        /* Cabeçalho de divisão que existe só pra a poster lightbox conseguir
          achar a tag de divisão (ex: "Non-Seasonal Anime") — não deve
          aparecer visualmente na grid, só servir de marcador no DOM. */
        li.season-header.season-header-novisual {
          display: none !important;
        }

        li.anime-item.fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateX(-8px); }
          to   { opacity: 1; transform: translateX(0); }
        }

        /* ── HIGHLIGHT / DESTAQUE EXTRA ── */
        @keyframes extraHighlightPulse {
          0% {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255, 255, 255, 0.6);
            transform: translateY(-4px) scale(1.02);
            z-index: 10;
          }
          100% {
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 0 0 rgba(0,0,0,0), inset 0 0 0 0 rgba(255, 255, 255, 0);
            transform: translateY(0) scale(1);
            z-index: 1;
          }
        }

        li.anime-item.highlight-active,
        li.fav-ep-card.highlight-active { 
          animation: extraHighlightPulse 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ── Número do rank ── */
        .rank-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100%;
          padding: 0 4px;
          gap: 2px;
        }

        .rank {
          font-family: var(--font-title);
          font-weight: 900;
          font-size: 22px;
          color: rgba(255,255,255,0.22);
          letter-spacing: -0.01em;
          text-align: center;
          line-height: 1;
        }

        .rank::before { content: counter(item); }
        /* Peak Episodes calcula a posição em JS (considerando empate de MNP),
          então aqui o número já vem no HTML — não usa o contador automático. */
        .rank.rank-fixed::before { content: none; }

        .rank-secondary {
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 11px;
          color: var(--muted);
          letter-spacing: -0.01em;
          text-align: center;
          line-height: 1;
          opacity: 0.75;
        }

        /* ── Poster ── */
        .poster-wrap {
          width: 280px;
          height: 140px;
          position: relative;
          overflow: hidden;
          background: var(--surface);
          display: block;
          flex-shrink: 0;
        }

        .thumb {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          opacity: 0;
          transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        /* backface-visibility: hidden só durante o hover (evita flicker no
          scale do :hover), em vez de sempre — deixado permanente, isso força
          o navegador a promover o .thumb pra uma camada de GPU separada o
          tempo todo, e em boa parte dos celulares essa camada é rasterizada
          numa resolução menor que a da tela, deixando o pôster pixelado
          mesmo com a imagem original em alta qualidade (o lightbox, que não
          tem essa propriedade, renderiza nítido). */
        li.anime-item:hover .thumb {
          will-change: transform;
          backface-visibility: hidden;
        }

        .thumb.loaded {
          opacity: 1;
        }

        .poster-wrap { cursor: zoom-in; }

        /* ── Lightbox (imagem do card ampliada) ── */
        .poster-lightbox {
          position: fixed;
          inset: 0;
          height: 100vh;
          height: 100dvh;
          z-index: 10000;
          display: none;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: rgba(0,0,0,0.75);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
          opacity: 0;
          transition: opacity 0.15s cubic-bezier(0.22, 1, 0.36, 1);
          cursor: zoom-out;
        }

        .poster-lightbox.open {
          display: flex;
          opacity: 1;
        }

        .poster-lightbox-figure,
        .poster-lightbox-close {
          position: relative;
          z-index: 1;
        }

        /* ── Ambient: o próprio poster, ampliado e borrado, como wallpaper do fundo ── */
        .poster-lightbox-ambient {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          z-index: 0;
          pointer-events: none;
          overflow: hidden;
          opacity: 0;
          transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .poster-lightbox-ambient img {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 128%;
          height: 128%;
          min-width: 128vw;
          min-height: 128vh;
          object-fit: cover;
          filter: blur(52px) saturate(1.6) brightness(0.5);
          transform: translate(-50%, -50%) scale(1.28);
          will-change: opacity;
        }

        .poster-lightbox-ambient::after {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 130% 120% at 50% 45%, transparent 0%, rgba(0,0,0,0.4) 100%);
        }

        /* No layout mobile em grid, a linha das tags/badges e a ficha técnica
          ficam bem abaixo do centro do ambient, então a vinheta radial acima
          precisa de menos "alcance vertical" ali — senão essa faixa cai fora
          do gradiente e vira um bloco escuro que destoa do resto do blur. */
        @media (max-width: 760px) {
          .poster-lightbox-ambient::after {
            background: radial-gradient(ellipse 140% 160% at 50% 38%, transparent 0%, rgba(0,0,0,0.4) 100%);
          }
        }

        .poster-lightbox.open .poster-lightbox-ambient.ready {
          opacity: 0.67;
        }

        .poster-lightbox-figure {
          margin: 0;
          display: flex;
          flex-direction: row;
          align-items: flex-start;
          justify-content: center;
          gap: 48px;
          transform: scale(0.96);
          transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
          cursor: default;
          max-width: min(96vw, 1320px);
          max-height: 92vh;
          width: 100%;
        }

        .poster-lightbox.open .poster-lightbox-figure {
          transform: scale(1);
        }

        .poster-lightbox img {
          width: min(38vw, 500px);
          height: min(86vh, 680px);
          border-radius: 16px;
          box-shadow: 0 30px 80px rgba(0,0,0,0.6);
          object-fit: cover;
          display: block;
        }

        .poster-lightbox-media {
          display: block;
          line-height: 0;
          flex: 0 0 auto;
        }

        .poster-lightbox-image-wrap {
          position: relative;
          display: block;
          line-height: 0;
        }

        /* ── Zoom da imagem (só mobile): ao tocar no pôster pequeno do layout
          lado-a-lado, ele aparece ampliado e centralizado por cima de tudo,
          num overlay próprio (ver JS: initPosterLightboxZoom). No desktop
          essa camada nunca é ativada, então fica sempre display:none. ── */
        .poster-lightbox-zoom {
          position: fixed;
          inset: 0;
          z-index: 10100;
          display: none;
          align-items: center;
          justify-content: center;
          padding: 32px;
          background: rgba(0,0,0,0.78);
          opacity: 0;
          transition: opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1);
          cursor: zoom-out;
        }

        .poster-lightbox-zoom.open {
          display: flex;
          opacity: 1;
        }

        .poster-lightbox-zoom img {
          width: min(88vw, 440px);
          height: auto;
          aspect-ratio: 2 / 3;
          max-height: 82vh;
          object-fit: cover;
          border-radius: 16px;
          box-shadow: 0 30px 80px rgba(0,0,0,0.7);
          display: block;
          transform: scale(0.94);
          transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .poster-lightbox-zoom.open img {
          transform: scale(1);
        }

        @media (max-width: 760px) {
          .poster-lightbox-image-wrap {
            cursor: zoom-in;
          }
        }

        /* ── Troca de item ultra fluida ──
          O conteúdo (src/texto) é atualizado no MESMO frame do clique/seta —
          zero delay, zero espera de transition. Só toca em opacity/transform
          (composição pura, sem layout/paint) com will-change + camada própria
          (translateZ(0)), então roda direto na GPU. A troca é só uma
          animação de entrada bem curta por cima do conteúdo já atualizado. */
        .poster-lightbox-image-wrap,
        .poster-lightbox-media-category,
        .poster-lightbox-panel,
        .poster-lightbox-simple-category,
        .poster-lightbox-simple-caption {
          will-change: opacity, transform;
          transform: translateZ(0);
          backface-visibility: hidden;
        }

        /* Troca instantânea: sem animação de entrada, o conteúdo já é
          atualizado no mesmo frame do input (ver swapItem() no JS). */

        /* ── Categoria/divisão abaixo da imagem (cards com painel lateral) ──
          Mesmo estilo visual usado no modo simples (forwatch-images), porém
          aparece sob a própria imagem em vez de substituir o painel. */
        .poster-lightbox-media-category {
          display: block;
          line-height: normal;
          margin-top: 14px;
          font-family: var(--font-title);
          font-weight: 700;
          font-size: 12px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: color-mix(in srgb, var(--glow-accent) 55%, white);
          text-align: center;
        }

        .poster-lightbox-media-category:empty { display: none; }

        /* Bloco do Anime-Planet/Crunchyroll/MyAnimeList embaixo da imagem, só
          no desktop (ver JS: renderMalScores manda uma cópia pra cá e outra
          pra dentro do painel — CSS decide qual aparece em cada tamanho de
          tela). */
        .poster-lightbox-media-watchnow {
          margin-top: 14px;
          display: flex;
          justify-content: center;
          padding: 14px 20px;
          border: 1px solid rgba(255,255,255,0.09);
          border-radius: 10px;
          background: rgba(255,255,255,0.02);
        }

        .poster-lightbox-media-watchnow:empty { display: none; }

        .poster-lightbox.simple-mode .poster-lightbox-media-watchnow {
          display: none !important;
        }

        @media (max-width: 760px) {
          .poster-lightbox-media-watchnow {
            display: none !important;
          }
        }

        @media (min-width: 761px) {
          .rank-mal .watch-now-links {
            display: none;
          }
        }

        .poster-lightbox-media-category .simple-category-division {
          font-weight: 800;
        }

        .poster-lightbox.simple-mode .poster-lightbox-media-category {
          display: none !important;
        }

        /* ── Painel de informações (ao lado da imagem) ── */
        .poster-lightbox-panel {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 26px;
          width: min(560px, 44vw);
          max-height: min(86vh, 680px);
          overflow-y: auto;
          scrollbar-gutter: stable;
          padding-right: 8px;
          padding-top: 4px;
          text-align: left;
        }

        /* Enquanto a seta do "watch now" está animando, trava a rolagem vertical
          do painel pra barra de rolagem não "piscar" no meio da animação (ver
          JS: listener do ".watch-now-toggle" em "lightboxMal"). */
        .poster-lightbox-panel.watch-now-animating {
          overflow-y: hidden;
        }

        /* Firefox não lê as regras "::-webkit-scrollbar*" abaixo, então sem
          isso ele cai pra barra clássica do sistema (com as setinhas) em vez
          da fininha/discreta usada no resto do site. */
        .poster-lightbox-panel {
          scrollbar-width: thin;
          scrollbar-color: rgba(255,255,255,0.14) transparent;
        }

        .poster-lightbox-panel::-webkit-scrollbar { width: 6px; }
        .poster-lightbox-panel::-webkit-scrollbar-track { background: transparent; }
        .poster-lightbox-panel::-webkit-scrollbar-thumb {
          background: rgba(255,255,255,0.14);
          border-radius: 10px;
          border: 1px solid transparent;
          background-clip: padding-box;
        }
        .poster-lightbox-panel::-webkit-scrollbar-thumb:hover {
          background: rgba(255,255,255,0.26);
          background-clip: padding-box;
        }

        .poster-lightbox-panel .poster-lightbox-list {
          justify-content: flex-start;
          max-width: 100%;
        }

        .poster-lightbox-panel .poster-lightbox-title {
          text-align: left;
          max-width: 100%;
          font-size: 28px;
        }

        /* Aproxima "X temporadas: Y episódios" do título, em vez de deixar
          o mesmo espaçamento (gap) usado entre os outros blocos do painel. */
        .poster-lightbox-panel .poster-lightbox-info {
          margin-top: -22px;
        }

        /* ── Cópia do "MORE INFO" que aparece ACIMA do bloco Studio/
          Lançamento, só no mobile (ver grid-area "moreinfo" mais abaixo).
          No desktop fica sempre escondida, já que lá o "MORE INFO" some
          embaixo da imagem (".poster-lightbox-media-watchnow"). ── */
        .poster-lightbox-more-info {
          display: none;
        }

        .poster-lightbox-more-info:empty {
          display: none;
        }

        /* ── Metadados (Studio / temporada) ── */
        .rank-meta {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          width: 100%;
          margin-top: 2px;
          padding: 14px 20px;
          border: 1px solid rgba(255,255,255,0.09);
          border-radius: 10px;
          background: rgba(255,255,255,0.02);
        }

        .rank-meta:empty {
          display: none;
        }

        .rank-meta-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          gap: 3px;
          padding: 0 12px;
        }

        .rank-meta-item:not(:last-child) {
          border-right: 1px solid rgba(255,255,255,0.09);
        }

        .rank-meta-label {
          font-family: var(--font-title);
          font-weight: 600;
          font-size: 11px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted);
        }

        .rank-meta-value {
          font-family: "Inter", sans-serif;
          font-weight: 600;
          font-size: 14.5px;
          color: var(--text);
        }

        .rank-meta-value.empty {
          color: var(--low-priority);
          font-weight: 400;
          font-style: italic;
        }

        /* Quando há muitos estúdios (ex: 3+), o texto some sendo cortado
          em 2 linhas com reticências, em vez de empurrar o card pra baixo
          com uma lista inteira de nomes. */
        .rank-meta-value--clamp {
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* Nota ao vivo do MyAnimeList (ver updateLiveMalScore/renderMeta):
          cor de destaque pra diferenciar dos outros campos (Studio/Lançamento/
          Rewatch), que são só texto informativo estático. */
        .rank-meta-value--score {
          color: #7fb2ff;
          text-decoration: none;
          cursor: pointer;
          transition: color 0.15s ease, opacity 0.15s ease;
        }

        .rank-meta-value--score:hover,
        .rank-meta-value--score:focus-visible {
          color: #a7c9ff;
          opacity: 0.9;
        }

        .rank-meta-value--score.empty {
          color: var(--low-priority);
          cursor: default;
          pointer-events: none;
        }

        .rank-meta-value[contenteditable="true"] {
          outline: none;
          cursor: text;
          min-width: 60px;
          display: inline-block;
        }

        .rank-meta-value[contenteditable="true"]:hover {
          color: var(--glow-accent);
        }

        .rank-meta-value[contenteditable="true"]:focus {
          color: var(--glow-accent);
        }

        .rank-meta-value[contenteditable="true"]:empty::before {
          content: attr(data-placeholder);
          color: var(--low-priority);
          font-style: italic;
          font-weight: 400;
        }

        /* ── Notas do MyAnimeList (por temporada) ──
          Sem cartão/borda (fica solto, igual ao resto do painel, sem duplicar
          o visual do bloco Studio/Lançamento/Rewatch). Label pequena maiúscula
          + linhas com a nota em "badge" (pílula) na cor azul MAL. */
        .rank-mal {
          --mal-blue: #7fb2ff;
          --mal-gold: #f4c463;
          --mal-low: #a9a4bd;
          --mal-tier6: #5ec4c9;
          --mal-tier7: #81d185;
          --mal-tier9: #c792ea;
          display: flex;
          flex-direction: column;
          gap: 8px;
          width: 100%;
          padding-top: 2px;
        }

        .rank-mal:empty {
          display: none;
        }

        .rank-mal-label {
          font-family: var(--font-title);
          font-weight: 600;
          font-size: 11px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted);
          /* Reseta o "line-height: 0" herdado de ".poster-lightbox-media" (a
            cópia debaixo da imagem, só desktop). Sem isso, itens sem seta ao
            lado (ex: Plan to Watch só com Anime-Planet, sem Crunchyroll/MAL)
            colapsavam pra altura 0 e o botão "ABOUT" sumia por completo —
            só não quebrava quando havia seta, porque ela tem altura fixa
            (22px) e "segurava" a linha toda. */
          line-height: normal;
        }

        a.rank-mal-label {
          display: inline-flex;
          align-items: center;
          justify-content: flex-start;
          gap: 5px;
          text-decoration: none;
          cursor: pointer;
          transition: color 0.15s ease;
        }

        a.rank-mal-label svg {
          width: 11px;
          height: 11px;
          flex: 0 0 11px;
        }

        a.rank-mal-label:hover,
        a.rank-mal-label:focus-visible {
          color: var(--mal-blue);
        }

        a.rank-mal-label--anime-planet:hover,
        a.rank-mal-label--anime-planet:focus-visible {
          color: var(--mal-gold);
        }

        /* Botão "Watch Now" (Crunchyroll): visível em qualquer tamanho de tela,
          ao lado do botão do Anime-Planet. No mobile, se o app do Crunchyroll
          estiver instalado, o universal link abre ele direto; sem o app (ou
          no PC), cai no site normalmente. Sempre numa linha só (sem quebrar),
          mesmo no mobile — se não couber tudo, rola na horizontal em vez de
          quebrar linha. */
        .watch-now-links {
          display: flex;
          align-items: center;
          justify-content: flex-start;
          flex-wrap: nowrap;
          gap: 0;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: none;
          -ms-overflow-style: none;
        }

        .watch-now-links::-webkit-scrollbar {
          display: none;
        }

        /* No mobile, essa linha (Anime-Planet/Crunchyroll/MyAnimeList) é a
          única cópia visível (a ".poster-lightbox-media-watchnow" do desktop
          fica escondida abaixo de 760px) — então ganha o mesmo cartão
          (fundo + borda) do bloco Studio/Lançamento (".rank-meta") pra ficar
          visualmente igual ao que aparece no PC. */
        .rank-mal .watch-now-links,
        .poster-lightbox-more-info .watch-now-links {
          width: 100%;
          border: 1px solid rgba(255,255,255,0.09);
          border-radius: 10px;
          background: rgba(255,255,255,0.02);
          padding: 14px 20px;
          /* "safe center": tenta centralizar, mas se o conteúdo ficar mais
            largo que a caixa (ex: ao abrir Crunchyroll/MyAnimeList), cai pro
            alinhamento inicial em vez de centralizar "pra fora" da área
            visível — sem o "safe", a seta da esquerda ficava cortada/escondida
            (precisaria rolar pra um scrollLeft negativo, que não existe). */
          justify-content: safe center;
          /* Anima a caixa "crescendo" quando a 2ª linha (Crunchyroll/
            MyAnimeList) aparece via flex-wrap. Como "height: auto" não é
            animável, usa o truque do "max-height": os valores abaixo têm
            folga de sobra — quem define a altura real é o conteúdo (auto),
            o max-height só limita/anima até lá. overflow:hidden é quem
            "corta" a caixa durante a transição pra ela crescer suavemente
            em vez de só aparecer de repente. */
          overflow: hidden;
          max-height: 60px;
          transition: max-height 0.35s ease;
        }

        .rank-mal .watch-now-links.open,
        .poster-lightbox-more-info .watch-now-links.open {
          max-height: 120px;
        }

        /* Espaço fixo depois do Anime-Planet (sempre visível). O espaço entre
          ".watch-now-extra" e a seta é controlado pela própria ".watch-now-extra"
          (margin-right), que anima junto com o max-width — ver abaixo. */
        .watch-now-links .rank-mal-label--anime-planet {
          margin-right: 16px;
          flex-shrink: 0;
        }

        /* "MORE INFO": enquanto a seta está fechada, esse texto substitui o
          logo do Anime-Planet (que fica escondido); ao abrir a seta (classe
          "open" no ".watch-now-links" pai), o texto some e o logo volta a
          aparecer normalmente, junto com Crunchyroll/MyAnimeList. Herda a
          fonte/cor/tamanho do próprio ".rank-mal-label" (não precisa repetir
          aqui). */
        .watch-now-more-info-text {
          display: inline-block;
          white-space: nowrap;
          cursor: pointer;
          transition: color 0.15s ease;
        }

        .watch-now-links.open .watch-now-more-info-text {
          display: none;
        }

        /* Acompanha o mesmo hover branco das setas — tanto quando o mouse está
          em cima de uma das setas (classe "toggle-hover", ver JS:
          handleWatchNowAreaMouseOver) quanto direto em cima do próprio texto. */
        .watch-now-links.toggle-hover .watch-now-more-info-text,
        .watch-now-more-info-text:hover {
          color: var(--text);
        }

        /* No PC, o "MORE INFO" fica maior que o padrão herdado do
          ".rank-mal-label" (11px) — só ele, sem mexer no Crunchyroll/
          MyAnimeList/Anime-Planet quando abertos. */
        @media (min-width: 761px) {
          .watch-now-more-info-text {
            font-size: 15px;
            letter-spacing: 0.1em;
          }
        }

        .watch-now-links:not(.open) .rank-mal-label--anime-planet .anime-planet-btn-logo,
        .watch-now-links:not(.open) .rank-mal-label--anime-planet svg {
          display: none;
        }

        /* Seta que revela Crunchyroll/MyAnimeList: fica logo depois do
          Anime-Planet (que é sempre visível) quando fechada e, ao ser clicada,
          expande ".watch-now-extra" (que fica entre o Anime-Planet e a seta no
          DOM) — como a seta some depois desse conteúdo, ela "anda" junto com a
          animação de largura e termina ao lado do MyAnimeList. Um novo clique
          fecha tudo e ela volta pra perto do Anime-Planet (ver JS: listener em
          "lightboxMal"). */
        .watch-now-toggle {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex: 0 0 auto;
          width: 22px;
          height: 22px;
          padding: 0;
          border: none;
          background: none;
          color: var(--muted);
          cursor: pointer;
          transition: color 0.15s ease, transform 0.35s ease;
        }

        .watch-now-toggle svg {
          width: 14px;
          height: 14px;
        }

        .watch-now-toggle:hover,
        .watch-now-toggle:focus-visible {
          color: var(--text);
        }

        /* Passar o mouse em qualquer uma das duas setas acende o hover nas duas
          juntas (classe "toggle-hover" entra no container via JS — ver
          "handleWatchNowAreaMouseOver"/"handleWatchNowAreaMouseOut"). */
        .watch-now-links.toggle-hover .watch-now-toggle {
          color: var(--text);
        }

        .watch-now-links.open .watch-now-toggle {
          transform: rotate(180deg);
        }

        /* Seta espelhada do lado esquerdo (antes do Anime-Planet): mesmo botão
          e mesmo listener da seta da direita (ambas têm a classe
          ".watch-now-toggle" e abrem/fecham o mesmo ".watch-now-links"), só
          que virada pra esquerda visualmente. */
        .watch-now-toggle--left {
          transform: scaleX(-1);
          margin-right: 16px;
        }

        .watch-now-toggle--left:hover,
        .watch-now-toggle--left:focus-visible {
          color: var(--text);
        }

        .watch-now-links.open .watch-now-toggle--left {
          transform: scaleX(-1) rotate(180deg);
        }

        /* Crunchyroll/MyAnimeList começam escondidos (largura 0, invisíveis) e
          só se revelam com uma animação de expansão + fade quando a seta é
          clicada (classe "open" entra no ".watch-now-links" pai). O
          "margin-right" some junto com o "max-width" pra seta ficar coladinha
          no Anime-Planet enquanto fechada, sem espaço reservado à toa. */
        .watch-now-extra {
          display: inline-flex;
          align-items: center;
          flex-shrink: 0;
          gap: 16px;
          max-width: 0;
          margin-right: 0;
          opacity: 0;
          overflow: hidden;
          white-space: nowrap;
          transform: translateX(-8px);
          transition: max-width 0.35s ease, margin-right 0.35s ease, opacity 0.25s ease, transform 0.25s ease;
        }

        .watch-now-links.open .watch-now-extra {
          max-width: 320px;
          margin-right: 16px;
          opacity: 1;
          transform: translateX(0);
        }

        /* No mobile, tudo tenta caber numa linha só, reduzindo levemente
          logos/gaps/fonte pra abrir espaço. Quando NÃO cabe mesmo assim (ex:
          ao abrir a seta e revelar Crunchyroll/MyAnimeList numa tela bem
          estreita), o bloco QUEBRA LINHA (flex-wrap) em vez de rolar na
          horizontal — evita por completo qualquer sobreposição de seta em
          cima de texto, já que nada precisa ficar "grudado"/sticky nem
          passar por baixo de nada (ver JS: a rolagem horizontal ainda existe
          como rede de segurança, mas na prática deixa de ser necessária
          porque o wrap já resolve o espaço). */
        @media (max-width: 760px) {
          .watch-now-links {
            justify-content: center;
            flex-wrap: wrap;
            row-gap: 8px;
          }

          .watch-now-links .rank-mal-label--anime-planet {
            margin-right: 8px;
          }

          .watch-now-extra {
            gap: 8px;
            /* Desliza da esquerda, igual ao PC — agora que o bloco aberto
              também fica numa linha só no mobile (ver ".watch-now-links.open"
              logo abaixo), não faz mais sentido deslizar de cima pra baixo. */
            transform: translateX(-8px);
          }

          .watch-now-links.open .watch-now-extra {
            margin-right: 8px;
            /* Sem animar "max-width" no mobile: como o layout agora pode
              quebrar linha, animar a largura faria os botões "pularem" de
              linha no meio da transição. Só o fade + deslize horizontal
              continuam animados. */
            max-width: none;
            transform: translateX(0);
            transition: opacity 0.25s ease, transform 0.25s ease;
          }

          /* Ao abrir, tudo fica numa linha só (Anime-Planet + Crunchyroll +
            MyAnimeList), sem quebrar — se não couber, rola na horizontal
            (ver ".watch-now-links" overflow-x:auto). As setas continuam
            visíveis mesmo aberto, pra dar pra fechar de volta clicando nelas
            de novo (mesmo toggle usado pra abrir — ver JS:
            handleWatchNowAreaClick). */
          .watch-now-links.open {
            flex-wrap: nowrap;
          }

          .watch-now-links .rank-mal-label {
            font-size: 10px;
            gap: 4px;
          }

          /* "MORE INFO" maior que o resto dos labels (10px) também no
            mobile — só ele, o resto (Crunchyroll/Anime-Planet/MyAnimeList
            quando abertos) continua no tamanho normal. */
          .watch-now-more-info-text {
            font-size: 13px;
            letter-spacing: 0.06em;
          }

          .watch-now-links .rank-mal-label--crunchyroll .crunchyroll-btn-logo,
          .watch-now-links .rank-mal-label--netflix .netflix-btn-logo,
          .watch-now-links .rank-mal-label--anime-planet .anime-planet-btn-logo,
          .watch-now-links .rank-mal-label--mal .mal-btn-logo {
            height: 15px;
          }

          .watch-now-links .rank-mal-label--crunchyroll .crunchyroll-btn-logo--youtube {
            height: 17px;
          }

          /* Ícone de "link externo" ao lado de cada nome some no mobile — ele
            não é essencial (as setas já indicam que dá pra clicar/expandir) e
            cada um custa ~16px de largura; sem eles sobra espaço suficiente
            pra Anime-Planet + Crunchyroll + MyAnimeList + as DUAS setas
            caberem numa linha só, sem cortar a seta da direita. */
          .watch-now-links a.rank-mal-label svg {
            display: none;
          }

          .watch-now-toggle {
            width: 16px;
            height: 16px;
          }

          .watch-now-toggle svg {
            width: 11px;
            height: 11px;
          }

          .watch-now-toggle--left {
            margin-right: 8px;
          }
        }

        .rank-mal-label--crunchyroll .crunchyroll-btn-logo {
          display: block;
          width: auto;
          height: 17px;
          max-width: none;
          object-fit: contain;
          border-radius: 0;
          box-shadow: none;
          transform-origin: left center;
          transition: transform 0.15s ease, filter 0.15s ease;
        }

        /* Logo do YouTube (usada no lugar da Crunchyroll quando o link é do
          YouTube, ex.: Golden Boy) fica visualmente um pouco menor que as
          outras nesse mesmo tamanho de altura, então aumenta só ela. */
        .rank-mal-label--crunchyroll .crunchyroll-btn-logo--youtube {
          height: 19px;
        }

        .rank-mal-label--netflix .netflix-btn-logo {
          display: block;
          width: auto;
          height: 17px;
          max-width: none;
